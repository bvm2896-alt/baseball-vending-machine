<!doctype html>
<!-- 야구자판기 롱폼 썸네일 '계약 카드형(contract)' 1280x720 (2026-10-08 신설, 롱폼⑨ 외국인 선수 재계약)
     구도: 짙은 남색 밤 구장(위 조명 빛 + 아래 어둠) 위에 선수 공식 프로필 카드 여러 장이 부채꼴로 펼쳐지고(구단 로고 배지 + 이름 띠),
           가운데 카드 위에 빨간 고무 도장 「재계약?」이 비스듬히 찍힌다. 아래 두 줄 큰 글씨(흰 + 노랑).
     보정: 사진은 원본 그대로 + 아주 약한 대비·채도(grade)만. 카드 흰 테두리 + 같은 방향 그림자로 한 장면처럼 묶는다.
     콘티 thumb: {"layout":"contract","cards":[{img,name,team,rot,dy}], "kicker":"…", "stamp":"재계약?", "lines":[[{t,c,s}]], "cardW":214} -->
<html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:'GM';src:url('__FONT_DIR__/GmarketSansBold.ttf') format('truetype')}
@font-face{font-family:'NB';src:url('__FONT_DIR__/NotoSansKR-Black.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
body{font-family:'GM','NB',sans-serif;color:#fff}
#s{position:relative;width:1280px;height:720px;overflow:hidden;
  background:radial-gradient(ellipse 900px 420px at 50% -60px,rgba(120,170,255,.45),rgba(30,60,140,.18) 55%,rgba(0,0,0,0) 75%),
             radial-gradient(ellipse 700px 300px at 50% 330px,rgba(40,90,200,.35),rgba(0,0,0,0) 70%),
             linear-gradient(180deg,#0E1D45 0%,#0A1533 45%,#050A1A 100%)}
#lines{position:absolute;inset:0;opacity:.07;background:repeating-linear-gradient(115deg,#fff 0 2px,transparent 2px 46px)}
#kick{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:34px;letter-spacing:6px;color:#FFE27A;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:6}
#fan{position:absolute;left:0;right:0;top:78px;height:330px;z-index:3}
.c{position:absolute;top:0;background:#fff;border-radius:16px;padding:7px 7px 0;box-shadow:10px 18px 30px rgba(0,0,0,.55)}
.c .ph{position:relative;border-radius:10px;overflow:hidden;background:#E9EDF3}
.c .ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 12%;filter:contrast(1.04) saturate(1.05)}
.c .nm{height:46px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:28px;color:#0B1530;letter-spacing:-1px;white-space:nowrap}
.c .lg{position:absolute;right:6px;top:6px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.c .lg img{width:42px;height:42px;object-fit:contain}
#stamp{position:absolute;z-index:5;left:50%;top:205px;translate:-50% 0;rotate:-12deg;border:10px solid #E5202E;border-radius:22px;padding:4px 30px 10px;color:#E5202E;
  font-size:96px;letter-spacing:-3px;background:rgba(255,255,255,.88);box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:nowrap}
#floor{position:absolute;left:0;right:0;bottom:0;height:330px;z-index:4;background:linear-gradient(180deg,rgba(5,10,26,0) 0%,rgba(5,10,26,.85) 40%,rgba(5,10,26,.98) 100%)}
#txt{position:absolute;left:0;right:0;bottom:22px;z-index:6;display:flex;flex-direction:column;align-items:center}
.t{display:inline-block;line-height:1.04;letter-spacing:-4px;white-space:nowrap;text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.6)}
</style></head><body><div id="s"><div id="lines"></div><div id="kick"></div><div id="fan"></div><div id="stamp"></div><div id="floor"></div><div id="txt"></div></div>
<script>
const TH=(window.EP&&EP.thumb)||{}, P=(window.EP&&EP.photos)||{}, LG=(window.EP&&EP.logos)||{};
const AL={'KIA':'HT','기아':'HT','SSG':'SK','두산':'OB','삼성':'SS','롯데':'LT','한화':'HH','키움':'WO','LG':'LG','KT':'KT','NC':'NC'};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const src=n=>{if(!n)return '';if(P[n])return P[n];const k=Object.keys(P).find(x=>x.endsWith(n)||n.endsWith(x));return k?P[k]:''};
document.getElementById('kick').textContent=TH.kicker||'';
const cs=TH.cards||[], n=cs.length, W=TH.cardW||214, H=Math.round(W*1.22), gap=TH.gap||(-14), tot=n*W+(n-1)*gap, x0=(1280-tot)/2;
document.getElementById('fan').innerHTML=cs.map((c,i)=>{const mid=(n-1)/2, rot=c.rot!=null?c.rot:(i-mid)*4, dy=c.dy!=null?c.dy:Math.abs(i-mid)*16, lg=LG[AL[c.team]||c.team];
  return `<div class="c" style="left:${x0+i*(W+gap)}px;top:${dy}px;width:${W+14}px;rotate:${rot}deg;z-index:${10-Math.abs(Math.round(i-mid))}">
    <div class="ph" style="height:${H}px"><img src="${src(c.img)}">${lg?`<div class="lg"><img src="${lg}"></div>`:''}</div><div class="nm">${esc(c.name)}</div></div>`}).join('');
const st=document.getElementById('stamp'); if(TH.stamp){st.textContent=TH.stamp; if(TH.stampTop!=null)st.style.top=TH.stampTop+"px"; if(TH.stampSize)st.style.fontSize=TH.stampSize+"px"} else st.remove();
document.getElementById('txt').innerHTML=(TH.lines||[]).map(L=>`<div>${L.map(p=>`<span class="t" style="font-size:${p.s||100}px;color:${p.c||'#fff'}">${esc(p.t)}</span>`).join('')}</div>`).join('');
(async()=>{try{await document.fonts.ready}catch(e){} window.__thumbDone=true})();
</script></body></html>
