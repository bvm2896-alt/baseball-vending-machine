<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* ===== 디자인 시스템 =====
   캔버스 1080x1920. 좌우 여백 90 → 콘텐츠 폭 900.
   세로: 상단 헤더 236~330 / 본문 400~1180 (세로 중앙 정렬) / 자막 1244~ / 하단 360px 은 유튜브 UI 영역이라 비움
   타이포 스케일: mega 168 / big 120 / num 104 / title 48 / label 34
   로고 칩: L 220 / M 150 / S 72 (흰 바탕, 둥근 사각형)
   색: 배경 #1B2230, 카드 #262F40, 선 #3A4560, 글 #F2F5F8, 보조 #A3ADBE, 강조 #FFC24B, 승 #3ECF8E, 패 #FF6B6B */
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_bold.ttf') format('truetype');font-weight:700 900}
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_medium.ttf') format('truetype');font-weight:400 600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1B2230}
body{font-family:'KBO','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:700;-webkit-font-smoothing:antialiased;color:#F2F5F8}
#stage{position:relative;width:1080px;height:1920px;
  background:radial-gradient(88% 52% at 50% 30%, rgba(70,110,150,.32) 0%, rgba(27,34,48,0) 70%),#1B2230}
.num{font-variant-numeric:tabular-nums;letter-spacing:-2px}
/* 헤더 */
#hdr{position:absolute;left:90px;right:90px;top:236px;height:94px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #3A4560}
#brand{display:flex;align-items:center;gap:16px;font-size:50px;font-weight:900;letter-spacing:-1px}
#brand .m{width:12px;height:44px;border-radius:6px;background:#FFC24B}
#brand b{color:#FFC24B;font-weight:900}
#meta{text-align:right;line-height:1.15}
#meta .t{font-size:44px;font-weight:800;letter-spacing:2px}
#meta .d{font-size:38px;font-weight:600;color:#B4BCC8;letter-spacing:1px}
/* 본문 */
#body{position:absolute;left:90px;width:900px;top:400px;height:820px;will-change:opacity,transform;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* 자막 */
#sub{position:absolute;left:70px;right:70px;top:1270px;text-align:center}
#sub span{display:inline;background:rgba(27,34,48,.94);color:#F2F5F8;font-size:56px;font-weight:700;
  letter-spacing:-1px;line-height:1.7;padding:10px 20px;border-radius:16px;word-break:keep-all;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
/* 타이포 */
.mega{font-size:186px;font-weight:900;letter-spacing:-6px;line-height:1.04}
.big{font-size:136px;font-weight:900;letter-spacing:-4px;line-height:1.05}
.title{font-size:48px;font-weight:700;letter-spacing:-1.5px}
.label{font-size:34px;font-weight:600;color:#A3ADBE;letter-spacing:-1px}
.gold{color:#FFC24B}.green{color:#3ECF8E}.red{color:#FF6B6B}.gray{color:#A3ADBE}
/* 레이아웃 */
.row{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center}
.chip{background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chip img{width:84%;height:84%;object-fit:contain;display:block}
/* 스탯 카드: 두 장이 항상 같은 폭 */
.card{width:430px;height:520px;background:#262F40;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.card .v{font-size:118px;font-weight:900;letter-spacing:-4px;line-height:1.05;white-space:nowrap}
.card .v.two{font-size:96px}
.card .l{font-size:36px;font-weight:600;color:#A3ADBE;letter-spacing:-1px}
/* 사진 틀(9/16 — 순위 편에도 선수 사진 장면 photo/people 지원) */
.photo{position:relative;width:900px;border-radius:36px;overflow:hidden;background:#262F40;border:3px solid #34405A;box-shadow:0 18px 50px rgba(0,0,0,.35);flex:0 0 auto}
.photo img,.pp img{width:100%;height:100%;object-fit:cover;display:block}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 30px;background:linear-gradient(180deg,rgba(11,15,20,0),rgba(11,15,20,.78));color:#fff;font-size:34px;font-weight:700;text-align:left;letter-spacing:-1px}
.photo .tag{position:absolute;left:26px;top:26px;background:rgba(255,255,255,.94);color:#12161F;font-size:32px;font-weight:800;padding:10px 22px;border-radius:999px;letter-spacing:-1px}
.pane{background:#262F40;border:3px solid #34405A;box-shadow:0 14px 40px rgba(0,0,0,.3)}
/* 연승/연패 카드: 항상 전체 폭 */
.sk{width:900px;height:170px;background:#262F40;border-radius:32px;display:flex;align-items:center;padding:0 40px;gap:26px}
.sk .nm{font-size:50px;font-weight:800;letter-spacing:-1.5px;width:150px;text-align:left}
.sk .dots{display:flex;gap:11px;flex:1;justify-content:center}
.sk .dot{width:34px;height:34px;border-radius:17px;background:#3A4560}
.sk .st{font-size:50px;font-weight:900;letter-spacing:-1.5px;width:170px;text-align:right}
/* 순위표 */
#table{width:900px}
#table .hd{display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:2px solid #F2F5F8;font-size:24px;font-weight:700;color:#A3ADBE;letter-spacing:1px}
.tr{display:flex;align-items:center;gap:16px;height:76px;border-bottom:1px solid #3A4560}
.tr .rk{width:52px;font-size:34px;font-weight:800;text-align:center}
.tr .tm{width:190px;display:flex;align-items:center;gap:14px}
.tr .nm{font-size:38px;font-weight:800;letter-spacing:-1.5px;white-space:nowrap}
.tr .bw{flex:1;height:30px;position:relative}
.tr .bar{position:absolute;left:0;top:0;height:30px;border-radius:0 15px 15px 0}
.tr .gp{width:100px;font-size:32px;font-weight:600;text-align:right;color:#A3ADBE}
.tr .wr{width:120px;font-size:38px;font-weight:800;text-align:right;letter-spacing:-1.5px}
/* 9/22 구독 유도: 마지막 자막("채널 구독하고…")이 뜨는 동안 유튜브 쇼츠 '구독' 버튼(아이폰·안드로이드 모두 화면 왼쪽 아래, 채널 이름 오른쪽, 세로 79~80% 지점) 바로 위를 화살표로 가리킨다. 자막(1270~1420)과 유튜브 UI 띠(1490~)를 안 가리는 1400~1485 사이에만 그린다 */
#subhint{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;visibility:hidden}
#subhint .arrow{position:absolute;left:606px;top:1478px;width:132px;height:90px;transform-origin:0 50%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
</style></head><body>
<div id="stage">
  <div id="hdr">
    <div id="brand"><div class="m"></div><div>야구<b>자판기</b></div></div>
    <div id="meta"><div class="t" id="railTitle">KBO 순위</div><div class="d num" id="railDate"></div></div>
  </div>
  <div id="body"></div>
  <div id="sub"><span></span></div>
  <div id="subhint"><svg class="arrow" viewBox="0 0 132 90"><defs><linearGradient id="shg" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7F9"/><stop offset="1" stop-color="#3B6BFF"/></linearGradient></defs><path d="M8 45 L60 8 L60 29 L112 29 Q124 29 124 45 Q124 61 112 61 L60 61 L60 82 Z" fill="url(#shg)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/></svg></div>
</div>

<script>
/* ==== 데이터: build.py 가 window.EP 를 주입한다 ==== */
const EP = window.EP || {};
const D = (EP.standings || []).map(t => ({
  rk: t.rank, nm: t.team, code: t.code, wr: t.winRate, gb: Number(t.gameBehind).toFixed(1),
  g: t.games, st: t.streak, win: t.win, lose: t.lose, draw: t.draw }));
const LOGO = EP.logos || {}, PHOTO = EP.photos || {}, TXT = '#F2F5F8';
const ACC = '#FFC24B', GREEN = '#3ECF8E', RED = '#FF6B6B', GRAY = '#A3ADBE';
const TEAMCOL = { SS: '#074CA1', KT: '#4A4A4A', LG: '#C30452', HT: '#EA0029', OB: '#2B2A5E', NC: '#315288', LT: '#1E3A6B', SK: '#CE0E2D', HH: '#FC4E00', WO: '#820024' };
document.getElementById('railDate').textContent = EP.dateLabel || '';
if (EP.railTitle) document.getElementById('railTitle').textContent = EP.railTitle;
const WRS = D.map(t => t.wr);
const LO = Math.min(...WRS, .4) - .03, HI = Math.max(...WRS, .6) + .02, BM = 330;

const c01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const eo = t => 1 - Math.pow(1 - c01(t), 3);
const eb = t => { t = c01(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const seg = (lt, a, d) => c01((lt - a) / d);
const fmt = w => w.toFixed(3).replace(/^0/, '');
const ALIAS = { '기아': 'HT', 'KIA': 'HT', '엘지': 'LG', '케이티': 'KT', '엔씨': 'NC', '에스에스지': 'SK', 'SSG': 'SK', '두산': 'OB', '삼성': 'SS', '롯데': 'LT', '한화': 'HH', '키움': 'WO' };
const T = n => D.find(t => t.nm === n || t.code === n || t.code === ALIAS[n]) || { nm: n, code: ALIAS[n] || n };
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const br = s => esc(s).split('\n').join('<br>');
const SZ = { L: [300, 64], M: [190, 42], S: [62, 14] };   // S 는 순위표 행(76px) 안에 여유 있게
function chip(t, size = 'M', extra = '') {
  const [s, r] = SZ[size];
  return `<div class="chip" style="width:${s}px;height:${s}px;border-radius:${r}px;${extra}"><img src="${LOGO[t.code] || ''}"></div>`;
}
/* 로고 옆에 붙는 표시(💧 🔥 ;; …): 동그라미 없이 그냥 로고 오른쪽 위에 겹쳐 붙는다. 얼굴 이모지는 쓰지 않는다. p = 등장 진행도(0~1) */
const EMOJI = "font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji','KBO',sans-serif";
function chipM(t, size = 'M', mark = '', p = 1, extra = '') {
  if (!mark) return chip(t, size, extra);
  const isText = !/\p{Extended_Pictographic}/u.test(mark);   // ";;" 같은 글자 표시
  const fs = (size === 'L' ? 104 : 80) * (isText ? 1.1 : 1);
  const style = isText ? `font-family:'KBO';font-weight:900;color:#F2F5F8;text-shadow:0 4px 18px rgba(0,0,0,.8),0 0 6px #1B2230` : EMOJI + ';filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))';
  return `<div style="position:relative;display:inline-block;flex:0 0 auto">${chip(t, size, extra)}
    <div style="position:absolute;right:-${fs * .45}px;top:-${fs * .35}px;font-size:${fs}px;line-height:1;${style};opacity:${c01(p * 1.5)};transform:scale(${0.4 + 0.6 * eb(p)}) rotate(${(1 - eb(p)) * -25 + 8}deg)">${esc(mark)}</div></div>`;
}
const markOf = (s, n, i) => (s.marks && (s.marks[n] || s.marks[i] || s.marks[String(i)])) || '';
/* 다음 상대 병기: 주인공 로고 아래에 "vs [작은 로고] LG" 를 붙인다. next 는 {팀:상대} 또는 상대 이름 하나 */
const nextOf = (s, n, i) => (s.next && (typeof s.next === 'string' || Array.isArray(s.next) ? (i === 0 ? s.next : '') : (s.next[n] || s.next[i] || s.next[String(i)]))) || '';
/* next 가 배열이면 "vs [로고][로고][로고]" 로 상대 여러 팀을 다 붙인다(9/16 — 상대 3팀인데 로고 하나만 나오던 문제) */
function withNext(chipHtml, opp, p = 1, note = '') {
  if (!opp || (Array.isArray(opp) && !opp.length)) return chipHtml;
  if (Array.isArray(opp)) {
    const os = opp.map(T);
    return `<div class="col" style="gap:14px">${chipHtml}
    <div class="row" style="gap:8px;${rise(p, 24)}"><span class="label" style="font-size:30px">vs</span>${os.map(o => chip(o, 'S')).join('')}${note ? `<span class="label" style="font-size:28px">${esc(note)}</span>` : ''}</div></div>`;
  }
  const o = T(opp);
  return `<div class="col" style="gap:14px">${chipHtml}
    <div class="row" style="gap:10px;${rise(p, 24)}"><span class="label" style="font-size:30px">vs</span>${chip(o, 'S')}<span class="label" style="font-size:32px;color:#F2F5F8">${esc(o.nm)}</span>${note ? `<span class="label" style="font-size:28px">${esc(note)}</span>` : ''}</div></div>`;
}
function B(h) {
  const body = document.getElementById('body'); body.innerHTML = h;
  // 큰 글씨가 폭(900)을 넘으면 단어 중간에서 줄바꿈되지 않도록 폰트를 줄인다. 세로(820)도 넘치면 줄인다
  // 카드 안 큰 숫자·글자(.card .v)도 카드 폭(430)을 넘으면 줄인다(9/16 — "익숙하다" 가 카드 밖으로 나감)
  [...body.querySelectorAll('.card .v')].forEach(el => { el.style.whiteSpace = 'pre'; let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > 380 && fs > 44) { fs -= 4; el.style.fontSize = fs + 'px'; } });
  const els = [...body.querySelectorAll('.mega,.big')];
  els.forEach(el => { el.style.whiteSpace = 'nowrap'; let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > 900 && fs > 56) { fs -= 4; el.style.fontSize = fs + 'px'; } });
  const used = () => [...body.children].reduce((a, c) => a + c.offsetHeight + (parseFloat(getComputedStyle(c).marginTop) || 0) + (parseFloat(getComputedStyle(c).marginBottom) || 0), 0);
  for (let k = 0; k < 30 && els.length && used() > 820; k++)
    els.forEach(el => { const fs = parseFloat(getComputedStyle(el).fontSize); if (fs > 56) el.style.fontSize = (fs - 4) + 'px'; });
}
const pop = p => `opacity:${c01(p * 1.4)};transform:scale(${0.6 + 0.4 * eb(p)})`;
const rise = (p, px = 60) => `opacity:${c01(p * 1.4)};transform:translateY(${(1 - eo(p)) * px}px)`;
const slideX = (p, px) => `opacity:${c01(p * 1.4)};transform:translateX(${(1 - eo(p)) * px}px)`;
const cnt = (p, v, dec = 0) => (v * eo(p)).toFixed(dec);
const stColor = st => /승/.test(st) ? GREEN : /패/.test(st) ? RED : GRAY;
const stN = st => parseInt(st) || 0;
const stLabel = st => /^\d+(승|패)$/.test(st) && parseInt(st) >= 2 ? st.replace(/(승|패)$/, '연$1') : st;
const winLose = (w, l) => `${w}승<br>${l}패`;

const SCENE = {};

/* hook: 로고(1~2개) + 큰 문구. 서브텍스트 없음 */
SCENE.hook = (lt, s) => {
  const pulse = 1 + 0.02 * Math.sin(lt * 4), p = seg(lt, .35, .7);
  const teams = s.teams || (s.team ? [s.team] : []);
  const logos = teams.length ? `<div class="row" style="gap:${teams.length > 1 ? 56 : 40}px;align-items:flex-start;${pop(seg(lt, 0, .55))}">${teams.map((n, i) => withNext(chipM(T(n), teams.length > 1 ? 'M' : 'L', markOf(s, n, i), seg(lt, .7, .4)), nextOf(s, n, i), seg(lt, .8, .4))).join('')}</div>` : '';
  B(`${logos}<div class="mega gold" style="margin-top:${teams.length ? 44 : 0}px;font-size:${s.size || 168}px;opacity:${c01(p * 1.4)};transform:scale(${(0.6 + 0.4 * eb(p)) * (lt > 1.1 ? pulse : 1)})">${br(s.text)}</div>`);
};

/* 번호 배지(❶): big/matchup 장면에서 num 또는 text 앞의 ①/1./첫째 */
function numBadge(lt, num, label) {
  if (!num) return '';
  // 글자를 붙이면("변수 1") 동그라미 숫자 대신 알약 배지(9/16 사용자 규칙: 동그라미 안에 1만 따로 두지 않는다)
  if (label) return `<div class="row" style="margin:30px 0;${pop(seg(lt, .1, .5))}"><div class="num" style="height:96px;padding:0 40px;border-radius:20px;background:${ACC};color:#0B0F14;font-size:56px;font-weight:900;letter-spacing:-1px;display:flex;align-items:center;justify-content:center;gap:16px"><span style="font-size:46px;font-weight:800;opacity:.9">${esc(label)}</span><span>${num}</span></div></div>`;
  return `<div class="row" style="margin:30px 0;${pop(seg(lt, .1, .5))}"><div class="num" style="width:104px;height:104px;border-radius:50%;background:${ACC};color:#0B0F14;font-size:66px;font-weight:900;letter-spacing:0;display:flex;align-items:center;justify-content:center">${num}</div></div>`;
}

function photoSrc(name) {
  if (!name) return '';
  if (PHOTO[name]) return PHOTO[name];
  const base = String(name).replace(/\.[a-z0-9]+$/i, '');
  const k = Object.keys(PHOTO).find(x => x === base || x.replace(/\.[a-z0-9]+$/i, '') === base);
  return k ? PHOTO[k] : '';
}
/* 사진 틀: 사진이 있으면 사진, 없으면 팀 로고가 든 연한 상자(렌더가 멈추지 않게). h=높이, focus=object-position(top/center) */
const PSIZE = EP.photoSizes || {};
function photoSize(name) {
  if (!name) return null;
  const base = String(name).replace(/\.[a-z0-9]+$/i, '');
  const k = Object.keys(PSIZE).find(x => x === name || x === base || x.replace(/\.[a-z0-9]+$/i, '') === base);
  return k ? PSIZE[k] : null;
}
/* 사진을 틀(w×h)에 어떻게 넣을지 — 얼굴이 잘리지 않게:
   · 잘라 채우기(cover)는 사진이 틀보다 크고(1.15배 넘게 늘릴 필요 없음) 비율도 비슷할 때만. 자를 땐 위쪽(얼굴) 기준.
   · 그 외(작은 사진, 세로 사진을 가로 틀에, 투명 배경 png)는 늘리지 않고 통째로 보이게(contain) 놓고,
     뒤는 같은 사진을 흐리게 깔거나(투명 png 는 단색) 채운다.  s.fit = 'cover' | 'contain' 으로 강제 가능 */
function photoImg(s, src, w, h, focus) {
  const sz = photoSize(s.img), alpha = sz && sz[2];
  let fit = s.fit;
  if (!fit) {
    if (!sz) fit = 'cover';
    else {
      const coverScale = Math.max(w / sz[0], h / sz[1]), ratio = (sz[0] / sz[1]) / (w / h);
      fit = (!alpha && coverScale <= 1.15 && ratio > 0.72 && ratio < 1.4) ? 'cover' : 'contain';
    }
  }
  if (fit === 'cover') return `<img src="${src}" style="object-position:${esc(s.focus || focus || '50% 12%')}">`;
  const scale = sz ? Math.min(1.25, w / sz[0], h / sz[1]) : 1, iw = sz ? Math.round(sz[0] * scale) : 'auto', ih = sz ? Math.round(sz[1] * scale) : 'auto';
  const back = alpha
    ? `<div style="position:absolute;inset:0;background:linear-gradient(160deg,#2C3548,#1E2533)"></div>`
    : `<img src="${src}" style="position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) saturate(1.1);opacity:.85"><div style="position:absolute;inset:0;background:rgba(18,22,31,.12)"></div>`;
  return `${back}<img src="${src}" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:${iw}${sz ? 'px' : ''};height:${ih}${sz ? 'px' : ''};object-fit:contain;${alpha ? '' : 'border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.35)'}">`;
}
function photoBox(s, h = 560, p = 1, extra = '') {
  const src = photoSrc(s.img), team = s.team || (s.teams || [])[0];
  const inner = src
    ? photoImg(s, src, 900, h)
    : `<div class="col" style="width:100%;height:100%;background:linear-gradient(160deg,#2C3548,#1E2533)">${team ? chip(T(team), 'L') : ''}</div>`;
  const tag = s.tag ? `<div class="tag">${esc(s.tag)}</div>` : '';
  const cap = s.caption ? `<div class="cap">${br(s.caption)}</div>` : '';
  return `<div class="photo" style="height:${h}px;${rise(p, 40)};${extra}">${inner}${tag}${cap}</div>`;
}

/* big: 큰 문구 하나 (로고 선택). 서브텍스트 없음 */
SCENE.big = (lt, s) => {
  // 번호("① …", "1. …", "첫째 …")는 본문과 같은 줄에 두지 않고 위에 동그란 배지로 따로 뺀다
  let text = s.text || '', num = s.num || '';
  const m = text.match(/^\s*(?:([①②③④⑤])|([1-5])[.)]|(첫째|둘째|셋째|넷째|다섯째))\s*/);
  if (!num && m) { num = m[1] ? '①②③④⑤'.indexOf(m[1]) + 1 : m[2] ? m[2] : ['첫째', '둘째', '셋째', '넷째', '다섯째'].indexOf(m[3]) + 1; text = text.slice(m[0].length); }
  const badge = numBadge(lt, num, s.numLabel);
  B(`${s.team ? `<div style="${pop(seg(lt, 0, .5))}">${chipM(T(s.team), num ? 'M' : 'L', s.mark || markOf(s, s.team, 0), seg(lt, .8, .4))}</div>` : ''}${badge}
  <div class="mega ${s.gold === false ? '' : 'gold'}" style="margin-top:${s.team && !num ? 44 : 0}px;font-size:${s.size || 168}px;${pop(seg(lt, .25, .6))}">${br(text)}</div>`);
};

/* matchup: 두 팀 로고(이모지 배지 가능) + 가운데 vs + 큰 문구. 상대전적·맞대결 얘기에. {left:'기아', right:'NC', marks:{'기아':'😰','NC':'😎'}, text:'NC전\n2승 10패'} */
SCENE.matchup = (lt, s) => {
  const L = T(s.left), R = T(s.right);
  B(`<div class="row" style="gap:36px;align-items:flex-start">
    <div style="${slideX(seg(lt, 0, .5), -160)}">${withNext(chipM(L, 'M', markOf(s, s.left, 0), seg(lt, .75, .4)), nextOf(s, s.left, 0), seg(lt, .85, .4))}</div>
    <div class="title gray" style="font-size:56px;height:190px;display:flex;align-items:center;opacity:${seg(lt, .4, .3)}">${esc(s.vsText || 'vs')}</div>
    <div style="${slideX(seg(lt, 0, .5), 160)}">${withNext(chipM(R, 'M', markOf(s, s.right, 1), seg(lt, .95, .4)), nextOf(s, s.right, 1), seg(lt, 1.05, .4))}</div></div>
  ${numBadge(lt, s.num)}<div class="mega ${s.gold === false ? '' : 'gold'}" style="margin-top:${s.num ? 0 : 44}px;font-size:${s.size || 150}px;${pop(seg(lt, .45, .6))}">${br(s.text || '')}</div>`);
};

/* table: 순위표 */
SCENE.table = (lt, s) => {
  const p = seg(lt, .15, 1.6), hiSet = new Set(s.highlight || []);
  const rows = D.slice(0, s.rows || 10);
  let h = `<div id="table"><div class="hd" style="opacity:${seg(lt, 0, .3)}"><div style="width:52px;text-align:center">순위</div>
    <div style="width:190px">팀</div><div style="flex:1"></div><div style="width:100px;text-align:right">게임차</div><div style="width:120px;text-align:right">승률</div></div>`;
  rows.forEach((t, i) => {
    const loc = c01((p - i * 0.045) / 0.55);
    const px = BM * ((t.wr - LO) / (HI - LO)) * eo(loc);
    const hi = hiSet.has(t.nm);
    const glow = hi ? `box-shadow:0 0 ${26 * seg(lt, 1.6, .6)}px rgba(255,194,75,${.45 * seg(lt, 1.6, .6)})` : '';
    h += `<div class="tr" style="opacity:${hi ? 1 : .5 * c01(loc * 2)};transform:translateX(${(1 - eo(c01(loc * 1.5))) * -30}px);${hi ? 'background:rgba(255,194,75,.07);border-radius:14px;margin:0 -14px;padding:0 14px;border-bottom-color:transparent' : ''}">
      <div class="rk num" style="color:${hi ? ACC : '#7A8594'}">${t.rk}</div>
      <div class="tm">${chip(t, 'S')}<div class="nm" style="color:${hi ? ACC : '#F2F5F8'}">${esc(t.nm)}</div></div>
      <div class="bw"><div class="bar" style="width:${px.toFixed(1)}px;background:${hi ? ACC : 'rgba(242,245,248,.36)'};${glow}"></div></div>
      <div class="gp num" style="opacity:${c01((loc - .4) * 3)};color:${hi ? '#F2F5F8' : GRAY}">${t.gb}</div>
      <div class="wr num" style="opacity:${c01((loc - .5) * 3)};color:${hi ? ACC : '#F2F5F8'}">${fmt(t.wr)}</div></div>`;
  });
  B(h + '</div>');
};

/* streaks: 같은 폭의 카드 두 장, 점 10칸 고정 */
function dots(n, color, lt, start) {
  let h = '<div class="dots">';
  for (let i = 0; i < 10; i++) {
    const on = i < n, p = seg(lt, start + i * .12, .22);
    h += `<div class="dot" style="${on ? `background:${color};opacity:${.25 + .75 * c01(p)};transform:scale(${.6 + .4 * eb(p)})` : 'opacity:.35'}"></div>`;
  }
  return h + '</div>';
}
SCENE.streaks = (lt, s) => {
  const items = (s.teams || []).map(x => ({ t: T(x.team), st: x.streak || T(x.team).st || '' }));
  let h = '<div class="col" style="gap:34px">';
  items.forEach((it, i) => {
    const n = Math.min(stN(it.st), 10), col = stColor(it.st), t0 = i * 1.0;
    h += `<div class="sk" style="${slideX(seg(lt, i * .25, .5), i % 2 ? 120 : -120)}">${chip(it.t, 'S')}<div class="nm">${esc(it.t.nm)}</div>
      ${dots(n, col, lt, .5 + t0)}<div class="st" style="color:${col};opacity:${seg(lt, .5 + t0 + n * .12 + .1, .3)}">${esc(stLabel(it.st))}</div></div>`;
  });
  B(h + '</div>');
};

/* photo: 사진이 주인공인 장면. {img, team, text, caption, tag, focus, size} — 사진 크게(640) + 아래 큰 문구 */
SCENE.photo = (lt, s) => {
  if (!photoSrc(s.img) && !(s.team || (s.teams || [])[0])) {   // 사진도 로고도 없으면 빈 카드를 띄우지 않고 글씨만(9/15)
    const t = (s.tag && s.text && !String(s.text).includes(s.tag)) ? `${s.tag}\n${s.text}` : (s.text || s.tag || '');
    return SCENE.big(lt, { text: t, size: Math.min(s.size || 130, 120) });
  }
  B(`${photoBox(s, s.h || 640, seg(lt, 0, .6))}
  ${s.text ? `<div class="mega gold" style="margin-top:36px;font-size:${s.size || 130}px;${pop(seg(lt, .35, .6))}">${br(s.text)}</div>` : ''}`);
};

/* people: 인물 카드 1~3장. {title, items:[{img, name, team, note, bad:true|false}], text}
   사진(없으면 로고) + 이름 + 상태 한 줄. bad 면 상태 글자가 빨강, 아니면 초록 */
SCENE.people = (lt, s) => {

  h += `<div class="row" style="gap:${n === 3 ? 30 : 40}px;align-items:stretch">`;
  items.forEach((it, i) => {
    const src = photoSrc(it.img), t = it.team ? T(it.team) : null, p = seg(lt, .25 + i * .3, .5);
    const pic = src ? `<div style="position:relative;width:100%;height:${ph}px;overflow:hidden;background:#262F40"><div class="pp" style="position:absolute;inset:0">${photoImg(it, src, w, ph, it.focus || '50% 10%')}</div></div>`
      : `<div class="col" style="width:100%;height:${ph}px;background:linear-gradient(160deg,#2C3548,#1E2533)">${t ? chip(t, n === 3 ? 'M' : 'L') : ''}</div>`;
    const col = it.bad === true ? RED : it.bad === false ? GREEN : TXT;
    h += `<div class="pane" style="width:${w}px;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;${rise(p, 50)}">
      <div style="position:relative">${pic}${t && src ? `<div style="position:absolute;left:14px;top:14px">${chip(t, 'S')}</div>` : ''}</div>
      <div class="col" style="padding:22px 16px 26px;gap:10px">
        <div class="title" style="font-size:${n === 3 ? 44 : 52}px;font-weight:900">${esc(it.name || '')}</div>
        ${it.note ? `<div class="label" style="font-size:${n === 3 ? 30 : 34}px;font-weight:800;color:${col}">${br(it.note)}</div>` : ''}</div></div>`;
  });
  h += '</div>';
  if (s.text) h += `<div class="big gold" style="margin-top:34px;font-size:${s.size || 96}px;${pop(seg(lt, .4 + n * .3, .5))}">${br(s.text)}</div>`;
  B(h);
};

/* 공통: 스탯 카드 두 장 (left/right: {team, value|win/lose, label}) */
function cards(lt, L, R, opts = {}) {
  const side = (x, i, p) => {
    const v = x.value != null ? br(x.value) : winLose(cnt(p, x.win), cnt(p, x.lose));
    const two = x.value == null || String(x.value).includes('\n');
    const head = x.team ? withNext(chipM(T(x.team), 'M', x.mark || '', seg(lt, .9 + i * .3, .4)), x.next || '', seg(lt, 1.0 + i * .3, .4), x.nextNote || '') : `<div class="title" style="font-size:60px;font-weight:900;height:190px;display:flex;align-items:center">${br(x.name || '')}</div>`;   // 팀 없으면(선수 비교 등) 이름
    return `<div class="card" style="${x.next ? 'height:600px;' : ''}${rise(seg(lt, i * .35, .5), 50)}">${head}
      <div class="v num ${two ? 'two' : ''} ${i === 0 ? 'gold' : ''}" style="${i ? 'color:' + GRAY : ''}">${v}</div>
      ${x.label ? `<div class="l">${br(x.label)}</div>` : ''}</div>`;
  };
  return `<div class="row" style="gap:40px">${side(L, 0, seg(lt, .3, .9))}${side(R, 1, seg(lt, .65, .9))}</div>`;
}
SCENE.versus = (lt, s) => B(numBadge(lt, s.num, s.numLabel) + cards(lt, s.left, s.right));
SCENE.need = (lt, s) => B(numBadge(lt, s.num, s.numLabel) + cards(lt, s.left, s.right));

/* wins: 남은 경기 수와 필요 승수를 칸으로 보여준다 ("반타작이면 몇 승인지"가 한눈에).
   {rows:[{team:'삼성', total:21, need:11, label:'반타작'}, {team:'KT', total:23, need:13, label:'13승 필요'}], text:'…'(선택, 아래 문구)} */
SCENE.wins = (lt, s) => {
  const rows = s.rows || [];
  let h = '<div class="col" style="gap:30px;width:900px">';
  rows.forEach((r, i) => {
    const t = T(r.team), total = Number(r.total) || 0, need = Math.min(Number(r.need) || 0, total), t0 = .35 + i * 1.1;
    const cw = Math.min(40, Math.floor((900 - 80 - (total - 1) * 8) / Math.max(total, 1)));
    let cells = '';
    for (let k = 0; k < total; k++) {
      const on = k < need, p = seg(lt, t0 + .2 + k * .045, .25);
      cells += `<div style="width:${cw}px;height:${cw + 10}px;border-radius:8px;background:${on ? GREEN : '#3A4560'};${on ? `opacity:${.3 + .7 * c01(p)};transform:scale(${.7 + .3 * eb(p)})` : 'opacity:.55'}"></div>`;
    }
    const done = seg(lt, t0 + .2 + need * .045 + .1, .35);
    h += `<div style="width:900px;background:#262F40;border-radius:32px;padding:30px 40px;${slideX(seg(lt, i * .3, .5), i % 2 ? 120 : -120)}">
      <div class="row" style="justify-content:space-between;margin-bottom:22px">
        <div class="row" style="gap:18px">${chip(t, 'S')}<div class="title" style="font-size:46px;font-weight:800">${esc(t.nm)}</div></div>
        <div class="label num" style="font-size:38px;color:#F2F5F8">남은 <b class="gold">${total}</b>경기</div></div>
      <div class="row" style="gap:8px;justify-content:flex-start;flex-wrap:nowrap">${cells}</div>
      <div class="row" style="justify-content:space-between;margin-top:22px;opacity:${done}">
        <div class="big num" style="font-size:84px;color:${GREEN}">${need}승</div>
        <div class="label" style="font-size:40px;color:#F2F5F8">${br(r.label || '')}</div></div></div>`;
  });
  h += '</div>';
  if (s.text) h += `<div class="big gold" style="margin-top:34px;font-size:${s.size || 96}px;${pop(seg(lt, .4 + rows.length * 1.1, .5))}">${br(s.text)}</div>`;
  B(h);
};

/* schedule: 날짜별 맞대결 목록. {title:'남은 맞대결 5경기', items:[{date:'9/26', teams:['LG','기아'], place:'광주'}, …, {date:'날짜 미정', teams:[…], place:'우천 순연 2경기'}]} */
SCENE.schedule = (lt, s) => {
  const items = s.items || [];
  let h = s.title ? `<div class="title gold" style="font-size:56px;font-weight:900;margin-bottom:26px;${pop(seg(lt, 0, .4))}">${br(s.title)}</div>` : '';
  h += '<div class="col" style="gap:16px;width:900px">';
  items.forEach((it, i) => {
    const p = seg(lt, .3 + i * .22, .4), ts = it.teams || [];
    h += `<div class="row" style="width:900px;height:104px;background:#262F40;border-radius:26px;padding:0 36px;justify-content:space-between;${slideX(p, 90)}">
      <div class="num" style="font-size:44px;font-weight:800;width:250px;text-align:left;${it.tbd ? 'color:' + GRAY : ''}">${esc(it.date || '')}</div>
      <div class="row" style="gap:16px">${ts.map(n => chip(T(n), 'S')).join('<span class="label" style="font-size:30px">vs</span>')}</div>
      <div class="label" style="font-size:36px;width:250px;text-align:right;color:${it.tbd ? GRAY : '#F2F5F8'}">${esc(it.place || '')}</div></div>`;
  });
  h += '</div>';
  if (s.text) h += `<div class="big gold" style="margin-top:34px;font-size:${s.size || 96}px;${pop(seg(lt, .5 + items.length * .22, .5))}">${br(s.text)}</div>`;
  B(h);
};

/* shift: 한 팀 수치 변화 (from → to) */
SCENE.shift = (lt, s) => {
  const d = seg(lt, .9, 1.0), dec = s.dec == null ? 3 : s.dec, f = Number(s.from), to = Number(s.to);
  const z = x => dec >= 3 ? x.replace(/^0\./, '.') : x; const v = z((f - (f - to) * eo(d)).toFixed(dec)), fs = z(Number(s.from).toFixed(dec));
  B(`<div style="${pop(seg(lt, 0, .5))}">${chip(T(s.team), 'L')}</div>
  <div class="row" style="margin-top:44px;gap:40px">
    <div class="col" style="${rise(seg(lt, .3, .5))}"><div class="big num">${esc(fs)}</div>${s.fromLabel ? `<div class="label" style="margin-top:12px">${br(s.fromLabel)}</div>` : ''}</div>
    <div style="width:${110 * eo(seg(lt, .8, .5))}px;height:8px;background:${GRAY};border-radius:4px;position:relative">
      <div style="position:absolute;right:-6px;top:-10px;border:13px solid transparent;border-left:18px solid ${GRAY};opacity:${seg(lt, 1.1, .2)}"></div></div>
    <div class="col" style="opacity:${seg(lt, .9, .3)}"><div class="big num" style="color:${d > .98 ? ACC : '#F2F5F8'}">${esc(v)}</div>${s.toLabel ? `<div class="label" style="margin-top:12px">${br(s.toLabel)}</div>` : ''}</div>
  </div>`);
};

/* rival: 로고 + 문구 + 화살표 */
SCENE.rival = (lt, s) => {
  const up = ((lt * 1.2) % 1), down = s.dir === 'down';
  B(`<div style="${rise(seg(lt, 0, .7), 90)}">${chip(T(s.team), 'L')}</div>
  <div class="mega" style="font-size:130px;margin-top:40px;${pop(seg(lt, .5, .6))}">${br(s.text || '')}</div>
  <div style="margin-top:20px;font-size:70px;color:${down ? RED : ACC};opacity:${(1 - up) * seg(lt, 1, .4)};transform:translateY(${(down ? 1 : -1) * up * 50}px)">${down ? '▼' : '▲'}</div>`);
};

/* verdict: 결론 문구 + 두 팀 로고 */
SCENE.verdict = (lt, s) => {
  const drop = seg(lt, .3, .7);
  B(`${s.label ? `<div class="title gray" style="opacity:${seg(lt, 0, .4)}">${br(s.label)}</div>` : ''}
  <div class="mega gold" style="margin-top:20px;font-size:${s.size || 150}px;opacity:${c01(drop * 1.5)};transform:translateY(${(1 - eb(drop)) * -120}px)">${br(s.big || '')}</div>
  ${s.left && s.right ? `<div class="row" style="margin-top:60px;gap:36px">
    <div style="${slideX(seg(lt, 1.2, .5), -140)}">${chipM(T(s.left), 'M', markOf(s, s.left, 0), seg(lt, 1.8, .4))}</div>
    <div class="title gray" style="opacity:${seg(lt, 1.6, .4)}">vs</div>
    <div style="${slideX(seg(lt, 1.2, .5), 140)}">${chipM(T(s.right), 'M', markOf(s, s.right, 1), seg(lt, 2.0, .4))}</div></div>` : ''}`);
};

/* question: 시청자 질문 */
SCENE.question = (lt, s) => {
  B(`<div class="mega" style="font-size:${s.size || 120}px;${pop(seg(lt, 0, .6))}">${br(s.text || '여러분 생각은?')}</div>`);
};

const SUBS = EP.subs || [], BD = EP.bounds || [], SC = (EP.scenes || []);
function drawSub(t) {
  const h = SUBS.find(s => t >= s[0] && t < s[1]);
  const sp = document.querySelector('#sub span');
  sp.innerHTML = h ? br(h[2]) : ''; sp.style.visibility = h ? 'visible' : 'hidden';
  /* 9/23 구독 화살표: '구독' 자막이 시작되면 영상 끝까지 유지. 움직임은 t 기반 — 0.35초 스르륵 등장 + 1.6초 주기로 버튼 쪽으로 천천히 12px 다가갔다 돌아옴 */
  const hs = (SUBS.find(s => /구독/.test(s[2])) || [])[0];
  const on = hs !== undefined && t >= hs, hint = document.getElementById('subhint');
  if (hint) {
    hint.style.visibility = on ? 'visible' : 'hidden';
    if (on) {
      const a = hint.querySelector('.arrow'), d = t - hs, pin = Math.min(1, d / 0.35), e = 1 - Math.pow(1 - pin, 3);
      const nudge = -12 * (0.5 - 0.5 * Math.cos(2 * Math.PI * Math.max(0, d - 0.35) / 1.6));
      a.style.opacity = String(e); a.style.transform = `translateX(${(1 - e) * 40 + nudge}px) scale(${0.85 + 0.15 * e})`;
    }
  }
  document.getElementById('sub').style.top = on ? '1190px' : '';
}
/* 장면별 모션이 끝나는 시점(초). 장면 길이의 75% 안에 못 끝나면 그만큼 빠르게 재생해서 항상 끝까지 보여준다 */
const MOTION = {
  hook: () => 1.1, big: () => 0.9, matchup: () => 1.4, table: () => 2.3, versus: () => 1.6, need: () => 1.6,
  shift: () => 1.4, rival: () => 1.5, verdict: s => (s.left && s.right ? 2.1 : 1.0), question: () => 0.7,
  wins: s => { const rows = s.rows || []; const last = rows.length ? Math.min(Number(rows[rows.length - 1].need) || 0, Number(rows[rows.length - 1].total) || 0) : 0; return .35 + (rows.length - 1) * 1.1 + .2 + last * .045 + .5 + (s.text ? .5 : 0); },
  schedule: s => .3 + ((s.items || []).length) * .22 + .5 + (s.text ? .5 : 0),
  photo: () => 1.0, people: s => .25 + ((s.items || []).length) * .3 + .5 + (s.text ? .5 : 0),
  streaks: s => { const ts = s.teams || []; const last = ts.length ? Math.min(stN(ts[ts.length - 1].streak || (T(ts[ts.length - 1].team) || {}).st || ''), 10) : 0; return .5 + (ts.length - 1) * 1.0 + last * .12 + .45; },
};
function render(t) {
  let k = 0; while (k < BD.length && t >= BD[k]) k++;
  const start = k === 0 ? 0 : BD[k - 1], end = k < BD.length ? BD[k] : (EP.total || start + 3);
  const s = SC[Math.min(k, SC.length - 1)] || { type: 'big', text: '' };
  const need = (MOTION[s.type] || MOTION.big)(s), fit = Math.max(0.6, (end - start) * 0.75);
  const lt = (t - start) * (need > fit ? need / fit : 1);
  (SCENE[s.type] || SCENE.big)(lt, s);
  document.getElementById('body').style.opacity = String(c01((t - start) / 0.28));
  const gx = 50 + 3 * Math.sin(t * .5), gy = 30 + 2 * Math.cos(t * .37);
