<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* 안전 영역(9/13): 유튜브 쇼츠 목록(특히 휴대폰)이 위·아래 8~12%, 좌우 5% 를 잘라 보여주므로 날짜 배지는 190px 아래, 큰 글씨는 1660px 위, 글 폭은 940px 안에 둔다 */
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_bold.ttf') format('truetype');font-weight:700 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#161c28}
body{font-family:'KBO','Noto Sans CJK KR','Malgun Gothic',sans-serif;font-weight:900;color:#fff;-webkit-font-smoothing:antialiased}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#161c28}
.bg{position:absolute;inset:0}
.date{position:absolute;left:50%;top:190px;transform:translateX(-50%) rotate(-2deg);background:#FFC24B;color:#161c28;font-size:132px;font-weight:900;padding:26px 84px;border-radius:34px;letter-spacing:-4px;border:10px solid #111620;box-shadow:0 0 0 8px #FFC24B,0 28px 80px rgba(0,0,0,.75);white-space:nowrap}
.chip{background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.chip img{width:82%;height:82%;object-fit:contain}
.top{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-size:120px;letter-spacing:-6px;line-height:1;text-shadow:0 10px 30px rgba(0,0,0,.8)}
.bigw{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-size:320px;letter-spacing:-14px;line-height:1.05;color:#FF3B30;
  text-shadow:0 0 40px rgba(255,59,48,.6),0 16px 0 #7a0f0a,0 24px 50px rgba(0,0,0,.9);transform:rotate(-2deg)}
.bigw.white{color:#fff;text-shadow:0 0 30px rgba(0,0,0,.6),0 16px 0 rgba(0,0,0,.55),0 24px 50px rgba(0,0,0,.9)}
.brand{position:absolute;left:0;right:0;bottom:110px;text-align:center;font-size:46px;color:rgba(255,255,255,.85);letter-spacing:6px}
.brand b{color:#FFC24B}
</style></head><body><div id="st"></div>
<script>
/* @@SAFEZONE 10/7 — 쇼츠 목록(격자) 칸에서 실제로 보이는 영역 안에 글씨를 최대로(사용자 "썸네일 텍스트가 살짝 짤리는데 이 안에서 텍스트 최대화")
   실측(10/7 채널 Shorts 탭 캡처 1179x2556, 업로드한 썸네일 3장을 칸에 맞춰 대조, 일치도 0.98): 칸은 썸네일을 0.403배로 그려
   1080x1920 중 x 55~1025 · y 151~1769 만 보인다(좌우 55px · 위아래 151px 잘림). 아래는 '조회수' 글자 때문에 1560(SAFE_BOTTOM).
   글씨는 여기서 20px 더 안쪽(x 75~1005, 폭 930)에 '잉크(실제 글자 획)' 기준으로 넣는다.
   또 하나: 템플릿 스크립트가 도는 순간엔 KBO 폰트가 아직 안 불려 와서(document.fonts.check = false) 대체 폰트 폭으로 크기를 정했고,
   실제 폰트로 그리면 폭이 달라져 넘쳤다(클라우드 ① 썸네일 box 80~1036). → 폰트를 다 불러온 뒤에 크기를 정한다(TS.ready). */
const TS=(()=>{
  const VIS={L:55,R:1025,T:151,B:1769}, PAD=20, L=VIS.L+PAD, R=VIS.R-PAD, W=R-L;
  const cx=document.createElement('canvas').getContext('2d');
  function ink(sp){   // 한 줄(span)의 실제 글자 획 왼쪽·오른쪽 끝(화면 px)
    const cs=getComputedStyle(sp), b=sp.getBoundingClientRect();
    cx.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    cx.letterSpacing=(cs.letterSpacing==='normal')?'0px':cs.letterSpacing;
    const m=cx.measureText(sp.textContent), sw=(parseFloat(cs.webkitTextStrokeWidth)||0)/2;
    const ow=sp.offsetWidth||b.width||1, k=b.width/ow||1;   // 부모 transform(scale) 반영
    const l=b.left+(-m.actualBoundingBoxLeft-sw)*k, r=b.left+(m.actualBoundingBoxRight+sw)*k;
    return {l,r,w:r-l};
  }
  const fs=sp=>parseFloat(getComputedStyle(sp).fontSize);
  const setF=(sp,f)=>{sp.style.fontSize=f.toFixed(1)+'px';};
  function fitW(sp,target,maxF){   // 잉크 폭이 target 이 되는 글자 크기(넘지 않게)
    target=Math.min(target||W,W);
    for(let i=0;i<8;i++){ const w=ink(sp).w; if(w<=0) return; const f=Math.min(maxF||9999,fs(sp)*target/w); setF(sp,f); if(Math.abs(ink(sp).w-target)<1.5) break; }
    for(let i=0;i<60&&ink(sp).w>target;i++) setF(sp,fs(sp)-1);
  }
  function capW(sp,target){ target=Math.min(target||W,W); for(let i=0;i<8&&ink(sp).w>target;i++) setF(sp,fs(sp)*target/ink(sp).w*0.998); }
  function minL(sps){ return Math.min(...sps.map(sp=>ink(sp).l)); }
  function clamp(sps){   // 10/7 사용자 "다 잘리는 건 아니고 잘리는 썸네일만" → 보이는 칸(75~1005) 밖으로 나가는 줄만 고친다. 안 나가는 줄은 그대로.
    let n=0;
    for(const sp of sps){ if(!sp.textContent.trim()) continue; let i=ink(sp);
      if(i.l<L){ const cur=parseFloat(sp.style.left)||0; if(getComputedStyle(sp).position==='static') sp.style.position='relative'; sp.style.left=(cur+L-i.l).toFixed(1)+'px'; i=ink(sp); n++; }
      for(let k=0;k<80&&i.r>R;k++){ setF(sp,fs(sp)*0.995); i=ink(sp); if(k===0) n++; } }   // 왼쪽 끝은 그대로 두고 그 줄만 오른쪽 끝이 1005 안에 들 때까지 줄인다
    return n;
  }
  function ready(){ return Promise.all([...document.fonts].map(f=>f.load().catch(()=>{}))).then(()=>document.fonts.ready); }
  function fitBottom(e,sps,B){ B=B||1560; for(let i=0;i<40&&e&&e.getBoundingClientRect().bottom>B;i++){ for(const sp of sps) if(sp.style.fontSize) setF(sp,fs(sp)*0.97); if(parseFloat(getComputedStyle(e).fontSize)>2) setF(e,fs(e)*0.97); } }   // 아래 '조회수' 글자(1588~)에 안 가리게
  function report(sps){ return sps.filter(sp=>sp.textContent.trim()).map(sp=>{const i=ink(sp);return `${sp.textContent} ${Math.round(i.l)}~${Math.round(i.r)}`;}).join(' / '); }
  return {VIS,L,R,W,B:1560,ink,fitW,capW,minL,clamp,fitBottom,ready,report};
})();
window.__thumbAsync=true;

const EP=window.EP||{}, TH=EP.thumb||{};
const COLOR={KBO:'#0B2A6E',SS:'#074CA1',KT:'#1A1A1A',LG:'#C30452',HT:'#EA0029',OB:'#131230',NC:'#315288',LT:'#041E42',SK:'#CE0E2D',HH:'#FC4E00',WO:'#820024'};
const ALIAS={'기아':'HT','KIA':'HT','엘지':'LG','케이티':'KT','엔씨':'NC','SSG':'SK','두산':'OB','삼성':'SS','롯데':'LT','한화':'HH','키움':'WO'};
const codeOf=n=>{const t=(EP.standings||[]).find(t=>t.team===n||t.code===n||t.code===ALIAS[n]);return t?t.code:(ALIAS[n]||n)};
const logo=c=>(EP.logos||{})[c]||'';
const teams=(TH.teams||(TH.team?[TH.team]:[EP.focusTeam||''])).map(codeOf).filter(Boolean);
const nl=t=>String(t||'').replace(/["“”'‘’]/g,'').split('\n').join('<br>');   // 썸네일 글씨엔 따옴표를 넣지 않는다(9/15)
/* 큰 글씨 색(9/15): 한 썸네일 안에서는 한 색, 편마다 바꾼다 — 첫 편 빨강, 다음 편부터 노랑·하늘·연두·주황 순. thumb.color 로 직접 지정 가능 */
const BIGC=['#FF3B30','#FFC24B','#22D3EE','#A3E635','#FB923C'];
const cBig=TH.color||BIGC[(EP.epIndex||0)%BIGC.length];
const dark=h=>{const n=parseInt(h.slice(1),16);return '#'+[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v*.45).toString(16).padStart(2,'0')).join('')};
const glow=h=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},.55)`};
const bigStyle=`color:${cBig};text-shadow:0 0 40px ${glow(cBig)},0 16px 0 ${dark(cBig)},0 24px 50px rgba(0,0,0,.9)`;
const BIGW=['#fff','#FFC24B','#22D3EE','#A3E635','#FB923C'], cBigW=TH.color||BIGW[(EP.epIndex||0)%BIGW.length];   // 두 팀 맞대결(clash) 틀은 첫 편 흰색, 다음 편부터 노랑·하늘…
const bigStyleW=cBigW==='#fff'?'':`color:${cBigW};text-shadow:0 0 40px ${glow(cBigW)},0 16px 0 ${dark(cBigW)},0 24px 50px rgba(0,0,0,.9)`;
// 날짜 배지: "9월 10일 (목)" — 콘티 date 에서 요일 계산 (thumb.date 로 직접 지정하면 그대로)
// 날짜 배지 = '올리는 날짜'(콘티 date) — 화면 오른쪽 위 레일 날짜·제목 첫 해시태그와 같은 날. 2026-09-17 사용자 지시로 '경기 날짜'에서 바꿈
// (결과물 폴더 이름과 나레이션의 "N월 N일 기준" 은 그대로 경기 날짜 gameDate)
const dateText=(()=>{ if(TH.date) return TH.date; let d=new Date((EP.date||EP.gameDate||'')+'T00:00:00'); if(isNaN(d)) return EP.dateLabel||'';
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; })();
// 레이아웃 자동 선택: 두 팀 → clash, 숫자/짧은 단어 → stat, 그 외 default
const layout=TH.layout||(teams.length>1?'clash':(/^\d|^[가-힣]{1,2}[?!]?$/.test(TH.big||'')?'stat':'default'));
const st=document.getElementById('st');
const el=(html)=>{st.insertAdjacentHTML('beforeend',html)};
const hex2=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const short=!/\n/.test(TH.big||'')&&String(TH.big||'').length<=4, bigFs=short?320:250;
const c1=COLOR[teams[0]]||'#E0453A', c2=COLOR[teams[1]]||'#FFC24B';
/* 9/24: 순위 편 썸네일에도 사진(thumb.img) — 로고 대신 인물 사진을 크게, 로고는 작은 칩으로. 누끼 png 는 그대로, 사각 사진은 둥근 카드 */
const PH=EP.photos||{}, PS=EP.photoSizes||{};
const findP=(o,n)=>{ if(!n) return null; const b=String(n).replace(/\.[a-z0-9]+$/i,''); const k=Object.keys(o).find(x=>x===n||x===b||x.replace(/\.[a-z0-9]+$/i,'')===b); return k?o[k]:null; };
const psrc=findP(PH,TH.img), pcut=/^data:image\/png/.test(psrc||'');
/* 사진형 큰 글씨(9/24): 주황 배경 위 빨간 글씨는 번져 보여서 → 흰색·노랑 + 검은 테두리(선명). thumb.bigStyle: 'box'(윗줄 흰·마지막 줄 노란 띠, 기본 — 9/24 사용자 선택) | 'wy'(1줄 흰·2줄 노랑) | 'y'(전부 노랑) */
const photoBig=()=>{ const L=String(TH.big||'').replace(/["“”'‘’]/g,'').split('\n'); const m=TH.bigStyle||'box';
  const st=c=>`color:${c};-webkit-text-stroke:14px #10141c;paint-order:stroke fill;text-shadow:0 12px 0 #10141c,0 20px 40px rgba(0,0,0,.7)`;
  return L.map((t,i)=>{ if(m==='box'&&i===L.length-1&&L.length>1) return `<span style="display:inline-block;background:#FFC24B;color:#10141c;padding:0 34px;border-radius:24px;margin-top:22px;box-shadow:0 14px 0 #10141c">${t}</span>`;
    const c=m==='y'?'#FFC24B':(i===0?'#fff':'#FFC24B'); return `<span style="${st(c)}">${t}</span>`; }).join('<br>'); };

if(layout==='clash'){
  // 두 팀 색으로 대각선 분할, 로고 좌우, 가운데 큰 글씨
  el(`<div class="bg" style="background:linear-gradient(115deg,${c1} 0 50%,${c2} 50% 100%)"></div>
      <div class="bg" style="background:radial-gradient(60% 40% at 50% 55%,rgba(0,0,0,.55),rgba(0,0,0,.15) 70%,rgba(0,0,0,.35))"></div>
      <div class="date">${dateText}</div>
      <div class="chip" style="position:absolute;left:110px;top:480px;width:360px;height:360px;border-radius:72px;transform:rotate(-6deg)"><img src="${logo(teams[0])}"></div>
      <div class="chip" style="position:absolute;right:110px;top:480px;width:360px;height:360px;border-radius:72px;transform:rotate(6deg)"><img src="${logo(teams[1])}"></div>
      <div style="position:absolute;left:50%;top:660px;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;background:#161c28;border:10px solid #fff;display:flex;align-items:center;justify-content:center;font-size:96px;color:#fff;box-shadow:0 20px 50px rgba(0,0,0,.6)">VS</div>
      <div class="top" style="top:920px">${nl(TH.top)}</div>
      <div class="bigw white" style="${bigStyleW};top:1060px;font-size:${bigFs}px">${nl(TH.big)}</div>
      <div class="brand">야구<b>자판기</b></div>`);
} else if(psrc){
  // 사진형(9/24): 팀 색 배경 + 인물 사진 크게 + 작은 로고 칩 + 문구 두 단
  el(`<div class="bg" style="background:linear-gradient(180deg,${c1} 0%,#161c28 72%)"></div>
      <div class="bg" style="background:radial-gradient(60% 35% at 50% 40%,rgba(255,255,255,.18),rgba(0,0,0,0) 70%)"></div>
      <div class="date">${dateText}</div>
      ${pcut?`<img src="${psrc}" style="position:absolute;left:50%;top:430px;transform:translateX(-50%);height:720px;width:auto;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,#000 72%,transparent 100%);-webkit-mask-composite:source-in;mask-composite:intersect;filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))">`
            :`<div style="position:absolute;left:50%;top:390px;transform:translateX(-50%);width:760px;height:600px;border-radius:40px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)"><img src="${psrc}" style="width:100%;height:100%;object-fit:cover;object-position:${TH.focus||'50% 20%'}"></div>`}
      ${TH.logos===false?'':`<div class="chip" style="position:absolute;left:80px;top:470px;width:190px;height:190px;border-radius:44px;transform:rotate(-6deg)"><img src="${logo(teams[0])}"></div>`}
      <div class="top" style="top:1150px;font-size:100px">${nl(TH.top)}</div>
      <div class="bigw" style="color:#fff;text-shadow:none;transform:rotate(-2deg);top:1280px;font-size:190px;letter-spacing:-10px">${photoBig()}</div>
      <div class="brand">야구<b>자판기</b></div>`);
} else if(layout==='stat'){
  // 팀 색 배경 + 아주 큰 숫자/단어
  el(`<div class="bg" style="background:linear-gradient(180deg,${c1} 0%,#161c28 78%)"></div>
      <div class="bg" style="background:radial-gradient(70% 45% at 50% 62%,${hex2('#FF3B30',.35)},rgba(0,0,0,0) 70%)"></div>
      <div class="date">${dateText}</div>
      <div class="chip" style="position:absolute;left:50%;top:420px;transform:translateX(-50%);width:380px;height:380px;border-radius:76px"><img src="${logo(teams[0])}"></div>
      ${TH.top?`<div class="top" style="top:860px">${nl(TH.top)}</div>`:''}
      <div class="bigw" style="${bigStyle};top:${TH.top?1000:880}px;font-size:${TH.bigSize||(short?420:bigFs)}px;letter-spacing:${short?-20:-14}px;line-height:1.0">${nl(TH.big)}</div>
      <div class="brand">야구<b>자판기</b></div>`);
} else {
  el(`<div class="bg" style="background:radial-gradient(70% 45% at 50% 38%, rgba(224,69,58,.55) 0%, rgba(224,69,58,0) 70%),radial-gradient(90% 60% at 50% 100%, rgba(255,194,75,.25) 0%, rgba(255,194,75,0) 60%), #161c28"></div>
      <div class="bg" style="background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:120px 120px;transform:perspective(900px) rotateX(55deg) translateY(600px) scale(2.2);opacity:.6"></div>
      <div class="date">${dateText}</div>
      <div class="chip" style="position:absolute;left:50%;top:420px;transform:translateX(-50%);width:420px;height:420px;border-radius:80px"><img src="${logo(teams[0])}"></div>
      <div class="top" style="top:890px">${nl(TH.top)}</div>
      <div class="bigw" style="${bigStyle};top:1030px;font-size:${bigFs}px">${nl(TH.big)}</div>
      <div class="brand">야구<b>자판기</b></div>`);
}
// 글자가 폭을 넘치면 자동 축소 (여러 줄이면 가장 긴 줄 기준) — 10/7: 폰트를 다 불러온 뒤, 잉크 기준 쇼츠 목록 보이는 칸(930) 안
function __fit(){
for(const sel of ['.top','.bigw']){
  const e=document.querySelector(sel); if(!e) continue;
  const lines=e.innerHTML.split('<br>');
  e.innerHTML=lines.map(l=>`<span style="white-space:nowrap">${l}</span>`).join('<br>');
  const sps=[...e.querySelectorAll('span')];
  let fs=parseFloat(getComputedStyle(e).fontSize);
  const w=()=>Math.max(...sps.map(sp=>sp.getBoundingClientRect().width));
  while(w()>940&&fs>60){fs-=8;e.style.fontSize=fs+'px';}
}
const all=[...document.querySelectorAll('.top span,.bigw span')]; window.__thumbClamped=TS.clamp(all); window.__thumbReport=TS.report(all);
}
TS.ready().then(__fit,__fit).then(()=>{window.__thumbDone=true;},()=>{window.__thumbDone=true;});
</script></body></html>
