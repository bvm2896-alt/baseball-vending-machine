      ? `<div style="width:${LW}px;flex:0 0 ${LW}px;display:flex;align-items:center;gap:20px"><div style="width:${FD}px;height:${FD}px;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 10px 26px rgba(18,22,31,.2);background:#E9EDF3;flex:0 0 auto">${fsrc ? `<img src="${fsrc}" style="width:100%;height:100%;object-fit:cover;object-position:${esc(r.focus || '50% 0%')}">` : ''}</div>
          <div class="col" style="align-items:flex-start;gap:6px"><div style="font-size:${n <= 2 ? 60 : 48}px;font-weight:900;letter-spacing:-2px;white-space:nowrap;color:${r.empty ? '#AAB2BF' : TXT}">${esc(r.name || '')}</div>${r.role ? `<div class="badge" style="background:${r.roleColor || '#12161F'};font-size:30px;padding:6px 18px">${esc(r.role)}</div>` : ''}</div></div>`
      : `<div style="width:${LW}px;flex:0 0 ${LW}px;text-align:left;font-size:${n > 5 ? 40 : 46}px;font-weight:900;letter-spacing:-1.5px;white-space:nowrap;color:${r.empty ? '#AAB2BF' : TXT}">${esc(r.name || '')}</div>`;
    h += `<div style="display:flex;align-items:center;height:${RH}px;${isNew ? rise(p, 16) : ''}">${nameCell}
      <div style="position:relative;width:${W}px;height:${RH}px;border-bottom:1px solid ${LINE}">${bar}</div></div>`;
  });
  h += `</div>`;
  if (s.label) h += `<div class="badge cc" style="margin-top:22px;background:${RED};font-size:38px;padding:10px 30px;${s._same && s._prev.label === s.label ? '' : pop(pk(s, s.labelAt, .4, seg(lt, .4 + (n - NEW) * .4, .4)))}">${esc(s.label)}</div>`;   /* 10/14: labelAt = 말하는 호흡에 */
  wrapC(h);
};

/* zigzag: 방향이 번갈아 꺾이는 화살표. labels:['성적','리빌딩',...] */
SCENE.zigzag = (lt, s) => {
  const lb = s.labels || [], n = lb.length, W = 1500, H = 420, dx = W / (n + .3);
  const pts = [[20, H / 2]]; lb.forEach((_, i) => pts.push([20 + dx * (i + 1), i % 2 ? H - 50 : 50]));
  const tot = pts.length - 1, q = seg(lt, .15, .35 * n) * tot;
  let d = `M${pts[0][0]},${pts[0][1]}`, tip = pts[0], ang = 0;
  for (let i = 1; i <= tot; i++) { const f = c01(q - (i - 1)); if (f <= 0) break; const a = pts[i - 1], b = pts[i];
    tip = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI; d += ` L${tip[0].toFixed(1)},${tip[1].toFixed(1)}`; }
  let lab = '';
  lb.forEach((t, i) => { const p = pts[i + 1], on = c01((q - i) * 1.5), up = i % 2 === 0;
    lab += `<div style="position:absolute;left:${p[0]}px;top:${p[1] + (up ? -84 : 30)}px;transform:translateX(-50%);background:${up ? ACC : '#3B4A63'};color:#fff;font-size:40px;font-weight:900;padding:8px 24px;border-radius:999px;white-space:nowrap;opacity:${c01(on * 1.4)}">${esc(t)}</div>`; });
  let h = titleH(lt, s, 52, 30, false);
  h += `<div style="position:relative;width:${W}px;height:${H + 60}px"><svg width="${W}" height="${H}" style="position:absolute;left:0;top:30px;overflow:visible">
    <path d="${d}" fill="none" stroke="#12161F" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <g transform="translate(${tip[0]},${tip[1]}) rotate(${ang})"><path d="M-6,-26 L34,0 L-6,26 Z" fill="#12161F"/></g></svg>
    <div style="position:absolute;left:0;top:30px;width:${W}px;height:${H}px">${lab}</div></div>`;
  h += textH(lt, s, .3 + n * .35, 64);
  wrapC(h);
};


/* trade: 트레이드 애니메이션(9/30 사용자 지시 — 힉스필드 없이 직접). 왼쪽 = 보내는 팀 캐릭터(머리가 구단 로고), 오른쪽 = 받는 팀 캐릭터들.
   선수 얼굴 동그라미가 날아가고, 받는 팀이 '신인 지명권' 티켓을 돌려준다. trades:[{img, name, to, year}], from:'키움', ticket:'신인 지명권'
   시각은 이 줄의 호흡 시작(EP.segT)에 맞춘다 — atSeg:[각 트레이드가 시작할 호흡 번호(소수 가능)] */
function charSVG(code, col, t, phase) {
  const bob = Math.sin(t * 3.2 + phase) * 6, lg = LOGO[code] || '';
  return `<div style="position:relative;width:200px;height:300px;transform:translateY(${bob.toFixed(1)}px)">
    <div style="position:absolute;left:45px;top:150px;width:110px;height:120px;border-radius:50px 50px 36px 36px;background:${col};box-shadow:inset -10px -10px 0 rgba(0,0,0,.12)"></div>
    <div style="position:absolute;left:62px;top:258px;width:26px;height:40px;border-radius:12px;background:${col};filter:brightness(.8)"></div>
    <div style="position:absolute;left:112px;top:258px;width:26px;height:40px;border-radius:12px;background:${col};filter:brightness(.8)"></div>
    <div style="position:absolute;left:20px;top:170px;width:34px;height:70px;border-radius:17px;background:${col};transform:rotate(18deg);filter:brightness(.9)"></div>
    <div style="position:absolute;left:146px;top:170px;width:34px;height:70px;border-radius:17px;background:${col};transform:rotate(-18deg);filter:brightness(.9)"></div>
    <div style="position:absolute;left:10px;top:0;width:180px;height:170px;border-radius:50%;background:#fff;border:6px solid ${col};box-shadow:0 10px 24px rgba(18,22,31,.18);display:flex;align-items:center;justify-content:center;overflow:hidden">
      ${lg ? `<img src="${lg}" style="width:78%;height:78%;object-fit:contain">` : ''}</div>
  </div>`;
}
SCENE.trade = (lt, s) => {
  const W = 1760, H = 700, tr = s.trades || [], n = tr.length, SC = 1.3;   /* 캐릭터 1.3배 */
  const fromT = T(s.from || '키움'), fromCol = TEAMCOL[fromT.code] || '#820024';
  const FX = 40, FY = 230, TX = k => 860 + k * 320, TY = 230, CW = 200 * SC;
  const QX = FX + CW + 50, QY = k => FY - 80 + k * 180;   /* 보내는 팀 옆 줄(처음엔 선수, 트레이드 뒤엔 그 자리에 티켓) */
  const segs = (EP.segT || [])[s.startLine] || [], L0 = segs[0] ?? 0;
  const at = k => { const a = (s.atSeg || [])[k]; if (a == null || !segs.length) return .8 + k * 1.4;
    const i = Math.floor(a), f = a - i, t0 = segs[i] ?? segs[segs.length - 1], t1 = segs[i + 1] ?? (t0 + 1.5); return (t0 + (t1 - t0) * f) - L0; };
  const tnow = segs.length ? NOW - L0 : lt;
  const face = (x, px, py, sc, op) => { const src = photoSrc(x.img);
    return `<div style="position:absolute;left:${(px - 60).toFixed(1)}px;top:${(py - 60).toFixed(1)}px;width:120px;text-align:center;opacity:${op.toFixed(3)};transform:scale(${sc.toFixed(3)})">
      <div style="width:120px;height:120px;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 8px 22px rgba(18,22,31,.28);background:#E9EDF3">${src ? `<img src="${src}" style="width:100%;height:100%;object-fit:cover">` : ''}</div>
      <div style="display:inline-block;margin-top:6px;background:#12161F;color:#fff;font-size:30px;font-weight:900;padding:4px 14px;border-radius:999px;white-space:nowrap">${esc(x.name)}</div></div>`; };
  const ticket = (px, py, rot, op) => `<div style="position:absolute;left:${(px - 110).toFixed(1)}px;top:${(py - 30).toFixed(1)}px;width:220px;text-align:center;transform:rotate(${rot.toFixed(1)}deg);opacity:${op.toFixed(3)};
      background:linear-gradient(135deg,#FFE27A,#F5B301);border:4px dashed #8A5A00;border-radius:14px;padding:8px 0;font-size:32px;font-weight:900;color:#5A3A00;white-space:nowrap;box-shadow:0 8px 18px rgba(0,0,0,.22)">${esc(s.ticket || '신인 지명권')}</div>`;
  let st = `<div style="position:absolute;left:${FX}px;top:${FY}px;transform:scale(${SC});transform-origin:0 0;${pop(seg(lt, 0, .45))}">${charSVG(fromT.code, fromCol, NOW, 0)}
     <div style="text-align:center;font-size:36px;font-weight:900;color:${fromCol};margin-top:4px">${esc(fromT.nm || s.from)}</div></div>`;
  tr.forEach((x, k) => {
    const t = T(x.to), col = TEAMCOL[t.code] || '#3B4A63', t0 = at(k), p1 = c01((tnow - t0) / .9), p2 = c01((tnow - t0 - 1.0) / .9);
    st += `<div style="position:absolute;left:${TX(k)}px;top:${TY}px;transform:scale(${SC});transform-origin:0 0;${pop(seg(lt, .15 + k * .12, .45))}">${charSVG(t.code, col, NOW, k + 1)}
      <div style="text-align:center;font-size:36px;font-weight:900;color:${col};margin-top:4px">${esc(x.to)}${x.year ? `<span style="font-size:26px;color:${GRAY};margin-left:8px">${esc(x.year)}</span>` : ''}</div></div>`;
    /* 선수: 줄에서 대기 → 받는 팀 머리 위로 포물선 */
    const sx = QX + 60, sy = QY(k) + 60, ex = TX(k) + CW / 2, ey = TY - 90, e = eo(p1);
    const fx = sx + (ex - sx) * e, fy = sy + (ey - sy) * e - Math.sin(Math.PI * e) * 110;
    st += face(x, fx, fy, p1 > 0 && p1 < 1 ? 1 + .15 * Math.sin(Math.PI * p1) : 1, c01(seg(lt, .3 + k * .15, .4) * 1.4));
    /* 티켓: 받는 팀 → 선수가 있던 자리로 */
    if (p2 > 0) { const q = eo(p2), tx0 = TX(k) + CW / 2, ty0 = TY + 200, tx1 = QX + 110, ty1 = QY(k) + 60;
      st += ticket(tx0 + (tx1 - tx0) * q, ty0 + (ty1 - ty0) * q - Math.sin(Math.PI * q) * 120, -6 + 12 * (1 - q), c01(p2 * 3)); }
  });
  wrapC(titleH(lt, s, 52, 6, false) + `<div style="position:relative;width:${W}px;height:${H}px">${st}</div>`);
};

/* ───── 10/1 밤 롱폼⑤ 검수 반영 새 장면: speech · swap · backdoor · fork ─────
   글자만 있는 장면 금지(사용자) → 발언은 사진+말풍선, 교체는 화살표, 약점은 그림, 갈림길은 길 애니메이션 */

/* speech: 인물 사진 + 말풍선 여러 개(날짜 알약 + 말). bubbles:[{date, text, hi, hide}], cont 면 앞 말풍선은 그대로 두고 새 것만 */

  const KP = K || s._chain || !!(s._keep && s._prev && ['profile', 'speech'].includes(s._prev.type));
  const PV = K ? (s._prev.bubbles || []).filter(b => !b.hide && !((b.at ?? 0) >= 50)).length : 0;   /* 10/18: 앞 장면에서 자리만 잡은(at 99) 말풍선은 이어받지 않음 — 제때 뜨게 */
  const PF = (CHAINS[s._cid] || []).some(j => SC[j].type === 'profile');   /* 10/5: 묶음에 profile 이 있으면 이름 크기·여백을 profile 과 똑같이(이름이 안 움직이게) */
  const vis = src ? chainPhoto(s, src, PW, H0, lt, KP) : PH(s, H0, KP ? 1 : seg(lt, 0, .5));

    <div style="${KP ? '' : rise(seg(lt, .04, .45), 22)}"><div class="mega"${(CHAINS[s._cid] || []).length > 1 ? ' data-keep="1"' : ''} style="font-size:${s.size || (PF ? 116 : 104)}px">${br(s.name || '')}</div>
      ${s.sub ? `<div class="badge" style="margin-top:${PF ? 14 : 12}px;background:${ACC};${KP && s._prev && s._prev.sub !== s.sub ? pop(seg(lt, .05, .4)) : ''}">${esc(s.sub)}</div>` : ''}</div>`;
  bs.forEach((b, i) => {
    const q = b.hide ? 0 : i < PV ? 1 : pk(s, b.at, .5, seg(lt, .15 + (i - PV) * .3, .5)), c = b.hi ? ACC : '#3B4A63';
    /* 10/8 밤 사용자: 말풍선을 묶음 폭만큼 길게 늘이지 않는다(글 길이만큼) → 장면이 왼쪽으로 치우쳐 보이지 않게 */
    /* 10/13 사용자("이호준이 한 말이 아니라 커뮤니티 말인데 말풍선이 이호준한테 가 있어"): src=true 면 말풍선(꼬리)이 아니라 출처 카드 — 꼬리 없음·회색 바탕·왼쪽 띠. 본인 발언만 꼬리 달린 말풍선 */
    const SRC = !!b.src, bc = SRC ? '#8A97AD' : c;
    t += `<div style="position:relative;${b.hide ? 'visibility:hidden;' : ''}${pop(q)}">

        ${b.date ? `<div class="badge" style="background:${bc};font-size:30px;padding:6px 20px">${esc(b.date)}</div>` : ''}
        <div style="font-size:${b.size || 60}px;font-weight:900;letter-spacing:-2px;line-height:1.22;text-align:left;color:${b.hi ? ACC : TXT}">${br(b.text || '')}</div>${b.chips && typeof NPB12 !== 'undefined' ? `<div style="display:grid;grid-template-columns:repeat(6,auto);gap:8px;margin-top:6px">${NPB12.map((x, j) => `<div style="${pop(c01(q * 2.2 - .5 - j * .06))}">${npbChip(x, 112, 46, 22)}</div>`).join('')}</div>` : ''}</div></div>`;
  });
  t += `</div>`;
  B(LR(vis, t, false, src ? PW : phW(s, H0)));   /* 10/13: 로고 칸은 실제 폭으로(profile 과 같게) — speech→profile 로고 묶음에서 이름이 108px 움직이던 것 */
};

/* swap: 교체 — items:[{top, from, to}] 카드마다 '전 → 후' 가 화살표로 움직인다 */

    const p = pk(s, it.at, .45, seg(lt, .2 + i * .3, .45)), q = eo(it.at != null ? (brP(s, it.at, .6, .35) ?? 1) : seg(lt, .55 + i * .3, .6)), qx = it.keep ? 0 : q;
    return `<div class="pane col" style="width:${W}px;border-radius:32px;padding:34px 30px 38px;gap:22px;${rise(p, 30)}">

      <div class="row" style="gap:26px;align-items:center;width:100%;justify-content:center">

       lv/rv 가 있으면 가운데에서 바깥으로 자라는 막대(더 좋은 쪽 진하게, low:true 면 작을수록 좋음), 없으면 글 + 앞선 쪽(w:"l"|"r") 표시 */
  SCENE.faceoff = (lt, s) => {
    const L = s.left || {}, R = s.right || {}, C_ = same(s), PVn = C_ ? (s._prev.rows || []).filter(r => !r.hide).length : 0;
    const CHo = CHN(s, 'faceoff').filter(x => (x.left || {}).name === L.name && (x.right || {}).name === R.name), MXR = Math.max(...CHo.map(x => (x.rows || []).length)), rows0 = s.rows || [];
    const rows = rows0.concat(CHo.reduce((a, x) => (x.rows || []).length > a.length ? x.rows : a, []).slice(rows0.length, MXR).map(r => Object.assign({}, r, { hide: true })));
    const CL = s.leftColor || TC(s, L.team), CR = s.rightColor || TC(s, R.team), W = EP.vertical ? (photoSrc(L.img) ? 230 : 170) : (s.pw || 340), H = Math.round(W / .774);

    const HALF = Math.floor(((EP.vertical ? 1040 : 1700 - 2 * (W + 20) - 60) - KW) / 2), BW = allT ? 0 : Math.max(90, Math.min(180, HALF - 210)), VW = HALF - BW;

  /* ── abdots ── {"type":"abdots","left":{투수},"right":{타자 또는 팀},"total":"10타수 1안타","totalAt":2,
       "groups":[{"k":"H","n":1,"at":2},{"k":"O","n":5,"at":2,"to":"K","toAt":3},{"k":"O","n":4,"at":2}],"chips":[{"label":"볼넷 5개","at":1,"c":"#16A34A"}],"cols":10}
