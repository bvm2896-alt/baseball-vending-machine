<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* 안전 영역(9/13): 유튜브 쇼츠 목록(특히 휴대폰)이 위·아래 8~12%, 좌우 5% 를 잘라 보여주므로 날짜 배지는 190px 아래, 큰 글씨는 1660px 위, 글 폭은 940px 안에 둔다 */
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_bold.ttf') format('truetype');font-weight:700 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#161c28}
body{font-family:'KBO','Noto Sans CJK KR','Malgun Gothic',sans-serif;font-weight:900;color:#fff;-webkit-font-smoothing:antialiased}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#161c28}
.bg{position:absolute;inset:0}
.date{position:absolute;left:50%;top:190px;transform:translateX(-50%) rotate(-2deg);background:#FFC24B;color:#161c28;font-size:132px;font-weight:900;padding:26px 84px;border-radius:34px;letter-spacing:-4px;border:10px solid #111620;box-shadow:0 0 0 8px #FFC24B,0 28px 80px rgba(0,0,0,.75);white-space:nowrap}
.chip{background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.chip img{width:82%;height:82%;object-fit:contain}
.top{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-size:120px;letter-spacing:-6px;line-height:1;text-shadow:0 10px 30px rgba(0,0,0,.8)}
.bigw{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-size:320px;letter-spacing:-14px;line-height:1.05;color:#FF3B30;
  text-shadow:0 0 40px rgba(255,59,48,.6),0 16px 0 #7a0f0a,0 24px 50px rgba(0,0,0,.9);transform:rotate(-2deg)}
.bigw.white{color:#fff;text-shadow:0 0 30px rgba(0,0,0,.6),0 16px 0 rgba(0,0,0,.55),0 24px 50px rgba(0,0,0,.9)}
.brand{position:absolute;left:0;right:0;bottom:110px;text-align:center;font-size:46px;color:rgba(255,255,255,.85);letter-spacing:6px}
.brand b{color:#FFC24B}
</style></head><body><div id="st"></div>
<script>
const EP=window.EP||{}, TH=EP.thumb||{};
const COLOR={SS:'#074CA1',KT:'#1A1A1A',LG:'#C30452',HT:'#EA0029',OB:'#131230',NC:'#315288',LT:'#041E42',SK:'#CE0E2D',HH:'#FC4E00',WO:'#820024'};
const ALIAS={'기아':'HT','KIA':'HT','엘지':'LG','케이티':'KT','엔씨':'NC','SSG':'SK','두산':'OB','삼성':'SS','롯데':'LT','한화':'HH','키움':'WO'};
const codeOf=n=>{const t=(EP.standings||[]).find(t=>t.team===n||t.code===n||t.code===ALIAS[n]);return t?t.code:(ALIAS[n]||n)};
const logo=c=>(EP.logos||{})[c]||'';
const teams=(TH.teams||(TH.team?[TH.team]:[EP.focusTeam||''])).map(codeOf).filter(Boolean);
const nl=t=>String(t||'').split('\n').join('<br>');
// 날짜 배지: "9월 10일 (목)" — 콘티 date 에서 요일 계산 (thumb.date 로 직접 지정하면 그대로)
// 날짜 배지는 "경기가 치러진 날" — 콘티 gameDate(없으면 콘티 날짜 하루 전. 월요일 아침 영상 = 일요일 경기)
// 화요일은 전날(월) 경기가 없으므로 순위 리뷰 대신 다른 주제 영상 → gameDate 없으면 영상 날짜 그대로
const dateText=(()=>{ if(TH.date) return TH.date; let d=new Date((EP.gameDate||EP.date||'')+'T00:00:00'); if(isNaN(d)) return EP.dateLabel||'';
  if(!EP.gameDate && d.getDay()!==2) d.setDate(d.getDate()-1);
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; })();
// 레이아웃 자동 선택: 두 팀 → clash, 숫자/짧은 단어 → stat, 그 외 default
const layout=TH.layout||(teams.length>1?'clash':(/^\d|^[가-힣]{1,2}[?!]?$/.test(TH.big||'')?'stat':'default'));
const st=document.getElementById('st');
const el=(html)=>{st.insertAdjacentHTML('beforeend',html)};
const hex2=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const short=!/\n/.test(TH.big||'')&&String(TH.big||'').length<=4, bigFs=short?320:250;
const c1=COLOR[teams[0]]||'#E0453A', c2=COLOR[teams[1]]||'#FFC24B';

if(layout==='clash'){
  // 두 팀 색으로 대각선 분할, 로고 좌우, 가운데 큰 글씨
  el(`<div class="bg" style="background:linear-gradient(115deg,${c1} 0 50%,${c2} 50% 100%)"></div>
      <div class="bg" style="background:radial-gradient(60% 40% at 50% 55%,rgba(0,0,0,.55),rgba(0,0,0,.15) 70%,rgba(0,0,0,.35))"></div>
      <div class="date">${dateText}</div>
      <div class="chip" style="position:absolute;left:110px;top:480px;width:360px;height:360px;border-radius:72px;transform:rotate(-6deg)"><img src="${logo(teams[0])}"></div>
      <div class="chip" style="position:absolute;right:110px;top:480px;width:360px;height:360px;border-radius:72px;transform:rotate(6deg)"><img src="${logo(teams[1])}"></div>
      <div style="position:absolute;left:50%;top:660px;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;background:#161c28;border:10px solid #fff;display:flex;align-items:center;justify-content:center;font-size:96px;color:#fff;box-shadow:0 20px 50px rgba(0,0,0,.6)">VS</div>
      <div class="top" style="top:920px">${nl(TH.top)}</div>
      <div class="bigw white" style="top:1060px;font-size:${bigFs}px">${nl(TH.big)}</div>
      <div class="brand">야구<b>자판기</b></div>`);
} else if(layout==='stat'){
  // 팀 색 배경 + 아주 큰 숫자/단어
  el(`<div class="bg" style="background:linear-gradient(180deg,${c1} 0%,#161c28 78%)"></div>
      <div class="bg" style="background:radial-gradient(70% 45% at 50% 62%,${hex2('#FF3B30',.35)},rgba(0,0,0,0) 70%)"></div>
      <div class="date">${dateText}</div>
      <div class="chip" style="position:absolute;left:50%;top:420px;transform:translateX(-50%);width:380px;height:380px;border-radius:76px"><img src="${logo(teams[0])}"></div>
      <div class="top" style="top:860px">${nl(TH.top)}</div>
      <div class="bigw" style="top:1000px;font-size:${short?420:bigFs}px;letter-spacing:${short?-20:-14}px">${nl(TH.big)}</div>
      <div class="brand">야구<b>자판기</b></div>`);
} else {
  el(`<div class="bg" style="background:radial-gradient(70% 45% at 50% 38%, rgba(224,69,58,.55) 0%, rgba(224,69,58,0) 70%),radial-gradient(90% 60% at 50% 100%, rgba(255,194,75,.25) 0%, rgba(255,194,75,0) 60%), #161c28"></div>
      <div class="bg" style="background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:120px 120px;transform:perspective(900px) rotateX(55deg) translateY(600px) scale(2.2);opacity:.6"></div>
      <div class="date">${dateText}</div>
      <div class="chip" style="position:absolute;left:50%;top:420px;transform:translateX(-50%);width:420px;height:420px;border-radius:80px"><img src="${logo(teams[0])}"></div>
      <div class="top" style="top:890px">${nl(TH.top)}</div>
      <div class="bigw" style="top:1030px;font-size:${bigFs}px">${nl(TH.big)}</div>
      <div class="brand">야구<b>자판기</b></div>`);
}
// 글자가 폭을 넘치면 자동 축소 (여러 줄이면 가장 긴 줄 기준)
for(const sel of ['.top','.bigw']){
  const e=document.querySelector(sel); if(!e) continue;
  const lines=e.innerHTML.split('<br>');
  e.innerHTML=lines.map(l=>`<span style="white-space:nowrap">${l}</span>`).join('<br>');
  const sps=[...e.querySelectorAll('span')];
  let fs=parseFloat(getComputedStyle(e).fontSize);
  const w=()=>Math.max(...sps.map(sp=>sp.getBoundingClientRect().width));
  while(w()>940&&fs>60){fs-=8;e.style.fontSize=fs+'px';}
}
</script></body></html>
