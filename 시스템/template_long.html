  }
  const items = CH.map((c, i) => {
    const a = hiA[i], p = vis[i];
    return `<div class="row" style="gap:28px;justify-content:flex-start;width:1180px;padding:19px 36px;border-radius:26px;background:${mixC('#FFFFFF', ACC, a)};border:4px solid ${mixC(LINE, ACC, a)};
      box-shadow:0 10px 28px rgba(18,22,31,${(.06 + .12 * a).toFixed(3)});opacity:${((1 - .58 * dimA[i]) * c01(p * 1.4)).toFixed(3)};transform:translateY(${((1 - eo(p)) * 26).toFixed(1)}px) scale(${(1 + .035 * a).toFixed(4)})">
      <div class="num" style="width:78px;height:78px;border-radius:50%;flex:0 0 auto;background:${mixC('#12161F', '#FFFFFF', a)};color:${mixC('#FFFFFF', ACC, a)};display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900">${i + 1}</div>
      <div style="font-size:58px;font-weight:900;letter-spacing:-2px;color:${mixC(TXT, '#FFFFFF', a)};white-space:nowrap">${esc(c.title)}</div></div>`;
  }).join('');
  wrapC(`<div class="col" style="gap:${n > 4 ? 18 : 24}px">${items}</div>`);
};

/* gantt: 팀 수명 막대 — 연도 커서가 흐르며 막대가 자라고, 해체된 팀은 회색으로 끝난다.
   rows:[{name,spans:[[a,b]],kind:'bank'|'co',people:[..]}], show:N, from/until(커서), marks:[{y,label,color}], hi:[이름], ended:true, labels:{이름:[사람]} */
SCENE.gantt = (lt, s) => {
  const Y0 = s.y0 || 1946, Y1 = s.y1 || 2003, rows = (s.rows || []).slice(0, s.show || 99), n = rows.length;
  /* 9/28: 이름 칸 폭을 전체 팀 이름(보이지 않는 줄 포함 → 이어지는 장면끼리 폭이 같다) 길이에 맞춘다.
     예전엔 330 고정에 오른쪽 정렬이라 짧은 은행 이름일 때 그림 덩어리가 오른쪽으로 쏠려 보였다 */
  const estW = t => [...String(t)].reduce((a, c) => a + (/[가-힣]/.test(c) ? 36 : /[·\s]/.test(c) ? 16 : 22), 0);
  const W = 1180, LW = Math.min(330, Math.max(160, ...(s.rows || []).map(r => estW(r.label || r.name) + 34))), NA = (s.rows || []).length || n, RH = Math.min(NA <= 5 ? 84 : 62, Math.floor(560 / Math.max(1, NA))), BH = Math.round(RH * .62);
  const prevLab = (s._same && s._prev && s._prev.labels) || {};
  const x = y => (c01((y - Y0) / (Y1 - Y0)) * W);
  const cur = s.from != null ? s.from + (s.until - s.from) * eo(seg(lt, .15, 1.2)) : (s.until || Y1);
  const NEW = s.newFrom ?? n, hiSet = new Set(s.hi || []);
  let h = titleH(lt, s, 52, 18, s._same);
  h += `<div style="position:relative;width:${LW + W}px;left:-30px">`;   /* 9/28: 오른쪽 끝 연도 글자(2003·해체 연도) 만큼 살짝 왼쪽으로 → 그림 덩어리 가운데 */
  /* 축 */
  const ticks = s.ticks || [1946, 1960, 1970, 1982, 1990, 1997, 2003];
  h += `<div style="position:relative;height:44px;margin-left:${LW}px;width:${W}px">${ticks.map(y => `<div class="num" style="position:absolute;left:${x(y)}px;transform:translateX(-50%);font-size:28px;font-weight:800;color:${GRAY}">${y}</div>`).join('')}</div>`;
  h += `<div style="position:relative">`;
  rows.forEach((r, i) => {
    const p = i < NEW ? 1 : seg(lt, .05 + (i - NEW) * .15, .4), end = Math.max(...r.spans.map(z => z[1])), dead = cur >= end - .01 && end < Y1 + 1, isHi = hiSet.has(r.name);
    const base = r.kind === 'bank' ? '#3B6FD8' : '#F08A24';
    const col = isHi ? ACC : dead ? '#B8C0CC' : base;
    const bars = r.spans.map(([a, b]) => { const bb = Math.min(b, Math.max(a, cur)); if (bb <= a) return '';
      return `<div style="position:absolute;left:${x(a)}px;width:${Math.max(4, x(bb) - x(a))}px;top:${(RH - BH) / 2}px;height:${BH}px;border-radius:${BH / 2}px;background:${col};${isHi ? 'box-shadow:0 0 0 4px ' + ACC + '33' : ''}"></div>`; }).join('');
    const endLab = (s.endLabels && dead && (s.endLabels === true || s.endLabels.includes(r.name))) ? `<div class="num" style="position:absolute;left:${x(end) + 12}px;top:${(RH - 34) / 2}px;font-size:26px;font-weight:900;color:${isHi ? ACC : GRAY};white-space:nowrap">${end}</div>` : '';
    const ppl = (s.labels && s.labels[r.name] || []);
    const visEnd = Math.min(end, Math.max(r.spans[0][0], cur));   /* 9/28: 사람 이름표는 보이는 막대 끝 오른쪽에 */
    const pch = ppl.map((nm, j) => `<div style="position:absolute;left:${x(visEnd) + 18 + j * 142}px;top:${(RH - 48) / 2}px;height:48px;padding:0 20px;border-radius:999px;background:#12161F;color:#fff;font-size:31px;font-weight:900;display:flex;align-items:center;white-space:nowrap;${(prevLab[r.name] || []).includes(nm) ? '' : pop(seg(lt, .3 + j * .2, .4))}">${esc(nm)}</div>`).join('');   /* 9/28: 앞 장면에 있던 이름표는 그대로 */
    h += `<div style="display:flex;align-items:center;height:${RH}px;${i < NEW ? '' : rise(p, 16)}">
      <div style="width:${LW}px;flex:0 0 ${LW}px;text-align:left;padding-right:24px;font-size:${RH > 52 ? 36 : 31}px;font-weight:900;letter-spacing:-1px;white-space:nowrap;color:${dead && !isHi ? GRAY : TXT}">${esc(r.label || r.name)}</div>
      <div style="position:relative;width:${W}px;height:${RH}px;border-bottom:1px solid ${LINE}">${bars}${pch}${endLab}</div></div>`;
  });
  if (n < NA) h += `<div style="height:${(NA - n) * RH}px"></div>`;   /* 9/28: 뒤에 나올 줄 자리를 미리 비워 둔다(줄이 늘 때 표가 위로 밀리지 않게) */
  /* 세로선 */
  (s.marks || []).forEach((m, k) => {
    const q = s._same && (s._prev.marks || []).some(z => z.y === m.y) ? 1 : seg(lt, .1 + k * .15, .4);
    h += `<div style="position:absolute;left:${LW + x(m.y)}px;top:-8px;height:${n * RH + 16}px;width:4px;margin-left:-2px;background:${m.color || '#12161F'};opacity:${c01(q * 1.4) * .9}"></div>
      <div style="position:absolute;left:${LW + x(m.y)}px;top:${n * RH + 14}px;translate:-50% 0;background:${m.color || '#12161F'};color:#fff;font-size:28px;font-weight:900;padding:6px 16px;border-radius:999px;white-space:nowrap;${pop(q)}">${esc(m.label)}</div>`;
  });
  /* 커서 */
  if (s.from != null) h += `<div style="position:absolute;left:${LW + x(cur)}px;top:-6px;height:${n * RH + 12}px;width:3px;margin-left:-1px;background:${ACC};opacity:.55"></div>`;
  h += `</div></div>`;
  /* 9/28: 배지는 표 아래 빈자리 위에 띄운다 → 배지가 있든 없든 표 위치가 같다(이어지는 장면에서 표가 들썩이지 않게) */
  if (s.badge) h = h.replace(/<\/div><\/div>$/, '') + `<div style="position:absolute;left:${LW}px;width:${W}px;top:${n * RH + ((s.marks || []).length ? 64 : 22)}px;display:flex;justify-content:center"><div class="badge" style="background:${ACC};font-size:40px;padding:12px 30px;${pop(seg(lt, .5, .45))}">${esc(s.badge)}</div></div></div></div>`;
  if ((s.marks || []).length) h += `<div style="height:48px"></div>`;
  wrapC(h);
};

/* flow: 진로 흐름도 — 왼쪽 큰 상자에서 띠가 갈라져 나간다(굵기 = 인원). dir:'in' 이면 여러 곳 → 한 곳 */
SCENE.flow = (lt, s) => {
  const W = 1500, H = 560, bands = s.bands || [], NEW = s.newFrom ?? 0, n = bands.length;
  const tot = bands.reduce((a, b) => a + (b.w || 1), 0), GAP = 18, avail = H - GAP * (n - 1);
  const srcX = 0, srcW = 330, dstX = 1080, dstW = 420, bandH = b => Math.max(10, (b.w || 1) / tot * avail);
  let yR = 0, yL = (H - Math.max(...[avail * .98, 0])) / 2, svg = '', boxes = '';
  const Ltot = bands.reduce((a, b) => a + bandH(b), 0), L0 = (H - Ltot) / 2;
  let accL = L0;
  bands.forEach((b, i) => {
    const bh = bandH(b), p = i < NEW ? 1 : seg(lt, .25 + (i - NEW) * .28, .6), c = b.hi ? ACC : (b.color || '#AEB6C3');
    const x1 = srcX + srcW, x2 = dstX, yl = accL, yr = yR;
    const xm = x1 + (x2 - x1) * eo(p);
    const path = `M${x1},${yl} C${(x1 + x2) / 2},${yl} ${(x1 + x2) / 2},${yr} ${x2},${yr} L${x2},${yr + bh} C${(x1 + x2) / 2},${yr + bh} ${(x1 + x2) / 2},${yl + bh} ${x1},${yl + bh} Z`;
    svg += `<clipPath id="fc${i}"><rect x="0" y="0" width="${xm}" height="${H}"/></clipPath><path d="${path}" fill="${c}" fill-opacity="${b.dashed ? .18 : .55}" ${b.dashed ? `stroke="${c}" stroke-width="4" stroke-dasharray="14 10"` : ''} clip-path="url(#fc${i})"/>`;
    boxes += `<div style="position:absolute;left:${dstX + 18}px;top:${yr + bh / 2}px;transform:translateY(-50%);display:flex;align-items:baseline;gap:14px;white-space:nowrap;opacity:${c01((p - .5) * 3)}">
      <span style="font-size:${n > 4 ? 40 : 46}px;font-weight:900;letter-spacing:-1.5px;line-height:1.2;text-align:left;color:${b.hi ? ACC : TXT}">${br(b.label)}</span>${b.n ? `<span class="num" style="font-size:${n > 4 ? 40 : 52}px;font-weight:900;color:${b.hi ? ACC : TXT}">${esc(b.n)}</span>` : ''}${b.sub ? `<span style="font-size:30px;font-weight:700;color:${GRAY}">${esc(b.sub)}</span>` : ''}</div>`;
    accL += bh; yR += bh + GAP;
  });
  const src = s.src || {};
  const srcBox = `<div style="position:absolute;left:${srcX}px;top:${L0 - 20}px;width:${srcW}px;height:${Ltot + 40}px;border-radius:26px;background:#12161F;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;${s._same ? '' : pop(seg(lt, 0, .4))}">
    <div style="font-size:34px;font-weight:800;opacity:.8;text-align:center;line-height:1.2">${br(src.label || '')}</div><div class="num" style="font-size:${String(src.n || '').length > 5 ? 70 : 88}px;font-weight:900;letter-spacing:-3px">${esc(src.n || '')}</div></div>`;
  let h = titleH(lt, s, 52, 20, s._same);
  h += `<div style="position:relative;width:${W}px;height:${H}px"><svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;overflow:visible">${svg}</svg>${srcBox}${boxes}</div>`;
  h += textH(lt, s, .4 + n * .28, 68);
  wrapC(h);
};

/* cells: 칸 채우기(17개 시도 · 리그 8칸) — items:[{t,on,x}], dim:true 면 전체 흐려지고 가운데 큰 글씨(center) */
SCENE.cells = (lt, s) => {
  const its = s.items || [], cols = s.cols || 6, cw = s.cw || 230, chh = s.ch || 110;
  let h = titleH(lt, s, 52, 26, s._same);
  const dimP = s.dim ? seg(lt, .2, .6) : 0;
  h += `<div style="position:relative"><div style="display:grid;grid-template-columns:repeat(${cols},${cw}px);gap:16px;justify-content:center;filter:grayscale(${dimP});opacity:${1 - dimP * .7}">` + its.map((it, i) => {
    const p = s._same ? 1 : pk(s, it.at, .35, seg(lt, .1 + i * Math.min(.06, 1 / its.length), .35)), on = it.on !== false;
    const ic = it.icon && ICON[it.icon] ? `<div style="width:${Math.round(chh * .55)}px;height:${Math.round(chh * .55)}px;flex:0 0 auto;margin-right:18px">${ICON[it.icon](it.hi || it.bad ? '#fff' : (it.c || ACC))}</div>` : '';
    return `<div style="height:${chh}px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:${it.fs || 40}px;font-weight:900;letter-spacing:-1px;
      background:${on ? (it.bad ? RED : it.hi ? (it.c || ACC) : '#fff') : 'transparent'};color:${on ? (it.hi || it.bad ? '#fff' : TXT) : '#AAB2BF'};border:4px ${on ? 'solid' : 'dashed'} ${on ? (it.bad ? RED : it.hi ? (it.c || ACC) : LINE) : '#C9D0DB'};line-height:1.15;text-align:center;${s._same && JSON.stringify((s._prev.items || [])[i]) !== JSON.stringify(it) ? pop(seg(lt, .15, .4)) : pop(p)}">${ic}${br(it.t || '')}</div>`;
  }).join('') + `</div>`;
  if (s.center) h += `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div class="num" style="background:#12161F;color:#fff;font-size:120px;font-weight:900;letter-spacing:-4px;padding:18px 60px;border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.3);${pop(seg(lt, .5, .5))}">${esc(s.center)}</div></div>`;
  h += `</div>`;
  if (s.label) h += `<div class="badge" style="margin-top:30px;background:#12161F;font-size:38px;padding:12px 30px;${rise(seg(lt, .3, .4), 16)}">${esc(s.label)}</div>`;
  h += textH(lt, s, .8, 68);
  wrapC(h);
};

/* funnel: 깔때기 54 → 5 → 2 */
SCENE.funnel = (lt, s) => {
  const lv = (s.levels || []).slice(0, s.show || 99), NEW = s.newFrom ?? 0, n = lv.length, MAXW = 1300;
  let h = titleH(lt, s, 52, 26, s._same);
  h += `<div class="col" style="gap:14px">` + lv.map((l, i) => {
    const p = i < NEW ? 1 : seg(lt, .1 + (i - NEW) * .45, .5), w = Math.round(MAXW * Math.pow(.62, i)), last = i === n - 1 && n > 1;
    return `<div style="position:relative;display:flex;align-items:center;justify-content:center;${i < NEW ? '' : rise(p, 22)}">
      <div class="row" style="width:${w}px;height:130px;border-radius:${i ? 24 : 30}px;background:${last ? ACC : i ? '#3B4A63' : '#12161F'};color:#fff;gap:26px;clip-path:polygon(0 0,100% 0,${100 - 3}% 100%,3% 100%)">
        <span class="num" style="font-size:88px;font-weight:900;letter-spacing:-3px">${esc(l.n)}</span><span style="font-size:44px;font-weight:800">${esc(l.label || '')}</span></div>
      ${l.chip ? `<div style="position:absolute;left:100%;top:50%;transform:translateY(-50%);padding-left:28px"><div class="badge" style="background:#fff;color:${TXT};border:4px solid ${LINE};font-size:38px;padding:12px 26px;white-space:nowrap;${pop(seg(lt, .4 + (i - NEW) * .45, .4))}">${esc(l.chip)}</div></div>` : ''}</div>`;   /* 9/28: 칩은 막대 옆에 떠 있게(막대는 위 단과 같은 가운데 줄) */
  }).join('') + `</div>`;
  h += textH(lt, s, .5 + n * .45, 68);
  wrapC(h);
};

/* domino: 팀 칸이 차례로 쓰러진다(fall) / 쓰러진 채(down) / 한꺼번에 선다(rise) */
SCENE.domino = (lt, s) => {
  const n = s.n || 5, st = s.state || 'fall', W = 150, H = 300;
  let h = titleH(lt, s, 52, 30, false);
  const lean = st === 'fall' ? eo(seg(lt, .3 + (n - 1) * .22, .35)) : st === 'down' ? 1 : 1 - eo(seg(lt, .3, .7));
  h += `<div class="row" style="gap:70px;align-items:flex-end;height:${H + 40}px;transform:translateX(${(-120 * lean).toFixed(1)}px)">` + Array.from({ length: n }, (_, i) => {   /* 9/28: 쓰러진 칸은 오른쪽으로 눕는다 → 그만큼 왼쪽으로 옮겨 가운데 */
    let a;
    if (st === 'fall') a = 72 * eo(seg(lt, .3 + i * .22, .35));
    else if (st === 'down') a = 72;
    else a = 72 * (1 - eo(seg(lt, .3, .7)));
    const c = st === 'rise' ? ACC : a > 40 ? '#B8C0CC' : '#12161F';
    return `<div style="width:${W}px;height:${H}px;border-radius:20px;background:${c};transform-origin:100% 100%;transform:rotate(${a}deg);display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:900;writing-mode:vertical-rl;letter-spacing:4px;box-shadow:0 12px 30px rgba(18,22,31,.18)">${esc((s.labels || [])[i] || '팀')}</div>`;
  }).join('') + `</div><div style="width:1300px;height:8px;border-radius:4px;background:#12161F;opacity:.25"></div>`;
  if (s.caption) h += `<div class="row" style="gap:18px;margin-top:30px;${rise(seg(lt, .2, .4), 16)}">${s.caption.map((c, k) => `${k ? `<span style="font-size:48px;font-weight:900;color:${GRAY}">→</span>` : ''}<span class="badge" style="background:${k === s.caption.length - 1 ? ACC : '#12161F'};font-size:38px;padding:12px 28px">${esc(c)}</span>`).join('')}</div>`;
  h += textH(lt, s, 1.4, 68);
  wrapC(h);
};

/* flip: 뒤집힌 카드가 하나씩 열린다. items:[{back, sub, kind:'quote'|'flow'}], open:N, was:앞 장면에서 이미 열린 수 */
SCENE.flip = (lt, s) => {
  const its = s.items || [], open = s.open || 0, was = s.was || 0;
  let h = s.tag ? `<div class="tagout" style="margin-bottom:26px;${s._same || was ? '' : rise(seg(lt, 0, .4), 16)}">${esc(s.tag)}</div>` : '';
  h += `<div class="row" style="gap:44px;align-items:stretch">` + its.map((it, i) => {
    const isOpen = i < open, anim = isOpen && i >= was, p = anim ? seg(lt, .15, .6) : isOpen ? 1 : 0;
    const ang = 180 * (1 - eo(p)), showBack = ang < 90;
    const face = showBack
      ? `<div class="col" style="gap:22px;padding:40px 44px">${it.kind === 'quote' ? `<div style="position:absolute;left:40px;top:34px;font-size:120px;line-height:.9;font-weight:900;color:${ACC}">“</div>` : ''}
          <div style="font-size:${it.fs || 60}px;font-weight:900;letter-spacing:-2px;line-height:1.28;text-align:center;color:${TXT}">${br(it.back || '')}</div>
          ${it.sub ? `<div class="label" style="font-size:34px;text-align:center">${br(it.sub)}</div>` : ''}</div>`
      : `<div class="num" style="font-size:180px;font-weight:900;color:#fff;opacity:.9">${i + 1}</div>`;
    return `<div style="position:relative;width:${its.length > 2 ? 520 : 760}px;min-height:520px;border-radius:36px;display:flex;align-items:center;justify-content:center;
      background:${showBack ? '#fff' : '#12161F'};border:4px solid ${showBack ? (it.hi ? ACC : LINE) : '#12161F'};box-shadow:0 18px 48px rgba(18,22,31,.12);
      transform:perspective(1600px) rotateY(${showBack ? ang : 180 - ang}deg);${was || s._same ? '' : rise(seg(lt, i * .15, .4), 30)}">${face}</div>`;
  }).join('') + `</div>`;
  wrapC(h);
};

/* quote: 보도 인용 카드 — 매체·날짜 + 원문 한 문장 */
SCENE.quote = (lt, s) => {
  let h = `<div class="pane col" style="width:1500px;border-radius:40px;padding:56px 80px;gap:28px;align-items:flex-start;${rise(seg(lt, 0, .45), 30)}">
    ${(s.src || s.date) ? `<div class="row" style="gap:18px">${s.src ? `<span class="badge" style="background:#12161F;font-size:36px;padding:10px 26px">${esc(s.src)}</span>` : ''}${s.date ? `<span class="num" style="font-size:36px;font-weight:800;color:${GRAY}">${esc(s.date)}</span>` : ''}</div>` : ''}
    <div style="display:flex;gap:26px;align-items:flex-start"><div style="font-size:160px;line-height:.75;font-weight:900;color:${ACC}">“</div>
      <div style="font-size:${s.fs || 66}px;font-weight:900;letter-spacing:-2px;line-height:1.35;text-align:left;${rise(seg(lt, .2, .5), 16)}">${s.mark ? br(s.text).replace(esc(s.mark), `<span style="background:${ACC}26;box-shadow:inset 0 -18px 0 ${ACC}40">${esc(s.mark)}</span>`) : br(s.text)}</div></div>
    ${s.who ? `<div style="align-self:flex-end;font-size:40px;font-weight:800;color:${GRAY};${rise(seg(lt, .5, .4), 12)}">— ${esc(s.who)}</div>` : ''}</div>`;
  wrapC(h);
};


/* ───── 9/30 롱폼④(한화) 새 인포그래픽: rankline · password · scale · stack · contracts · zigzag ─────
   화면 글자는 이름·숫자·짧은 라벨만. cont:true 면 앞 장면 그림을 그대로 두고 새 부분만 움직인다. */

/* rankline: 연도별 순위 계단(1위 위 · 꼴찌 아래). series:[{name, color, pts:[[연도, 순위, 'last'|'ps'|'hi', '라벨']]}],
   from/to = 가로축 연도, show = 여기까지 그림, newFrom = 이 연도부터 새로 그려짐(앞은 그대로), teams = 세로축 칸 수 */
SCENE.rankline = (lt, s) => {
  const Y0 = s.from, Y1 = s.to, NT = s.teams || 10, W = s.w || 1560, H = s.h || 470, PADX = 46, R = s.r || 30;
  const x = y => PADX + (Y1 === Y0 ? .5 : (y - Y0) / (Y1 - Y0)) * (W - PADX * 2), yy = r => 18 + (r - 1) / (NT - 1) * (H - 36);
  const show = s.show ?? Y1, NEW = s.newFrom ?? (s._same ? show + 1 : Y0);
  let svg = '', dots = '';
  for (let r = 1; r <= NT; r++) svg += `<line x1="0" x2="${W}" y1="${yy(r)}" y2="${yy(r)}" stroke="${r === NT ? '#E5484D55' : LINE}" stroke-width="${r === NT ? 3 : 2}" ${r === NT ? 'stroke-dasharray="10 8"' : ''}/>`;
  (s.series || []).forEach((se, si) => {
    const pts = (se.pts || []).filter(p => p[0] >= Y0 && p[0] <= Math.min(Y1, show));
    const nNew = pts.filter(p => p[0] >= NEW).length, step = Math.min(s.step || .18, (s.span || 1.5) / Math.max(1, nNew));   /* 9/30: s.span = 점 전체가 찍히는 시간(초, 줄 길이에 맞춰 늘어남) */
    const col = se.color || ACC;
    let path = '', k = 0;
    pts.forEach((p, i) => {
      const isNew = p[0] >= NEW, q = isNew ? seg(lt, .15 + si * .3 + (k++) * step, .3) : 1;
      if (i > 0) { const a = pts[i - 1], xa = x(a[0]), ya = yy(a[1]), xb = x(p[0]), yb = yy(p[1]);
        path += `<line x1="${xa}" y1="${ya}" x2="${(xa + (xb - xa) * eo(q)).toFixed(1)}" y2="${(ya + (yb - ya) * eo(q)).toFixed(1)}" stroke="${col}" stroke-width="7" stroke-linecap="round" opacity="${q > 0 ? .55 : 0}"/>`; }
      const kind = p[2] || '', c = kind === 'last' ? RED : kind === 'ps' || kind === 'hi' ? col : '#8A93A3';
      const big = kind === 'hi';
      dots += `<div class="num" style="position:absolute;left:${x(p[0])}px;top:${yy(p[1])}px;width:${(big ? 1.35 : 1) * R * 2}px;height:${(big ? 1.35 : 1) * R * 2}px;margin:-${(big ? 1.35 : 1) * R}px 0 0 -${(big ? 1.35 : 1) * R}px;border-radius:50%;
        background:${c};color:#fff;display:flex;align-items:center;justify-content:center;font-size:${Math.round(R * (big ? 1.3 : 1.05))}px;font-weight:900;letter-spacing:-1px;box-shadow:0 6px 16px rgba(18,22,31,.18);${kind === 'ps' || big ? `outline:5px solid ${col}44;` : ''}${isNew ? pop(seg(lt, .15 + si * .3 + (k - 1) * step + .1, .3)) : ''}">${p[1]}</div>`;
      if (p[4] && p[4].length) { const fs = p[4], D = s.faceD || 112;   /* 9/30: 점 옆 작은 동그라미 얼굴(준우승 폰세·와이스) */
        fs.forEach((f, j) => { const src = photoSrc(f.img), q = isNew || !s._same ? seg(lt, .35 + si * .3 + k * step + j * .15, .4) : 1;
          const fx = x(p[0]) - R * 1.4 - (fs.length - j) * (D + 10), fy = yy(p[1]) - D / 2 + 6;
          dots += `<div style="position:absolute;left:${fx}px;top:${fy}px;width:${D}px;text-align:center;opacity:${c01(q * 1.6)};transform:scale(${(.4 + .6 * eb(q)).toFixed(3)}) rotate(${(j ? 6 : -6)}deg)">
            <div style="width:${D}px;height:${D}px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 6px 16px rgba(18,22,31,.25);background:#E9EDF3">${src ? `<img src="${src}" style="width:100%;height:100%;object-fit:cover">` : ''}</div>
            <div style="display:inline-block;margin-top:4px;background:${col};color:#fff;font-size:24px;font-weight:900;padding:2px 12px;border-radius:999px;white-space:nowrap">${esc(f.name || '')}</div></div>`; }); }
      if (p[3]) dots += `<div style="position:absolute;left:${x(p[0])}px;top:${yy(p[1]) + (p[1] > NT / 2 ? -R * 2.9 : R * 1.5)}px;translate:-50% 0;background:${c};color:#fff;font-size:30px;font-weight:900;padding:6px 16px;border-radius:999px;white-space:nowrap;${isNew || !s._same ? pop(seg(lt, .3 + si * .3 + k * step, .35)) : ''}">${esc(p[3])}</div>`;
    });
    svg += path;
    if (se.name && (s.series || []).length > 1) {
      const last = pts[pts.length - 1];
      if (last) dots += `<div style="position:absolute;left:${x(last[0]) + R * 1.6}px;top:${yy(last[1])}px;transform:translateY(-50%);font-size:34px;font-weight:900;color:${col};white-space:nowrap">${esc(se.name)}</div>`;
    }
  });
  const every = s.every || (Y1 - Y0 > 12 ? 2 : 1);
  let ax = '';
  for (let y = Y0; y <= Y1; y++) if ((y - Y0) % every === 0 || y === Y1 || (s.ticks || []).includes(y))
    ax += `<div class="num" style="position:absolute;left:${x(y)}px;top:${H + 12}px;transform:translateX(-50%);font-size:28px;font-weight:800;color:${(s.ticks || []).includes(y) ? TXT : GRAY}">${y}</div>`;
  const yl = `<div style="position:absolute;left:-58px;top:${yy(1)}px;transform:translateY(-50%);font-size:28px;font-weight:900;color:${GRAY}">1위</div><div style="position:absolute;left:-${NT >= 10 ? 72 : 58}px;top:${yy(NT)}px;transform:translateY(-50%);font-size:28px;font-weight:900;color:${RED}">${NT}위</div>`;
  let h = titleH(lt, s, 52, 18, s._same);
  h += `<div style="position:relative;width:${W}px;height:${H + 52}px;margin-left:40px"><svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;overflow:visible">${svg}</svg>${yl}${dots}${ax}</div>`;
  if (s.label) h += `<div class="badge" style="margin-top:14px;background:#12161F;font-size:36px;padding:10px 28px;${s._same && s._prev.label === s.label ? '' : rise(seg(lt, .5, .4), 14)}">${esc(s.label)}</div>`;
  wrapC(h);
};

/* password: 숫자 10개가 입력창에 하나씩 찍히고 아래에 연도가 붙는다. red:[칸 번호] 빨강(꼴찌), cont 면 이미 찍힌 상태 */
SCENE.password = (lt, s) => {
  const d = String(s.digits || ''), ys = s.years || [], n = d.length, red = new Set(s.red || []), BW = 132, BH = 176;
  const typed = s._same ? 1e9 : 0;
  let h = titleH(lt, s, 52, 26, s._same);
  h += `<div class="pane" style="border-radius:34px;padding:34px 40px 28px;${s._same ? '' : rise(seg(lt, 0, .35), 24)}"><div class="row" style="gap:12px;align-items:flex-start">` + [...d].map((c, i) => {
    const q = s._same ? 1 : seg(lt, .2 + i * .14, .18), r = red.has(i), rp = r ? (s._same && (s._prev.red || []).includes(i) ? 1 : seg(lt, .3 + [...red].indexOf(i) * .12, .35)) : 0;
    const bg = mixC('#12161F', '#E5484D', rp);
    return `<div class="col" style="gap:12px;width:${BW}px">
      <div class="num" style="width:${BW}px;height:${BH}px;border-radius:22px;background:${q > 0 ? bg : '#F4F6FA'};border:4px solid ${q > 0 ? bg : LINE};color:#fff;display:flex;align-items:center;justify-content:center;font-size:118px;font-weight:900;letter-spacing:-3px;transform:scale(${(1 + .12 * Math.sin(Math.PI * q)).toFixed(3)})"><span style="opacity:${c01(q * 2)}">${c}</span></div>
      <div class="num" style="font-size:30px;font-weight:800;color:${r ? RED : GRAY};opacity:${c01(q * 2)}">${esc(ys[i] || '')}</div></div>`;
  }).join('') + `</div></div>`;
  if (s.label) h += `<div class="badge" style="margin-top:30px;background:${(s.red || []).length ? RED : '#12161F'};font-size:40px;padding:12px 32px;${s._same && s._prev.label === s.label ? '' : pop(seg(lt, s._same ? .4 : .3 + n * .14, .4))}">${esc(s.label)}</div>`;
  wrapC(h);
};

/* scale: 저울. left/right:{label, v, chips:[이름]}, tilt(도, +면 왼쪽이 내려감). cont 면 앞 기울기에서 이어서 */
SCENE.scale = (lt, s) => {
  const W = 1600, H = 620, cx = W / 2, cy = 140, L = 520;
  const t0 = s._same ? (s._prev.tilt || 0) : 0, q = eo(seg(lt, s._same ? .1 : .35, .9));
  const a = (t0 + ((s.tilt || 0) - t0) * q) * Math.PI / 180;   /* +: 왼쪽 아래로(시계 반대) */
  const lx = cx - L * Math.cos(a), ly = cy + L * Math.sin(a), rx = cx + L * Math.cos(a), ry = cy - L * Math.sin(a);
  const pan = (P, px, py, side) => { const pc = (P || {}).chips || [];
    return `<div style="position:absolute;left:${px}px;top:${py}px;width:2px;height:70px;background:#3B4A63"></div>
    <div class="col" style="position:absolute;left:${px}px;top:${py + 70}px;transform:translateX(-50%);width:500px;gap:10px">
      <div style="width:500px;height:16px;border-radius:0 0 200px 200px;background:#3B4A63"></div>
      <div class="pane col" style="width:480px;border-radius:30px;padding:26px 22px;gap:10px;border:4px solid ${side === 'L' ? (s.lcolor || ACC) : (s.rcolor || '#3B4A63')}">
        <div style="font-size:56px;font-weight:900;letter-spacing:-1.5px;white-space:nowrap">${esc((P || {}).label || '')}</div>
        ${(P || {}).v ? `<div class="num" style="font-size:100px;font-weight:900;letter-spacing:-3px;color:${side === 'L' ? (s.lcolor || ACC) : TXT}">${esc(P.v)}</div>` : ''}
        ${pc.length ? `<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">${pc.map((c, i) => `<span class="badge" style="background:${ACC};font-size:40px;padding:8px 22px;${(s._same && ((s._prev[side === 'L' ? 'left' : 'right'] || {}).chips || []).includes(c)) ? '' : pop(seg(lt, .5 + i * .2, .35))}">${esc(c)}</span>`).join('')}</div>` : ''}
      </div></div>`; };
  let h = titleH(lt, s, 52, 10, s._same);
  h += `<div style="position:relative;width:${W}px;height:${H}px;${s._same ? '' : rise(seg(lt, 0, .35), 24)}">
    <div style="position:absolute;left:${cx - 12}px;top:${cy}px;width:24px;height:${H - cy - 30}px;background:#3B4A63;border-radius:12px"></div>
    <div style="position:absolute;left:${cx - 150}px;top:${H - 40}px;width:300px;height:30px;border-radius:15px;background:#3B4A63"></div>
    <div style="position:absolute;left:${cx - L}px;top:${cy - 9}px;width:${L * 2}px;height:18px;border-radius:9px;background:#12161F;transform:rotate(${(-a * 180 / Math.PI).toFixed(2)}deg);transform-origin:50% 50%"></div>
    ${s.pivotLogo && LOGO[(T(s.pivotLogo) || {}).code] ? `<div style="position:absolute;left:${cx - 62}px;top:${cy - 62}px;width:124px;height:124px;border-radius:50%;background:#fff;border:6px solid ${ACC};box-shadow:0 8px 20px rgba(18,22,31,.2);display:flex;align-items:center;justify-content:center"><img src="${LOGO[(T(s.pivotLogo) || {}).code]}" style="width:84%;height:84%;object-fit:contain"></div>` : `<div style="position:absolute;left:${cx - 26}px;top:${cy - 26}px;width:52px;height:52px;border-radius:50%;background:${ACC}"></div>`}   <!-- 9/30: 저울 가운데 구단 로고(pivotLogo) -->
    ${pan(s.left, lx, ly, 'L')}${pan(s.right, rx, ry, 'R')}</div>`;
  wrapC(h);
};

/* stack: FA 계약 카드가 겨울별 칸에 쌓인다. cols:[{h:'2013 겨울', cards:[{n:'정근우', v:'70억'}]}],
   newFrom = 앞 장면에서 이미 보인 카드 수(앞에서부터), brace:{from,to,label} 칸 묶음 괄호, total:'255억+' */
SCENE.stack = (lt, s) => {
  const cols = s.cols || [], nc = cols.length, CW = Math.min(360, Math.floor(1680 / Math.max(1, nc)) - 24), NEW = s.newFrom ?? 0;
  let idx = 0, nNew = 0, h = titleH(lt, s, 52, 34, s._same);
  const PREV = s._same ? new Set((s._prev.cols || []).flatMap(c => (c.cards || []).map(x => x.n))) : null;   /* 9/30: 앞 장면에 있던 카드는 그대로, 새 카드만 떨어진다 */
  const maxN = Math.max(2, ...cols.map(c => (c.cards || []).length)), CH = maxN > 3 ? 108 : 128;
  h += `<div style="position:relative">`;
  if (s.brace) { const b = s.brace, pb = s._same && s._prev.brace && s._prev.brace.label === b.label ? 1 : seg(lt, .5, .45);
    const L0 = b.from * (CW + 24), L1 = (b.to + 1) * (CW + 24) - 24;
    h += `<div style="position:absolute;left:${L0}px;width:${L1 - L0}px;top:0;height:64px;${pop(pb)}"><div style="position:absolute;left:0;right:0;bottom:0;height:22px;border:5px solid ${ACC};border-bottom:none;border-radius:14px 14px 0 0"></div>
      <div style="position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:${ACC};color:#fff;font-size:34px;font-weight:900;padding:6px 22px;border-radius:999px;white-space:nowrap">${esc(b.label)}</div></div>`; }
  h += `<div class="row" style="gap:24px;align-items:flex-end;margin-top:76px">` + cols.map((c, ci) => {
    const cards = (c.cards || []).map(cd => { const i = idx++, isNew = PREV ? !PREV.has(cd.n) : i >= NEW, p = isNew ? seg(lt, .15 + (nNew++) * .22, .35) : 1;
      return `<div class="pane" style="width:${CW}px;height:${CH}px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:4px solid ${cd.hi ? ACC : LINE};${isNew ? `opacity:${c01(p * 1.4)};transform:translateY(${((1 - eo(p)) * -90).toFixed(1)}px)` : ''}">
        <div style="font-size:${CW < 260 ? 38 : 46}px;font-weight:900;letter-spacing:-1.5px;white-space:nowrap">${esc(cd.n)}</div>
        <div class="num" style="font-size:${CW < 260 ? 42 : 54}px;font-weight:900;color:${ACC};letter-spacing:-2px;white-space:nowrap">${esc(cd.v)}</div></div>`; }).reverse().join('');
    const had = PREV ? (c.cards || []).some(x => PREV.has(x.n)) : (idx - (c.cards || []).length) < NEW, empty = !(c.cards || []).length;
    return `<div class="col" style="gap:12px;width:${CW}px;justify-content:flex-end;height:${maxN * (CH + 12) + 60}px">${cards}
      <div class="num" style="font-size:32px;font-weight:900;color:${GRAY};white-space:nowrap;border-top:4px solid ${empty ? '#C9D0DB' : '#12161F'};padding-top:8px;width:100%;text-align:center;opacity:${empty ? .35 : had ? 1 : c01(.35 + seg(lt, .1, .3))}">${esc(c.h)}</div></div>`;   /* 9/30: 아직 안 나온 겨울 칸은 이름만 흐리게(자리 미리 잡음) */
  }).join('') + `</div></div>`;
  if (s.total) h += `<div class="num" style="margin-top:22px;background:#12161F;color:#fff;font-size:56px;font-weight:900;padding:10px 40px;border-radius:26px;letter-spacing:-2px;${s._same && s._prev.total === s.total ? '' : pop(seg(lt, .4 + nNew * .22, .45))}">${esc(s.total)}</div>`;
  wrapC(h);
};

/* contracts: 감독 계약 막대. rows:[{name, a, b, x, now, empty}] a=부임, b=계약 끝, x=중도 퇴진, now=진행 중 끝.
   newFrom = 앞 장면에서 보인 줄 수 */
SCENE.contracts = (lt, s) => {
  const Y0 = s.from || 2014.5, Y1 = s.to || 2027, rows = s.rows || [], n = rows.length, NEW = s.newFrom ?? (s._same ? (s._prev.rows || []).length : 0);
  const FACE = rows.some(r => photoSrc(r.img)), FD = n <= 2 ? 200 : 150;   /* 10/1 밤 사용자: 감독 계약에 사진(감독·단장) → 왼쪽 칸에 둥근 사진 + 이름 + 직책, 막대도 굵게 */
  const W = FACE ? 900 : 1100, LW = FACE ? 440 : 300;   /* 10/1 밤 사용자 "너무 오른쪽으로 치우쳤어" → 전체 1340 을 가운데에 */
  const RH = FACE ? (n <= 2 ? 250 : 190) : n > 5 ? 72 : n > 4 ? 84 : 104, BH = FACE ? (n <= 2 ? 72 : 56) : n > 5 ? 40 : 50, x = y => c01((y - Y0) / (Y1 - Y0)) * W;
  let h = titleH(lt, s, 52, 18, s._same);
  const ticks = s.ticks || [2015, 2017, 2019, 2021, 2023, 2025, 2027];
  h += `<div style="position:relative;width:${LW + W}px"><div style="position:relative;height:40px;margin-left:${LW}px">${ticks.map(y => `<div class="num" style="position:absolute;left:${x(y)}px;transform:translateX(-50%);font-size:28px;font-weight:800;color:${GRAY}">${y}</div>`).join('')}</div>`;
  rows.forEach((r, i) => {
    const isNew = i >= NEW, p = isNew ? seg(lt, .1 + (i - NEW) * .4, .35) : 1, g = isNew ? eo(seg(lt, .25 + (i - NEW) * .4, .5)) : 1;
    let bar = '';
    if (r.text) bar = `<div style="position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:${FACE ? 44 : 34}px;font-weight:900;letter-spacing:-1.5px;color:${r.textColor || RED};white-space:nowrap;opacity:${c01((g - .3) * 3)}">${br(r.text)}</div>`;   /* 10/1 밤: 막대 대신 글(계약 기간을 모르는 단장 등) */
    else if (r.empty) bar = `<div style="position:absolute;left:${x(r.a)}px;width:${x(r.b) - x(r.a)}px;top:${(RH - BH) / 2}px;height:${BH}px;border-radius:${BH / 2}px;border:4px dashed #AAB2BF;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#AAB2BF">?</div>`;
    else {
      const end = r.x || r.now || r.b, cut = !!r.x;
      bar = `<div style="position:absolute;left:${x(r.a)}px;width:${x(r.b) - x(r.a)}px;top:${(RH - BH) / 2}px;height:${BH}px;border-radius:${BH / 2}px;background:#E3E7EE;border:3px dashed #B8C0CC"></div>
        <div style="position:absolute;left:${x(r.a)}px;width:${((x(end) - x(r.a)) * g).toFixed(1)}px;top:${(RH - BH) / 2}px;height:${BH}px;border-radius:${BH / 2}px;background:${cut ? '#3B4A63' : ACC}"></div>
        ${cut ? `<div style="position:absolute;left:${x(end)}px;top:${(RH - BH) / 2 - 10}px;width:8px;height:${BH + 20}px;margin-left:-4px;border-radius:4px;background:${RED};opacity:${c01((g - .9) * 10)}"></div>` : ''}
        ${r.tag ? `<div style="position:absolute;left:${x(r.b) + 16}px;top:50%;transform:translateY(-50%);font-size:${FACE ? 40 : 30}px;font-weight:900;color:${r.tagColor || (cut ? RED : ACC)};white-space:nowrap;opacity:${c01((g - .8) * 5)}">${esc(r.tag)}</div>` : ''}`;
    }
    const fsrc = photoSrc(r.img);
    const nameCell = FACE
      ? `<div style="width:${LW}px;flex:0 0 ${LW}px;display:flex;align-items:center;gap:20px"><div style="width:${FD}px;height:${FD}px;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 10px 26px rgba(18,22,31,.2);background:#E9EDF3;flex:0 0 auto">${fsrc ? `<img src="${fsrc}" style="width:100%;height:100%;object-fit:cover;object-position:${esc(r.focus || '50% 0%')}">` : ''}</div>
          <div class="col" style="align-items:flex-start;gap:6px"><div style="font-size:${n <= 2 ? 60 : 48}px;font-weight:900;letter-spacing:-2px;white-space:nowrap;color:${r.empty ? '#AAB2BF' : TXT}">${esc(r.name || '')}</div>${r.role ? `<div class="badge" style="background:${r.roleColor || '#12161F'};font-size:30px;padding:6px 18px">${esc(r.role)}</div>` : ''}</div></div>`
      : `<div style="width:${LW}px;flex:0 0 ${LW}px;text-align:left;font-size:${n > 5 ? 40 : 46}px;font-weight:900;letter-spacing:-1.5px;white-space:nowrap;color:${r.empty ? '#AAB2BF' : TXT}">${esc(r.name || '')}</div>`;
    h += `<div style="display:flex;align-items:center;height:${RH}px;${isNew ? rise(p, 16) : ''}">${nameCell}
      <div style="position:relative;width:${W}px;height:${RH}px;border-bottom:1px solid ${LINE}">${bar}</div></div>`;
  });
  h += `</div>`;
  if (s.label) h += `<div class="badge cc" style="margin-top:22px;background:${RED};font-size:38px;padding:10px 30px;${s._same && s._prev.label === s.label ? '' : pop(seg(lt, .4 + (n - NEW) * .4, .4))}">${esc(s.label)}</div>`;
  wrapC(h);
};

/* zigzag: 방향이 번갈아 꺾이는 화살표. labels:['성적','리빌딩',...] */
SCENE.zigzag = (lt, s) => {
  const lb = s.labels || [], n = lb.length, W = 1500, H = 420, dx = W / (n + .3);
  const pts = [[20, H / 2]]; lb.forEach((_, i) => pts.push([20 + dx * (i + 1), i % 2 ? H - 50 : 50]));
  const tot = pts.length - 1, q = seg(lt, .15, .35 * n) * tot;
  let d = `M${pts[0][0]},${pts[0][1]}`, tip = pts[0], ang = 0;
  for (let i = 1; i <= tot; i++) { const f = c01(q - (i - 1)); if (f <= 0) break; const a = pts[i - 1], b = pts[i];
    tip = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI; d += ` L${tip[0].toFixed(1)},${tip[1].toFixed(1)}`; }
  let lab = '';
  lb.forEach((t, i) => { const p = pts[i + 1], on = c01((q - i) * 1.5), up = i % 2 === 0;
    lab += `<div style="position:absolute;left:${p[0]}px;top:${p[1] + (up ? -84 : 30)}px;transform:translateX(-50%);background:${up ? ACC : '#3B4A63'};color:#fff;font-size:40px;font-weight:900;padding:8px 24px;border-radius:999px;white-space:nowrap;opacity:${c01(on * 1.4)}">${esc(t)}</div>`; });
  let h = titleH(lt, s, 52, 30, false);
  h += `<div style="position:relative;width:${W}px;height:${H + 60}px"><svg width="${W}" height="${H}" style="position:absolute;left:0;top:30px;overflow:visible">
    <path d="${d}" fill="none" stroke="#12161F" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <g transform="translate(${tip[0]},${tip[1]}) rotate(${ang})"><path d="M-6,-26 L34,0 L-6,26 Z" fill="#12161F"/></g></svg>
    <div style="position:absolute;left:0;top:30px;width:${W}px;height:${H}px">${lab}</div></div>`;
  h += textH(lt, s, .3 + n * .35, 64);
  wrapC(h);
};


/* trade: 트레이드 애니메이션(9/30 사용자 지시 — 힉스필드 없이 직접). 왼쪽 = 보내는 팀 캐릭터(머리가 구단 로고), 오른쪽 = 받는 팀 캐릭터들.
   선수 얼굴 동그라미가 날아가고, 받는 팀이 '신인 지명권' 티켓을 돌려준다. trades:[{img, name, to, year}], from:'키움', ticket:'신인 지명권'
   시각은 이 줄의 호흡 시작(EP.segT)에 맞춘다 — atSeg:[각 트레이드가 시작할 호흡 번호(소수 가능)] */
function charSVG(code, col, t, phase) {
  const bob = Math.sin(t * 3.2 + phase) * 6, lg = LOGO[code] || '';
  return `<div style="position:relative;width:200px;height:300px;transform:translateY(${bob.toFixed(1)}px)">
    <div style="position:absolute;left:45px;top:150px;width:110px;height:120px;border-radius:50px 50px 36px 36px;background:${col};box-shadow:inset -10px -10px 0 rgba(0,0,0,.12)"></div>
    <div style="position:absolute;left:62px;top:258px;width:26px;height:40px;border-radius:12px;background:${col};filter:brightness(.8)"></div>
    <div style="position:absolute;left:112px;top:258px;width:26px;height:40px;border-radius:12px;background:${col};filter:brightness(.8)"></div>
    <div style="position:absolute;left:20px;top:170px;width:34px;height:70px;border-radius:17px;background:${col};transform:rotate(18deg);filter:brightness(.9)"></div>
    <div style="position:absolute;left:146px;top:170px;width:34px;height:70px;border-radius:17px;background:${col};transform:rotate(-18deg);filter:brightness(.9)"></div>
    <div style="position:absolute;left:10px;top:0;width:180px;height:170px;border-radius:50%;background:#fff;border:6px solid ${col};box-shadow:0 10px 24px rgba(18,22,31,.18);display:flex;align-items:center;justify-content:center;overflow:hidden">
      ${lg ? `<img src="${lg}" style="width:78%;height:78%;object-fit:contain">` : ''}</div>
  </div>`;
}
SCENE.trade = (lt, s) => {
  const W = 1760, H = 700, tr = s.trades || [], n = tr.length, SC = 1.3;   /* 캐릭터 1.3배 */
  const fromT = T(s.from || '키움'), fromCol = TEAMCOL[fromT.code] || '#820024';
  const FX = 40, FY = 230, TX = k => 860 + k * 320, TY = 230, CW = 200 * SC;
  const QX = FX + CW + 50, QY = k => FY - 80 + k * 180;   /* 보내는 팀 옆 줄(처음엔 선수, 트레이드 뒤엔 그 자리에 티켓) */
  const segs = (EP.segT || [])[s.startLine] || [], L0 = segs[0] ?? 0;
  const at = k => { const a = (s.atSeg || [])[k]; if (a == null || !segs.length) return .8 + k * 1.4;
    const i = Math.floor(a), f = a - i, t0 = segs[i] ?? segs[segs.length - 1], t1 = segs[i + 1] ?? (t0 + 1.5); return (t0 + (t1 - t0) * f) - L0; };
  const tnow = segs.length ? NOW - L0 : lt;
  const face = (x, px, py, sc, op) => { const src = photoSrc(x.img);
    return `<div style="position:absolute;left:${(px - 60).toFixed(1)}px;top:${(py - 60).toFixed(1)}px;width:120px;text-align:center;opacity:${op.toFixed(3)};transform:scale(${sc.toFixed(3)})">
      <div style="width:120px;height:120px;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 8px 22px rgba(18,22,31,.28);background:#E9EDF3">${src ? `<img src="${src}" style="width:100%;height:100%;object-fit:cover">` : ''}</div>
      <div style="display:inline-block;margin-top:6px;background:#12161F;color:#fff;font-size:30px;font-weight:900;padding:4px 14px;border-radius:999px;white-space:nowrap">${esc(x.name)}</div></div>`; };
  const ticket = (px, py, rot, op) => `<div style="position:absolute;left:${(px - 110).toFixed(1)}px;top:${(py - 30).toFixed(1)}px;width:220px;text-align:center;transform:rotate(${rot.toFixed(1)}deg);opacity:${op.toFixed(3)};
      background:linear-gradient(135deg,#FFE27A,#F5B301);border:4px dashed #8A5A00;border-radius:14px;padding:8px 0;font-size:32px;font-weight:900;color:#5A3A00;white-space:nowrap;box-shadow:0 8px 18px rgba(0,0,0,.22)">${esc(s.ticket || '신인 지명권')}</div>`;
  let st = `<div style="position:absolute;left:${FX}px;top:${FY}px;transform:scale(${SC});transform-origin:0 0;${pop(seg(lt, 0, .45))}">${charSVG(fromT.code, fromCol, NOW, 0)}
     <div style="text-align:center;font-size:36px;font-weight:900;color:${fromCol};margin-top:4px">${esc(fromT.nm || s.from)}</div></div>`;
  tr.forEach((x, k) => {
    const t = T(x.to), col = TEAMCOL[t.code] || '#3B4A63', t0 = at(k), p1 = c01((tnow - t0) / .9), p2 = c01((tnow - t0 - 1.0) / .9);
    st += `<div style="position:absolute;left:${TX(k)}px;top:${TY}px;transform:scale(${SC});transform-origin:0 0;${pop(seg(lt, .15 + k * .12, .45))}">${charSVG(t.code, col, NOW, k + 1)}
      <div style="text-align:center;font-size:36px;font-weight:900;color:${col};margin-top:4px">${esc(x.to)}${x.year ? `<span style="font-size:26px;color:${GRAY};margin-left:8px">${esc(x.year)}</span>` : ''}</div></div>`;
    /* 선수: 줄에서 대기 → 받는 팀 머리 위로 포물선 */
    const sx = QX + 60, sy = QY(k) + 60, ex = TX(k) + CW / 2, ey = TY - 90, e = eo(p1);
    const fx = sx + (ex - sx) * e, fy = sy + (ey - sy) * e - Math.sin(Math.PI * e) * 110;
    st += face(x, fx, fy, p1 > 0 && p1 < 1 ? 1 + .15 * Math.sin(Math.PI * p1) : 1, c01(seg(lt, .3 + k * .15, .4) * 1.4));
    /* 티켓: 받는 팀 → 선수가 있던 자리로 */
    if (p2 > 0) { const q = eo(p2), tx0 = TX(k) + CW / 2, ty0 = TY + 200, tx1 = QX + 110, ty1 = QY(k) + 60;
      st += ticket(tx0 + (tx1 - tx0) * q, ty0 + (ty1 - ty0) * q - Math.sin(Math.PI * q) * 120, -6 + 12 * (1 - q), c01(p2 * 3)); }
  });
  wrapC(titleH(lt, s, 52, 6, false) + `<div style="position:relative;width:${W}px;height:${H}px">${st}</div>`);
};

/* ───── 10/1 밤 롱폼⑤ 검수 반영 새 장면: speech · swap · backdoor · fork ─────
   글자만 있는 장면 금지(사용자) → 발언은 사진+말풍선, 교체는 화살표, 약점은 그림, 갈림길은 길 애니메이션 */

/* speech: 인물 사진 + 말풍선 여러 개(날짜 알약 + 말). bubbles:[{date, text, hi, hide}], cont 면 앞 말풍선은 그대로 두고 새 것만 */
SCENE.speech = (lt, s) => {
  const H0 = s.h || 620, PW = s.pw || 480, src = photoSrc(s.img), bs = s.bubbles || [], K = s._same;
  /* 10/4 사용자("원태인 이미지 바뀐 게 없는데 사라졌다가 다시 나와, 같은 장면이 이어지면 가만히 둬"): 앞 장면(profile/speech)과 같은 사진이면 cont 없이도 사진·이름은 그대로, 말풍선만 새로 */
  const KP = K || s._chain || !!(s._keep && s._prev && ['profile', 'speech'].includes(s._prev.type));
  const PV = K ? (s._prev.bubbles || []).filter(b => !b.hide).length : 0;
  const PF = (CHAINS[s._cid] || []).some(j => SC[j].type === 'profile');   /* 10/5: 묶음에 profile 이 있으면 이름 크기·여백을 profile 과 똑같이(이름이 안 움직이게) */
  const vis = src ? chainPhoto(s, src, PW, H0, lt, KP) : PH(s, H0, seg(lt, 0, .5));
  let t = `<div class="col" style="height:${H0}px;${s._tw ? 'width:' + s._tw + 'px;' : ''}justify-content:flex-start;align-items:flex-start;gap:22px;padding-top:${PF ? 8 : 4}px">
    <div style="${KP ? '' : rise(seg(lt, .04, .45), 22)}"><div class="mega"${(CHAINS[s._cid] || []).length > 1 ? ' data-keep="1"' : ''} style="font-size:${s.size || (PF ? 116 : 104)}px">${br(s.name || '')}</div>
      ${s.sub ? `<div class="badge" style="margin-top:${PF ? 14 : 12}px;background:${ACC};${KP && s._prev && s._prev.sub !== s.sub ? pop(seg(lt, .05, .4)) : ''}">${esc(s.sub)}</div>` : ''}</div>`;
  bs.forEach((b, i) => {
    const q = b.hide ? 0 : i < PV ? 1 : pk(s, b.at, .5, seg(lt, .15 + (i - PV) * .3, .5)), c = b.hi ? ACC : '#3B4A63';
    t += `<div style="position:relative;${s._tw ? 'align-self:stretch;' : ''}${b.hide ? 'visibility:hidden;' : ''}${pop(q)}">
      <div class="pane" style="position:relative;border-radius:30px;padding:22px 36px 24px;border:4px solid ${c};display:flex;flex-direction:column;gap:8px;align-items:flex-start">
        <div style="position:absolute;left:-26px;top:40px;width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;border-right:26px solid ${c}"></div><div style="position:absolute;left:-19px;top:42px;width:0;height:0;border-top:16px solid transparent;border-bottom:16px solid transparent;border-right:24px solid #fff"></div>
        ${b.date ? `<div class="badge" style="background:${c};font-size:30px;padding:6px 20px">${esc(b.date)}</div>` : ''}
        <div style="font-size:${b.size || 60}px;font-weight:900;letter-spacing:-2px;line-height:1.22;text-align:left;color:${b.hi ? ACC : TXT}">${br(b.text || '')}</div>${b.chips && typeof NPB12 !== 'undefined' ? `<div style="display:grid;grid-template-columns:repeat(6,auto);gap:8px;margin-top:6px">${NPB12.map((x, j) => `<div style="${pop(c01(q * 2.2 - .5 - j * .06))}">${npbChip(x, 112, 46, 22)}</div>`).join('')}</div>` : ''}</div></div>`;
  });
  t += `</div>`;
  B(LR(vis, t, false, PW));
};

/* swap: 교체 — items:[{top, from, to}] 카드마다 '전 → 후' 가 화살표로 움직인다 */
SCENE.swap = (lt, s) => {
  const its = s.items || [], n = its.length || 1, W = Math.min(820, Math.floor((1700 - 40 * (n - 1)) / n));
  let h = titleH(lt, s, 60, 36, false);
  /* stack: 카드를 위아래로 — 둘째 카드가 늦게 뜰 때 첫 카드가 왼쪽에 치우쳐 보이지 않게(10/2) */
  h += `<div class="${s.stack ? 'col' : 'row'}" style="gap:${s.stack ? 28 : 40}px;align-items:${s.stack ? 'center' : 'stretch'};justify-content:center">` + its.map((it, i) => {
    /* 10/2: at = 그 카드를 말하는 호흡(나레이션에 맞춰 뜸) / keep = 부상 대체처럼 원래 선수가 남는 경우 — 취소선·흐림 없음 */
    const p = pk(s, it.at, .45, seg(lt, .2 + i * .3, .45)), q = eo(it.at != null ? (brP(s, it.at, .6, .35) ?? 1) : seg(lt, .55 + i * .3, .6)), qx = it.keep ? 0 : q;
    return `<div class="pane col" style="width:${W}px;border-radius:32px;padding:34px 30px 38px;gap:22px;${rise(p, 30)}">
      ${it.top ? `<div class="label" style="font-size:44px;font-weight:800;color:${GRAY}">${br(it.top)}</div>` : ''}
      <div class="row" style="gap:26px;align-items:center;width:100%;justify-content:center">
        <div style="font-size:64px;font-weight:900;letter-spacing:-2px;color:${TXT};opacity:${(1 - .3 * qx).toFixed(2)};text-decoration:${qx > .6 ? 'line-through' : 'none'};text-decoration-thickness:7px;text-decoration-color:${RED}">${esc(it.from || '')}</div>
        <svg width="120" height="60" viewBox="0 0 120 60" style="flex:0 0 auto;overflow:visible"><path d="M6,30 H${(6 + 84 * q).toFixed(1)}" stroke="${ACC}" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M78,8 L112,30 L78,52" stroke="${ACC}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="${c01((q - .7) * 4)}"/></svg>
        <div style="font-size:72px;font-weight:900;letter-spacing:-2px;color:${ACC};${pop(c01((q - .5) * 2.5))}">${esc(it.to || '')}</div></div>
      ${it.note ? `<div class="label" style="font-size:36px;text-align:center">${br(it.note)}</div>` : ''}</div>`;
  }).join('') + `</div>`;
  h += textH(lt, s, .5 + n * .3, 72);
  B(LR('', `<div class="col" style="width:100%;align-items:center">${h}</div>`));
};

/* backdoor: '뒷문' 그림 — 야구장 담장과 뒷문. 문이 열리며 상대 득점(빨간 공)이 굴러 들어온다. team: 지키는 팀, runs: 공 개수, label */
SCENE.backdoor = (lt, s) => {
  const W = 1500, H = 560, t = T(s.team || 'NC'), col = TEAMCOL[t.code] || ACC, lg = LOGO[t.code] || '';
  const open = eo(seg(lt, .5, .7)), runs = s.runs || 3;
  const doorW = 340, doorH = 440, dx = 980, dy = H - doorH - 40;
  let h = titleH(lt, s, 56, 20, false);
  let g = `<div style="position:absolute;left:0;top:${H - 40}px;width:${W}px;height:40px;background:#2F6B3A;border-radius:0 0 20px 20px"></div>`;   /* 잔디 */
  g += `<div style="position:absolute;left:0;top:${H - 40 - 240}px;width:${W}px;height:240px;background:linear-gradient(180deg,#3B4A63,#2A3447);border-radius:18px 18px 0 0"></div>`;   /* 담장 */
  g += `<div style="position:absolute;left:0;top:${H - 40 - 240 - 14}px;width:${W}px;height:14px;background:#F2C94C"></div>`;   /* 홈런 라인 */
  /* 뒷문 틀 */
  g += `<div style="position:absolute;left:${dx - 16}px;top:${dy - 16}px;width:${doorW + 32}px;height:${doorH + 16}px;background:#12161F;border-radius:22px 22px 0 0"></div>`;
  /* 문짝(경첩 왼쪽, 열림) */
  g += `<div style="position:absolute;left:${dx}px;top:${dy}px;width:${doorW}px;height:${doorH}px;transform-origin:0 50%;transform:perspective(900px) rotateY(${(-105 * open).toFixed(1)}deg);background:${col};border-radius:16px 16px 0 0;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center">
    ${lg ? `<img src="${lg}" style="width:70%;height:70%;object-fit:contain;filter:brightness(1.05)">` : ''}<div style="position:absolute;right:22px;top:50%;width:22px;height:22px;border-radius:50%;background:#F2C94C"></div></div>`;
  /* 문 뒤 어둠 */
  g += `<div style="position:absolute;left:${dx}px;top:${dy}px;width:${(doorW * open).toFixed(1)}px;height:${doorH}px;background:#0A0D14;opacity:.9;z-index:-1"></div>`;
  /* 상대 득점 공이 문 안으로 굴러 들어옴 */
  for (let i = 0; i < runs; i++) { const q = eo(seg(lt, 1.1 + i * .25, .55)), x0 = W - 110 - i * 30, x1 = dx + doorW / 2 - 40, bx = x0 + (x1 - x0) * q, by = H - 40 - 86 - Math.abs(Math.sin(q * Math.PI * 2)) * 36;
    g += `<div style="position:absolute;left:${bx.toFixed(1)}px;top:${by.toFixed(1)}px;width:84px;height:84px;border-radius:50%;background:#fff;border:5px solid ${RED};box-shadow:0 8px 18px rgba(0,0,0,.25);opacity:${c01(seg(lt, 1.0 + i * .25, .2) * 2)};transform:rotate(${(q * -540).toFixed(0)}deg)"><div style="position:absolute;left:18px;top:8px;width:10px;height:62px;border-left:5px dashed ${RED};border-radius:50%"></div></div>`; }
  g += `<div style="position:absolute;left:${dx + doorW / 2}px;top:${dy - 86}px;translate:-50% 0;font-size:46px;font-weight:900;color:${RED};white-space:nowrap;${pop(seg(lt, .7, .4))}">${esc(s.doorLabel || '뒷문')}</div>`;
  if (s.score) g += `<div class="num" style="position:absolute;left:60px;top:40px;font-size:96px;font-weight:900;letter-spacing:-3px;color:${TXT};${rise(seg(lt, .2, .5), 20)}">${esc(s.score)}</div>`;
  h += `<div style="position:relative;width:${W}px;height:${H}px;overflow:hidden">${g}</div>`;
  if (s.label) h += `<div class="badge" style="margin-top:18px;background:${RED};font-size:42px;padding:10px 32px;${pop(seg(lt, 1.6, .4))}">${esc(s.label)}</div>`;
  wrapC(h);
};

/* fork: 갈림길 — 하나의 길이 둘로 갈라진다. left/right:{label, sub, bad}, pick:'left'|'right' 고른 길이 색으로 차오르고 공(선수)이 그 길을 따라간다 */
SCENE.fork = (lt, s) => {
  const W = 1600, H = 540, x0 = 120, y0 = H / 2, xm = 480, xr = W - 520, yl = 110, yr = H - 110, SW = 44;
  const q = eo(seg(lt, .35, .9)), pick = s.pick || 'right', L = s.left || {}, R = s.right || {};
  const path = (y) => `M${x0},${y0} H${xm} C${xm + 180},${y0} ${xm + 160},${y} ${xm + 360},${y} H${xr}`;
  const len = 1500;
  const road = (y, on) => `<path d="${path(y)}" fill="none" stroke="#D8DEE8" stroke-width="${SW}" stroke-linecap="round"/>` +
    (on ? `<path d="${path(y)}" fill="none" stroke="${ACC}" stroke-width="${SW}" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${(len * (1 - q)).toFixed(1)}"/>` : '');
  const bad = (y, b) => b ? `<g transform="translate(${xr + 10},${y})" opacity="${c01(seg(lt, .4, .4) * 1.5)}"><circle r="36" fill="${RED}"/><path d="M-15,-15 L15,15 M15,-15 L-15,15" stroke="#fff" stroke-width="9" stroke-linecap="round"/></g>` : '';
  const svg = `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;overflow:visible">${road(yl, pick === 'left')}${road(yr, pick === 'right')}${bad(yl, L.bad)}${bad(yr, R.bad)}
