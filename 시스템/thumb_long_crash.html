<!doctype html>
<!-- 야구자판기 롱폼 썸네일 '폭락 차트형' 1280x720 (2026-09-30 신설, 한화 롱폼④에서 사용자 확정)
     콘티 thumb: {"layout":"crash", "img":"KBO프로필/김경문", "logoTeam":"HH",
                 "lines":[[{"t":"한화","c":"#FF6A13","s":150,"st":"#fff","logo":true}],
                          [{"t":"500억","c":"#FFE200","s":160,"mt":6},{"t":"쓰고","c":"#fff","s":115,"ml":18}],
                          [{"t":"또 ","c":"#fff","s":125,"mt":-10},{"t":"9위","c":"#FF2D3D","s":260,"st":"#fff"}]]}
     규칙: 두꺼운 폰트(폰트\NotoSansKR-Black.otf) + 검정 테두리 + 그림자, 인물은 흰 테두리 누끼(투명 png) 오른쪽 크게,
     글자 묶음은 사진을 뺀 왼쪽 칸 가운데 정렬, 세로는 눈으로 가운데(아래 여백을 조금 더 — padding-bottom 44).
     배경 = 남색 + 인물 뒤 주황 빛 + 빨간 폭락 선. 날짜 배지 없음. -->
<html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:'NB';src:url('__FONT_DIR__/NotoSansKR-Black.otf')}
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_bold.ttf') format('truetype');font-weight:700 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
body{font-family:'NB','KBO',sans-serif;color:#fff}
#s{position:relative;width:1280px;height:720px;overflow:hidden}
.t{line-height:.98;letter-spacing:-4px;white-space:nowrap;-webkit-text-stroke:16px #000;paint-order:stroke fill;filter:drop-shadow(0 8px 0 rgba(0,0,0,.55))}
.t span{paint-order:stroke fill}
#face{position:absolute;right:-70px;bottom:-110px;height:800px;
  filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 18px 30px rgba(0,0,0,.7));
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 60px);mask-image:linear-gradient(90deg,transparent 0,#000 60px)}
.logo{height:150px;filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 10px 18px rgba(0,0,0,.6))}
#grp{position:absolute;left:40px;top:0;height:720px;width:760px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:44px}
#brand{position:absolute;right:22px;bottom:16px;font-size:24px;color:rgba(255,255,255,.85);letter-spacing:-1px;-webkit-text-stroke:5px #000;paint-order:stroke fill}
</style></head><body><div id="s">
<div id="bg" style="position:absolute;inset:0"></div>
<svg id="grid" width="1280" height="720" style="position:absolute;inset:0;opacity:.18"></svg>
<svg id="crash" width="1280" height="720" style="position:absolute;inset:0"></svg>
<img id="face">
<div id="grp"></div>
<div id="brand">야구자판기</div>
</div><script>
const TH=(window.EP&&EP.thumb)||{}, P=(window.EP&&EP.photos)||{}, LG=(window.EP&&EP.logos)||{};
function src(n){if(!n)return'';if(P[n])return P[n];const k=Object.keys(P).find(k=>k===n||k.replace(/\.[a-z0-9]+$/i,'')===n||k.endsWith('/'+n));return k?P[k]:''}
const ACC=TH.accent||'#FF6A13', NV=TH.navy||'#0A1A3A';
document.getElementById('bg').style.background=`radial-gradient(55% 80% at 82% 45%,${ACC}bf,${ACC}00 62%),linear-gradient(160deg,#132B5C,${NV} 50%,#020611)`;
document.getElementById('grid').innerHTML=Array.from({length:11},(_,i)=>`<line x1="0" x2="1280" y1="${60+i*60}" y2="${60+i*60}" stroke="#fff" stroke-width="1"/>`).join('');
const pts=TH.crashPts||[[0,170],[120,200],[220,160],[330,280],[430,240],[560,420],[660,370],[800,590],[900,550],[1010,700]];
const poly=pts.map(p=>p.join(',')).join(' ');
document.getElementById('crash').innerHTML=`<defs><filter id="g"><feGaussianBlur stdDeviation="10"/></filter></defs>
 <polyline points="${poly}" fill="none" stroke="#FF2D3D" stroke-width="34" stroke-linejoin="round" filter="url(#g)" opacity=".8"/>
 <polyline points="${poly}" fill="none" stroke="#FF2D3D" stroke-width="18" stroke-linejoin="round"/>`;
const f=document.getElementById('face'), fs=src(TH.img); if(fs)f.src=fs; else f.style.display='none';
if(TH.faceH)f.style.height=TH.faceH+'px';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const lines=TH.lines||[[{t:'제목',c:'#fff',s:150}]];
document.getElementById('grp').innerHTML=lines.map((ln,i)=>{
  const logo=ln.some(x=>x.logo)&&LG[TH.logoTeam||'HH']?`<img class="logo" src="${LG[TH.logoTeam||'HH']}">`:'';
  const spans=ln.map(x=>`<span style="font-size:${x.s||140}px;color:${x.c||'#fff'};${x.st?`-webkit-text-stroke:${x.sw||14}px ${x.st};`:''}${x.ml?`margin-left:${x.ml}px;`:''}">${esc(x.t)}</span>`).join('');
  return `<div class="t" style="display:flex;align-items:${logo?'center':'baseline'};gap:${logo?18:0}px;margin-top:${i?(ln[0].mt??-4):0}px">${logo}${spans}</div>`;
}).join('');
</script></body></html>
