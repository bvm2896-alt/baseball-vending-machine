<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* 야구분석 전용 썸네일 (thumb_analysis.html, 9/15) — 바탕 전체가 그 편 구단 색, 구단 로고가 화면 가득("썸네일에는 화면 가득 한화 로고").
   thumb: {teams|team, top(작은 문구), big(큰 문구), date(직접 지정 시), color(큰 글씨 색, 기본 흰색)} — img 는 쓰지 않는다(로고가 주인공). */
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_bold.ttf') format('truetype');font-weight:700 900}
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_medium.ttf') format('truetype');font-weight:400 600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F6F4EF}
body{font-family:'KBO','Noto Sans CJK KR','Malgun Gothic',sans-serif;font-weight:900;color:#fff;-webkit-font-smoothing:antialiased}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
.bg{position:absolute;inset:0}
.stripe{position:absolute;inset:0;background:repeating-linear-gradient(-55deg,rgba(255,255,255,0) 0 34px,rgba(255,255,255,.07) 34px 52px)}
.pill{position:absolute;display:inline-flex;align-items:center;gap:18px;height:104px;padding:0 40px;border-radius:52px;font-size:52px;letter-spacing:-1px;white-space:nowrap;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.logo{position:absolute;left:50%;transform:translateX(-50%);border-radius:180px;overflow:hidden;background:#fff;box-shadow:0 60px 140px rgba(0,0,0,.35)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.shade{position:absolute;left:0;right:0;bottom:0;height:1000px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.28) 45%,rgba(0,0,0,.62) 100%)}
.top{position:absolute;left:80px;font-size:92px;letter-spacing:-4px;line-height:1.05;color:#fff;white-space:nowrap;background:#12161F;padding:10px 36px;border-radius:24px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.bigw{position:absolute;left:80px;right:80px;font-size:230px;letter-spacing:-11px;line-height:1.0;white-space:nowrap;font-weight:900;text-shadow:0 14px 50px rgba(0,0,0,.5)}
.bar{position:absolute;left:80px;width:220px;height:22px;border-radius:11px;background:#fff}
.brand{position:absolute;right:80px;bottom:70px;font-size:44px;letter-spacing:4px;color:rgba(255,255,255,.75)}
.brand b{color:#fff}
</style></head><body><div id="st"></div>
<script>
/* @@SAFEZONE 10/7 — 쇼츠 목록(격자) 칸에서 실제로 보이는 영역 안에 글씨를 최대로(사용자 "썸네일 텍스트가 살짝 짤리는데 이 안에서 텍스트 최대화")
   실측(10/7 채널 Shorts 탭 캡처 1179x2556, 업로드한 썸네일 3장을 칸에 맞춰 대조, 일치도 0.98): 칸은 썸네일을 0.403배로 그려
   1080x1920 중 x 55~1025 · y 151~1769 만 보인다(좌우 55px · 위아래 151px 잘림). 아래는 '조회수' 글자 때문에 1560(SAFE_BOTTOM).
   글씨는 여기서 20px 더 안쪽(x 75~1005, 폭 930)에 '잉크(실제 글자 획)' 기준으로 넣는다.
   또 하나: 템플릿 스크립트가 도는 순간엔 KBO 폰트가 아직 안 불려 와서(document.fonts.check = false) 대체 폰트 폭으로 크기를 정했고,
   실제 폰트로 그리면 폭이 달라져 넘쳤다(클라우드 ① 썸네일 box 80~1036). → 폰트를 다 불러온 뒤에 크기를 정한다(TS.ready). */
const TS=(()=>{
  const VIS={L:55,R:1025,T:151,B:1769}, PAD=20, L=VIS.L+PAD, R=VIS.R-PAD, W=R-L;
  const cx=document.createElement('canvas').getContext('2d');
  function ink(sp){   // 한 줄(span)의 실제 글자 획 왼쪽·오른쪽 끝(화면 px)
    const cs=getComputedStyle(sp), b=sp.getBoundingClientRect();
    cx.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    cx.letterSpacing=(cs.letterSpacing==='normal')?'0px':cs.letterSpacing;
    const m=cx.measureText(sp.textContent), sw=(parseFloat(cs.webkitTextStrokeWidth)||0)/2;
    const ow=sp.offsetWidth||b.width||1, k=b.width/ow||1;   // 부모 transform(scale) 반영
    const l=b.left+(-m.actualBoundingBoxLeft-sw)*k, r=b.left+(m.actualBoundingBoxRight+sw)*k;
    return {l,r,w:r-l};
  }
  const fs=sp=>parseFloat(getComputedStyle(sp).fontSize);
  const setF=(sp,f)=>{sp.style.fontSize=f.toFixed(1)+'px';};
  function fitW(sp,target,maxF){   // 잉크 폭이 target 이 되는 글자 크기(넘지 않게)
    target=Math.min(target||W,W);
    for(let i=0;i<8;i++){ const w=ink(sp).w; if(w<=0) return; const f=Math.min(maxF||9999,fs(sp)*target/w); setF(sp,f); if(Math.abs(ink(sp).w-target)<1.5) break; }
    for(let i=0;i<60&&ink(sp).w>target;i++) setF(sp,fs(sp)-1);
  }
  function capW(sp,target){ target=Math.min(target||W,W); for(let i=0;i<8&&ink(sp).w>target;i++) setF(sp,fs(sp)*target/ink(sp).w*0.998); }
  function minL(sps){ return Math.min(...sps.map(sp=>ink(sp).l)); }
  function clamp(sps){   // 10/7 사용자 "다 잘리는 건 아니고 잘리는 썸네일만" → 보이는 칸(75~1005) 밖으로 나가는 줄만 고친다. 안 나가는 줄은 그대로.
    let n=0;
    for(const sp of sps){ if(!sp.textContent.trim()) continue; let i=ink(sp);
      if(i.l<L){ const cur=parseFloat(sp.style.left)||0; if(getComputedStyle(sp).position==='static') sp.style.position='relative'; sp.style.left=(cur+L-i.l).toFixed(1)+'px'; i=ink(sp); n++; }
      for(let k=0;k<80&&i.r>R;k++){ setF(sp,fs(sp)*0.995); i=ink(sp); if(k===0) n++; } }   // 왼쪽 끝은 그대로 두고 그 줄만 오른쪽 끝이 1005 안에 들 때까지 줄인다
    return n;
  }
  function ready(){ return Promise.all([...document.fonts].map(f=>f.load().catch(()=>{}))).then(()=>document.fonts.ready); }
  function fitBottom(e,sps,B){ B=B||1560; for(let i=0;i<40&&e&&e.getBoundingClientRect().bottom>B;i++){ for(const sp of sps) if(sp.style.fontSize) setF(sp,fs(sp)*0.97); if(parseFloat(getComputedStyle(e).fontSize)>2) setF(e,fs(e)*0.97); } }   // 아래 '조회수' 글자(1588~)에 안 가리게
  function report(sps){ return sps.filter(sp=>sp.textContent.trim()).map(sp=>{const i=ink(sp);return `${sp.textContent} ${Math.round(i.l)}~${Math.round(i.r)}`;}).join(' / '); }
  return {VIS,L,R,W,B:1560,ink,fitW,capW,minL,clamp,fitBottom,ready,report};
})();
window.__thumbAsync=true;

const EP=window.EP||{}, TH=EP.thumb||{};
const COLOR={SS:'#074CA1',KT:'#1E5EFF',LG:'#C30452',HT:'#EA0029',OB:'#2B2A5E',NC:'#315288',LT:'#1E3A6B',SK:'#CE0E2D',HH:'#FC4E00',WO:'#820024'};
const ALIAS={'기아':'HT','KIA':'HT','엘지':'LG','케이티':'KT','엔씨':'NC','SSG':'SK','두산':'OB','삼성':'SS','롯데':'LT','한화':'HH','키움':'WO'};
const codeOf=n=>{const t=(EP.standings||[]).find(t=>t.team===n||t.code===n||t.code===ALIAS[n]);return t?t.code:(ALIAS[n]||n)};
const logo=c=>(EP.logos||{})[c]||'';
const teams=(TH.teams||(TH.team?[TH.team]:[EP.focusTeam||''])).map(codeOf).filter(Boolean);
const nl=t=>String(t||'').replace(/["“”'‘’]/g,'').split('\n').join('<br>');   // 썸네일 글씨엔 따옴표를 넣지 않는다(9/15)
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const c1=COLOR[teams[0]]||'#E5484D';
const hex2=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const dark=(h,k)=>{const n=parseInt(h.slice(1),16);const f=x=>Math.round(x*k);return `rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`};
const cBig=TH.color||'#fff';
// 날짜 배지 = '올리는 날짜'(콘티 date) — 레일 날짜·제목 첫 해시태그와 같은 날. 2026-09-17 사용자 지시로 '경기 날짜'에서 바꿈
const dateText=(()=>{ if(TH.date) return TH.date; let d=new Date((EP.date||EP.gameDate||'')+'T00:00:00'); if(isNaN(d)) return EP.dateLabel||'';
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; })();
const bigLines=String(TH.big||'').split('\n').length;
const BIG_H = 230*bigLines, TOP_H = 92*String(TH.top||'').split('\n').length + 20;
const yBig = 1660 - BIG_H, yTop = yBig - 34 - TOP_H;   // 안전 영역 아래 1660 에 맞춰 위로 쌓는다
const LOGO_Y = 150, LOGO_S = Math.min(940, yTop - 40 - LOGO_Y);   // 로고는 글과 겹치지 않게(9/15: 흰 로고 바탕과 흰 글씨가 겹쳐 안 보임) — 글 위 40px 까지만
const st=document.getElementById('st');
st.insertAdjacentHTML('beforeend',`
  <div class="bg" style="background:linear-gradient(180deg,${c1} 0%,${c1} 55%,${dark(c1,.72)} 100%)"></div><div class="stripe"></div>
  <div class="logo" style="top:${LOGO_Y}px;width:${LOGO_S}px;height:${LOGO_S}px"><img src="${logo(teams[0])}"></div>
  <div class="shade"></div>
  <div class="pill" style="left:70px;top:200px;background:#12161F;color:#fff"><span style="width:18px;height:18px;border-radius:9px;background:${c1};display:inline-block"></span>${esc(EP.railTitle||"KBO 분석")}</div>
  <div class="pill" style="right:70px;top:200px;background:#fff;color:#12161F;font-size:56px">${esc(dateText)}</div>
  <div class="top" style="top:${yTop}px">${nl(TH.top)}</div>
  <div class="bigw" style="color:${cBig};top:${yBig}px">${nl(TH.big)}</div>
  <div class="brand">야구<b>자판기</b></div>`);
// 10/7: 폰트를 다 불러온 뒤 글씨 크기를 정하고, 큰 글씨는 잉크 기준 쇼츠 목록 보이는 칸(930) 안
function __fit(){
for(const sel of ['.top','.bigw']){
  const e=document.querySelector(sel); if(!e) continue;
  const lines=e.innerHTML.split('<br>');
  e.innerHTML=lines.map(l=>`<span style="white-space:nowrap">${l}</span>`).join('<br>');
  const sps=[...e.querySelectorAll('span')];
  let fs=parseFloat(getComputedStyle(e).fontSize);
  const w=()=>Math.max(...sps.map(sp=>sp.getBoundingClientRect().width));
  const lim=sel==='.top'?840:920, minfs=sel==='.top'?44:60;   // .top 은 알약 여백(72px) 때문에 840 까지만(9/16 키움 편 글자 이탈)
  while(w()>lim&&fs>minfs){fs-=4;e.style.fontSize=fs+'px';}
}
const all=[...document.querySelectorAll('.top span,.bigw span')]; window.__thumbClamped=TS.clamp(all); window.__thumbReport=TS.report(all);
}
TS.ready().then(__fit,__fit).then(()=>{window.__thumbDone=true;},()=>{window.__thumbDone=true;});
</script></body></html>
