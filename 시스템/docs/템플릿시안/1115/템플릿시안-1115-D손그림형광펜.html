<!doctype html><html><head><meta charset=utf-8><style>@font-face{font-family:K;src:url('__ROOT__/폰트/YG-KR-Black.otf');font-weight:900}@font-face{font-family:K;src:url('__ROOT__/폰트/YG-KR-Bold.otf');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}body{width:1920px;height:1080px;overflow:hidden;font-family:K;position:relative}.ab{position:absolute}
.sub{position:absolute;left:0;right:0;top:960px;text-align:center}.sub span{display:inline-block;font-size:50px;font-weight:700;line-height:1;padding:14px 26px}
.lab{font-size:30px;font-weight:700;line-height:1;color:rgba(255,255,255,.8)}.val{font-size:110px;font-weight:900;line-height:1;letter-spacing:-3px;margin-top:22px}
@font-face{font-family:KBO;src:url('__ROOT__/폰트/KBO Dia Gothic_bold.ttf')}@font-face{font-family:WANT;src:url('__ROOT__/시스템/fonts/WantedSans-ExtraBlack.otf')}@font-face{font-family:DOH;src:url('__ROOT__/시스템/fonts/DoHyeon-Regular.ttf')}@font-face{font-family:GA1;src:url('__ROOT__/시스템/fonts/GothicA1-Black.ttf')}@font-face{font-family:JUA;src:url('__ROOT__/시스템/fonts/Jua-Regular.ttf')}body,body *{font-family:JUA,K!important}</style></head><body>
<div class=ab style="inset:0;background:linear-gradient(135deg,#1B2A4A,#0F1830)"></div>
<div class=ab style="left:56px;top:40px;display:flex;gap:10px;align-items:center"><span style="background:#fff;color:#1B2A4A;font-weight:900;font-size:28px;padding:8px 18px;border-radius:30px">야구자판기</span><span style="color:#fff;font-weight:700;font-size:28px">기아 · FA 공시</span></div>
<div class=ab id=ph style="left:120px;top:150px;width:520px;height:640px;border-radius:24px;overflow:hidden;border:6px solid #fff"><img src="__ROOT__/선수이미지/경기/김호령_만루포_0821_KIA제공.jpg" style="width:100%;height:100%;object-fit:cover;object-position:52% 30%;display:block"></div>
<div class=ab id=eb style="left:720px;top:150px;color:rgba(255,255,255,.85);font-size:36px;font-weight:700;line-height:1">기아 · 중견수 · 생애 첫 FA</div>
<div class=ab id=hl style="left:712px;top:344px;width:520px;height:30px;background:#E8173A;transform-origin:0 50%"></div>
<div class=ab id=nm style="left:712px;top:196px;color:#fff;font-size:170px;font-weight:900;letter-spacing:-6px;line-height:1">김호령</div>
<div class=ab id=g0 style="left:720px;top:450px"><div class=lab>리그 연봉 순위</div><div class=val style="color:#FFD84D">61위</div></div>
<svg class=ab style="left:670px;top:470px;overflow:visible" width="380" height="190" viewBox="0 0 380 190"><path id=ring d="M56 118 C 20 30, 340 8, 364 96 C 384 176, 64 196, 18 132" fill="none" stroke="#FFD84D" stroke-width="7" stroke-linecap="round"/></svg>
<svg class=ab style="left:1060px;top:520px;overflow:visible" width="220" height="80" viewBox="0 0 220 80"><path id=arw d="M10 44 C 70 20, 130 64, 196 40 M172 22 L198 40 L172 60" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class=ab id=g1 style="left:1320px;top:450px"><div class=lab>FA 등급</div><div class=val style="color:#fff">C등급</div></div>
<div class=ab id=g2 style="left:720px;top:700px;color:#fff;font-size:44px;font-weight:900;line-height:1">보상금 <span id=u2 style="background:linear-gradient(transparent 62%,rgba(255,216,77,.55) 62%);background-size:0% 100%;background-repeat:no-repeat">3억 7500만 원만 내면 돼요</span></div>
<div class=sub><span style="background:#0B1020;color:#fff;border-radius:12px">리그 연봉 순위 61위로 FA C등급이 됐어요</span></div>
<script>const c01=x=>Math.max(0,Math.min(1,x)), eo=x=>1-Math.pow(1-c01(x),3), eb=x=>{x=c01(x);const s=1.7;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const seg=(t,a,d)=>c01((t-a)/d);

const dash=(id,q)=>{const e=document.getElementById(id),L=e.getTotalLength();e.style.strokeDasharray=L;e.style.strokeDashoffset=L*(1-q)};
window.render=t=>{
 const S=(id,css)=>Object.assign(document.getElementById(id).style,css);
 const p=seg(t,0,.4); S('ph',{opacity:c01(p*2),transform:`scale(${.96+.04*eo(p)})`});
 S('eb',{opacity:c01(seg(t,.25,.25))});
 const n=seg(t,.3,.3); S('nm',{opacity:c01(n*3),transform:`translateY(${(1-eo(n))*20}px)`});
 S('hl',{transform:`scaleX(${eo(seg(t,.65,.35))})`});
 const a=seg(t,1.0,.3); S('g0',{opacity:c01(a*3),transform:`translateY(${(1-eo(a))*16}px)`});
 dash('ring',eo(seg(t,1.3,.5)));
 dash('arw',eo(seg(t,1.85,.35)));
 const b=seg(t,2.15,.3); S('g1',{opacity:c01(b*3),transform:`scale(${.9+.1*eb(b)})`,transformOrigin:'0 60%'});
 S('g2',{opacity:c01(seg(t,2.5,.25))});
 document.getElementById('u2').style.backgroundSize=`${eo(seg(t,2.7,.4))*100}% 100%`;
};window.render(0);window.__ready=true</script></body></html>
