<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* ===== 야구이슈 전용 화이트 템플릿 (template_issue.html) =====
   순위 편 template.html 과 같은 데이터 구조(window.EP)·같은 장면 이름을 쓰되, 밝은 바탕에 사진 장면이 추가된 버전.
   build.py 가 콘티 series 가 "야구이슈" 이고 이 파일이 있으면 이 템플릿을 쓴다.
   캔버스 1080x1920. 좌우 여백 90 → 콘텐츠 폭 900. 본문 400~1220 / 자막 1270~ / 하단 360px 은 유튜브 UI 영역이라 비움.
   색: 바탕 #F4F6FA, 카드 #FFFFFF, 선 #E3E7EE, 글 #12161F, 보조 #6A7382, 강조 = 주인공 팀 색(EP.focusTeam), 승 #16A34A, 패 #E5484D
   사진: EP.photos = {파일명: dataURI}. 장면의 img(파일명)로 지정. 사진이 없으면 로고로 대신 그린다(렌더가 멈추지 않게). */
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_bold.ttf') format('truetype');font-weight:700 900}
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_medium.ttf') format('truetype');font-weight:400 600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F4F6FA}
body{font-family:'KBO','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:700;-webkit-font-smoothing:antialiased;color:#12161F}
#stage{position:relative;width:1080px;height:1920px;background:#F4F6FA}
.num{font-variant-numeric:tabular-nums;letter-spacing:-2px}
/* 헤더 */
#hdr{position:absolute;left:90px;right:90px;top:236px;height:94px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #E3E7EE}
#brand{display:flex;align-items:center;gap:16px;font-size:50px;font-weight:900;letter-spacing:-1px;color:#12161F}
#brand .m{width:12px;height:44px;border-radius:6px;background:#EA0029}
#brand b{font-weight:900}
#meta{text-align:right;line-height:1.15}
#meta .t{font-size:44px;font-weight:800;letter-spacing:2px;color:#12161F}
#meta .d{font-size:38px;font-weight:600;color:#6A7382;letter-spacing:1px}
/* 본문 */
#body{position:absolute;left:90px;width:900px;top:400px;height:820px;will-change:opacity,transform;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* 자막: 밝은 바탕이라 짙은 상자에 흰 글씨 */
#sub{position:absolute;left:70px;right:70px;top:1270px;text-align:center}
#sub span{display:inline;background:rgba(18,22,31,.96);color:#FFFFFF;font-size:56px;font-weight:700;
  letter-spacing:-1px;line-height:1.7;padding:10px 20px;border-radius:16px;word-break:keep-all;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
/* 타이포 */
.mega{font-size:186px;font-weight:900;letter-spacing:-6px;line-height:1.04;color:#12161F}
.big{font-size:136px;font-weight:900;letter-spacing:-4px;line-height:1.05;color:#12161F}
.title{font-size:48px;font-weight:700;letter-spacing:-1.5px;color:#12161F}
.label{font-size:34px;font-weight:600;color:#6A7382;letter-spacing:-1px}
.gold{color:var(--acc)}.green{color:#16A34A}.red{color:#E5484D}.gray{color:#6A7382}
/* 레이아웃 */
.row{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center}
.chip{background:#fff;border:3px solid #E3E7EE;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 8px 24px rgba(18,22,31,.08)}
.chip img{width:84%;height:84%;object-fit:contain;display:block}
/* 카드(흰 바탕이라 테두리+그림자로 구분) */
.card{width:430px;height:520px;background:#FFFFFF;border:3px solid #E3E7EE;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;box-shadow:0 14px 40px rgba(18,22,31,.08)}
.card .v{font-size:118px;font-weight:900;letter-spacing:-4px;line-height:1.05;white-space:nowrap;color:#12161F}
.card .v.two{font-size:96px}
.card .l{font-size:36px;font-weight:600;color:#6A7382;letter-spacing:-1px}
.pane{background:#FFFFFF;border:3px solid #E3E7EE;box-shadow:0 14px 40px rgba(18,22,31,.08)}
.sk{width:900px;height:170px;border-radius:32px;display:flex;align-items:center;padding:0 40px;gap:26px}
.sk .nm{font-size:50px;font-weight:800;letter-spacing:-1.5px;width:150px;text-align:left}
.sk .dots{display:flex;gap:11px;flex:1;justify-content:center}
.sk .dot{width:34px;height:34px;border-radius:17px;background:#E3E7EE}
.sk .st{font-size:50px;font-weight:900;letter-spacing:-1.5px;width:170px;text-align:right}
/* 사진 틀 */
.photo{position:relative;width:900px;border-radius:36px;overflow:hidden;background:#E9EDF3;border:3px solid #E3E7EE;box-shadow:0 18px 50px rgba(18,22,31,.14);flex:0 0 auto}
.photo img,.pp img{width:100%;height:100%;object-fit:cover;display:block}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 30px;background:linear-gradient(180deg,rgba(18,22,31,0),rgba(18,22,31,.72));color:#fff;font-size:34px;font-weight:700;text-align:left;letter-spacing:-1px}
.photo .tag{position:absolute;left:26px;top:26px;background:rgba(255,255,255,.92);color:#12161F;font-size:32px;font-weight:800;padding:10px 22px;border-radius:999px;letter-spacing:-1px}
/* 9/20 롱폼 챕터 쇼츠용(세로): 스탯 칩·명단 판·배지 — template_long 과 같은 이름 */
.st{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.st>div{background:#fff;border:3px solid #E3E7EE;border-radius:24px;padding:16px 26px;min-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 12px 30px rgba(18,22,31,.08)}
.st>div b{font-size:66px;font-weight:900;letter-spacing:-2.5px;line-height:1.05;white-space:nowrap}
.st>div i{font-style:normal;font-size:30px;font-weight:700;color:#6A7382;letter-spacing:-1px;white-space:nowrap}
.st.n4>div{padding:12px 16px;min-width:110px}.st.n4>div b{font-size:46px}.st.n4>div i{font-size:25px}
.st.n5>div{padding:10px 14px;min-width:104px}.st.n5>div b{font-size:42px}.st.n5>div i{font-size:23px}
.badge{display:inline-flex;align-items:center;gap:10px;color:#fff;font-size:32px;font-weight:800;padding:8px 22px;border-radius:999px;letter-spacing:-1px}
.rst{display:flex;gap:24px;width:100%;align-items:stretch}
.rst .p{flex:1;min-width:0;background:#fff;border:3px solid #E3E7EE;border-radius:28px;padding:20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 30px rgba(18,22,31,.08)}
.rst .hh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #E3E7EE;padding-bottom:10px;flex-wrap:wrap}
.rst .hh b{font-size:46px;font-weight:900;letter-spacing:-2px;white-space:nowrap}
.rst .hh span{font-size:26px;font-weight:800;color:#fff;background:#12161F;padding:5px 14px;border-radius:999px;letter-spacing:-1px;white-space:nowrap}
.rst .g{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.rst .g i{font-style:normal;font-size:26px;font-weight:700;color:#6A7382;letter-spacing:-1px}
.rst .g u{text-decoration:none;font-size:37px;font-weight:800;letter-spacing:-1.2px;line-height:1.3;word-break:keep-all}
/* 순위표 */
#table{width:900px}
#table .hd{display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:2px solid #12161F;font-size:24px;font-weight:700;color:#6A7382;letter-spacing:1px}
.tr{display:flex;align-items:center;gap:16px;height:76px;border-bottom:1px solid #E3E7EE}
.tr .rk{width:52px;font-size:34px;font-weight:800;text-align:center}
.tr .tm{width:190px;display:flex;align-items:center;gap:14px}
.tr .nm{font-size:38px;font-weight:800;letter-spacing:-1.5px;white-space:nowrap}
.tr .bw{flex:1;height:30px;position:relative}
.tr .bar{position:absolute;left:0;top:0;height:30px;border-radius:0 15px 15px 0}
.tr .gp{width:100px;font-size:32px;font-weight:600;text-align:right;color:#6A7382}
.tr .wr{width:120px;font-size:38px;font-weight:800;text-align:right;letter-spacing:-1.5px}
/* 9/22 구독 유도: 마지막 자막("채널 구독하고…")이 뜨는 동안 유튜브 쇼츠 '구독' 버튼(아이폰·안드로이드 모두 화면 왼쪽 아래, 채널 이름 오른쪽, 세로 79~80% 지점) 바로 위를 화살표로 가리킨다. 자막(1270~1420)과 유튜브 UI 띠(1490~)를 안 가리는 1400~1485 사이에만 그린다 */
#subhint{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;visibility:hidden}
#subhint .arrow{position:absolute;left:475px;top:1430px;width:96px;height:116px;transform-origin:50% 100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
</style></head><body>
<div id="stage">
  <div id="hdr">
    <div id="brand"><div class="m" id="brandBar"></div><div>야구<b>자판기</b></div></div>
    <div id="meta"><div class="t" id="railTitle">KBO 이슈</div><div class="d num" id="railDate"></div></div>
  </div>
  <div id="body"></div>
  <div id="sub"><span></span></div>
  <div id="subhint"><svg class="arrow" viewBox="0 0 110 132"><defs><linearGradient id="shg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EE7F9"/><stop offset="1" stop-color="#3B6BFF"/></linearGradient></defs><path d="M55 124 L8 70 L36 70 L36 20 Q36 8 55 8 Q74 8 74 20 L74 70 L102 70 Z" fill="url(#shg)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/></svg></div>
</div>

<script>
/* ==== 데이터: build.py 가 window.EP 를 주입한다 ==== */
const EP = window.EP || {};
const D = (EP.standings || []).map(t => ({
  rk: t.rank, nm: t.team, code: t.code, wr: t.winRate, gb: Number(t.gameBehind).toFixed(1),
  g: t.games, st: t.streak, win: t.win, lose: t.lose, draw: t.draw }));
const LOGO = EP.logos || {}, PHOTO = EP.photos || {};
const TEAMCOL = { SS: '#074CA1', KT: '#4A4A4A', LG: '#C30452', HT: '#EA0029', OB: '#2B2A5E', NC: '#315288', LT: '#1E3A6B', SK: '#CE0E2D', HH: '#FC4E00', WO: '#820024' };
const ALIAS = { '기아': 'HT', 'KIA': 'HT', '엘지': 'LG', '케이티': 'KT', '엔씨': 'NC', '에스에스지': 'SK', 'SSG': 'SK', '두산': 'OB', '삼성': 'SS', '롯데': 'LT', '한화': 'HH', '키움': 'WO' };
const T = n => D.find(t => t.nm === n || t.code === n || t.code === ALIAS[n]) || { nm: n, code: ALIAS[n] || n };
/* 강조색 = 주인공 팀 색 (KT 회색은 화면에서 죽어서 파란색으로) */
let ACC = TEAMCOL[(T(EP.focusTeam || '') || {}).code] || '#1E5EFF'; if (ACC === '#4A4A4A') ACC = '#1E5EFF';
document.documentElement.style.setProperty('--acc', ACC);
document.getElementById('brandBar').style.background = ACC;
const GREEN = '#16A34A', RED = '#E5484D', GRAY = '#6A7382', LINE = '#E3E7EE', TXT = '#12161F';
document.getElementById('railDate').textContent = EP.dateLabel || '';
if (EP.railTitle) document.getElementById('railTitle').textContent = EP.railTitle;
const WRS = D.map(t => t.wr);
const LO = Math.min(...WRS, .4) - .03, HI = Math.max(...WRS, .6) + .02, BM = 330;

const c01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const eo = t => 1 - Math.pow(1 - c01(t), 3);
const eb = t => { t = c01(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const seg = (lt, a, d) => c01((lt - a) / d);
const fmt = w => w.toFixed(3).replace(/^0/, '');
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const br = s => esc(s).split('\n').join('<br>');
const SZ = { L: [300, 64], M: [190, 42], S: [62, 14] };
function chip(t, size = 'M', extra = '') {
  const [s, r] = SZ[size];
  return `<div class="chip" style="width:${s}px;height:${s}px;border-radius:${r}px;${extra}"><img src="${LOGO[t.code] || ''}"></div>`;
}
function trig(x, y, rot, bars) {
  const W = 15, H = 2.4, G = 2.0, half = (W - 2.0) / 2;
  let o = '';
  bars.forEach((b, i) => {
    const yy = -(H * 3 + G * 2) / 2 + i * (H + G);
    o += b ? `<rect x="${-W / 2}" y="${yy}" width="${W}" height="${H}"/>`
           : `<rect x="${-W / 2}" y="${yy}" width="${half}" height="${H}"/><rect x="${W / 2 - half}" y="${yy}" width="${half}" height="${H}"/>`;
  });
  return `<g transform="translate(${x},${y}) rotate(${rot})" fill="#12161F">${o}</g>`;
}
const FLAG = {
  '한국': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#fff"/>
    <g transform="translate(45,30) rotate(-33.69)">
      <circle r="12" fill="#CD2E3A"/>
      <path d="M-12,0 A6,6 0 0,1 0,0 A6,6 0 0,0 12,0 A12,12 0 0,1 -12,0 Z" fill="#0047A0"/>
    </g>
    ${trig(18, 12, -56.3, [1, 1, 1])}${trig(72, 12, 56.3, [0, 1, 0])}${trig(18, 48, 56.3, [1, 0, 1])}${trig(72, 48, -56.3, [0, 0, 0])}</svg>`,
  '대만': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#FE0000"/><rect width="45" height="30" fill="#000095"/>
    <g transform="translate(22.5,15)"><g fill="#fff">${Array.from({length:12},(_,i)=>`<rect x="-1.5" y="-11.5" width="3" height="11.5" transform="rotate(${i*30})"/>`).join('')}</g>
    <circle r="6.4" fill="#000095"/><circle r="5.4" fill="#fff"/></g></svg>`,
  '일본': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#fff"/><circle cx="45" cy="30" r="18" fill="#BC002D"/></svg>`,
  '태국': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#A51931"/><rect y="10" width="90" height="40" fill="#F4F5F8"/><rect y="20" width="90" height="20" fill="#2D2A4A"/></svg>`,
  '홍콩': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#DE2910"/>
    <g transform="translate(45,30)">${Array.from({length:5},(_,i)=>`<path d="M0,0 C-7,-6 -7,-17 0,-19 C7,-17 7,-6 0,0 Z" fill="#fff" transform="rotate(${i*72})"/>`).join('')}<circle r="2.2" fill="#DE2910"/></g></svg>`,
  /* 9/22: A조 세 나라 */
  '중국': () => { const st = (x, y, r, rot) => `<polygon points="${Array.from({length:10},(_,i)=>{const a=-Math.PI/2+i*Math.PI/5+rot, rr=i%2?r*.382:r; return (x+rr*Math.cos(a)).toFixed(2)+','+(y+rr*Math.sin(a)).toFixed(2);}).join(' ')}" fill="#FFDE00"/>`;
    return `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"><rect width="90" height="60" fill="#DE2910"/>${st(15,15,9,0)}${st(30,6,3,.6)}${st(36,12,3,.3)}${st(36,21,3,0)}${st(30,27,3,.6)}</svg>`; },
  '필리핀': () => { const st = (x, y, r) => `<polygon points="${Array.from({length:10},(_,i)=>{const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.382:r; return (x+rr*Math.cos(a)).toFixed(2)+','+(y+rr*Math.sin(a)).toFixed(2);}).join(' ')}" fill="#FCD116"/>`;
    return `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"><rect width="90" height="30" fill="#0038A8"/><rect y="30" width="90" height="30" fill="#CE1126"/><polygon points="0,0 52,30 0,60" fill="#fff"/>
    <g transform="translate(17,30)"><circle r="6" fill="#FCD116"/>${Array.from({length:8},(_,i)=>`<rect x="-1" y="-11" width="2" height="5" fill="#FCD116" transform="rotate(${i*45})"/>`).join('')}</g>${st(6,6,3.2)}${st(6,54,3.2)}${st(41,30,3.2)}</svg>`; },
  '팔레스타인': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="20" fill="#000"/><rect y="20" width="90" height="20" fill="#fff"/><rect y="40" width="90" height="20" fill="#009736"/><polygon points="0,0 30,30 0,60" fill="#EE2A35"/></svg>`,
};
function sideChip(name, size = 'M') {
  const n = String(name || '').trim();
  const [w, r] = SZ[size];
  if (FLAG[n]) return `<div class="chip" style="width:${Math.round(w * 1.18)}px;height:${Math.round(w * .79)}px;border-radius:${Math.round(r * .5)}px;padding:0;overflow:hidden">${FLAG[n]()}</div>`;
  const t = T(n);
  if (t && LOGO[t.code]) return chip(t, size);   // T() 는 못 찾아도 빈 객체를 돌려주니 로고 파일 유무로 판단한다
  return `<div class="chip" style="width:${w}px;height:${w}px;border-radius:${r}px;font-size:${Math.round(w * .30)}px;font-weight:900;letter-spacing:-3px;color:${TXT}">${esc(n)}</div>`;
}

const EMOJI = "font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji','KBO',sans-serif";
function chipM(t, size = 'M', mark = '', p = 1, extra = '') {
  if (!mark) return chip(t, size, extra);
  const isText = !/\p{Extended_Pictographic}/u.test(mark);
  const fs = (size === 'L' ? 104 : 80) * (isText ? 1.1 : 1);
  const style = isText ? `font-family:'KBO';font-weight:900;color:${TXT};text-shadow:0 4px 18px rgba(255,255,255,.9)` : EMOJI + ';filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))';
  return `<div style="position:relative;display:inline-block;flex:0 0 auto">${chip(t, size, extra)}
    <div style="position:absolute;right:-${fs * .45}px;top:-${fs * .35}px;font-size:${fs}px;line-height:1;${style};opacity:${c01(p * 1.5)};transform:scale(${0.4 + 0.6 * eb(p)}) rotate(${(1 - eb(p)) * -25 + 8}deg)">${esc(mark)}</div></div>`;
}
const markOf = (s, n, i) => (s.marks && (s.marks[n] || s.marks[i] || s.marks[String(i)])) || '';
const nextOf = (s, n, i) => (s.next && (typeof s.next === 'string' ? (i === 0 ? s.next : '') : (s.next[n] || s.next[i] || s.next[String(i)]))) || '';
function withNext(chipHtml, opp, p = 1, note = '') {
  if (!opp) return chipHtml;
  const o = T(opp);
  return `<div class="col" style="gap:14px">${chipHtml}
    <div class="row" style="gap:10px;${rise(p, 24)}"><span class="label" style="font-size:30px">vs</span>${chip(o, 'S')}<span class="label" style="font-size:32px;color:${TXT}">${esc(o.nm)}</span>${note ? `<span class="label" style="font-size:28px">${esc(note)}</span>` : ''}</div></div>`;
}
function B(h) {
  const body = document.getElementById('body'); body.innerHTML = h;
  // 카드 안 큰 숫자·글자(.card .v)도 카드 폭(430)을 넘으면 줄인다(9/16 — "익숙하다" 가 카드 밖으로 나감)
  [...body.querySelectorAll('.card .v')].forEach(el => { el.style.whiteSpace = 'pre'; let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > 380 && fs > 44) { fs -= 4; el.style.fontSize = fs + 'px'; } });
  const els = [...body.querySelectorAll('.mega,.big')];
  els.forEach(el => { el.style.whiteSpace = 'nowrap'; let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > 900 && fs > 56) { fs -= 4; el.style.fontSize = fs + 'px'; } });
  const used = () => [...body.children].reduce((a, c) => a + c.offsetHeight + (parseFloat(getComputedStyle(c).marginTop) || 0) + (parseFloat(getComputedStyle(c).marginBottom) || 0), 0);
  for (let k = 0; k < 30 && els.length && used() > 820; k++)
    els.forEach(el => { const fs = parseFloat(getComputedStyle(el).fontSize); if (fs > 56) el.style.fontSize = (fs - 4) + 'px'; });
}
const pop = p => `opacity:${c01(p * 1.4)};transform:scale(${0.82 + 0.18 * eo(p)})`;   /* 9/20: 튕김(eb) → ease-out */
const rise = (p, px = 60) => `opacity:${c01(p * 1.4)};transform:translateY(${(1 - eo(p)) * px}px)`;
const slideX = (p, px) => `opacity:${c01(p * 1.4)};transform:translateX(${(1 - eo(p)) * px}px)`;
const cnt = (p, v, dec = 0) => (v * eo(p)).toFixed(dec);
const stColor = st => /승/.test(st) ? GREEN : /패/.test(st) ? RED : GRAY;
const stN = st => parseInt(st) || 0;
const stLabel = st => /^\d+(승|패)$/.test(st) && parseInt(st) >= 2 ? st.replace(/(승|패)$/, '연$1') : st;
const winLose = (w, l) => `${w}승<br>${l}패`;

/* ---- 사진 ---- 파일명(확장자 있어도 없어도)으로 찾는다 */
function photoSrc(name) {
  if (!name) return '';
  if (PHOTO[name]) return PHOTO[name];
  const base = String(name).replace(/\.[a-z0-9]+$/i, '');
  const k = Object.keys(PHOTO).find(x => x === base || x.replace(/\.[a-z0-9]+$/i, '') === base);
  return k ? PHOTO[k] : '';
}
/* 사진 틀: 사진이 있으면 사진, 없으면 팀 로고가 든 연한 상자(렌더가 멈추지 않게). h=높이, focus=object-position(top/center) */
const PSIZE = EP.photoSizes || {};
function photoSize(name) {
  if (!name) return null;
  const base = String(name).replace(/\.[a-z0-9]+$/i, '');
  const k = Object.keys(PSIZE).find(x => x === name || x === base || x.replace(/\.[a-z0-9]+$/i, '') === base);
  return k ? PSIZE[k] : null;
}
/* 사진을 틀(w×h)에 어떻게 넣을지 — 얼굴이 잘리지 않게:
   · 잘라 채우기(cover)는 사진이 틀보다 크고(1.15배 넘게 늘릴 필요 없음) 비율도 비슷할 때만. 자를 땐 위쪽(얼굴) 기준.
   · 그 외(작은 사진, 세로 사진을 가로 틀에, 투명 배경 png)는 늘리지 않고 통째로 보이게(contain) 놓고,
     뒤는 같은 사진을 흐리게 깔거나(투명 png 는 단색) 채운다.  s.fit = 'cover' | 'contain' 으로 강제 가능 */
function photoImg(s, src, w, h, focus) {
  const sz = photoSize(s.img), alpha = sz && sz[2];
  let fit = s.fit;
  if (!fit) {
    if (!sz) fit = 'cover';
    else {
      const coverScale = Math.max(w / sz[0], h / sz[1]), ratio = (sz[0] / sz[1]) / (w / h);
      fit = (!alpha && coverScale <= 1.15 && ratio > 0.72 && ratio < 1.4) ? 'cover' : 'contain';
    }
  }
  if (fit === 'cover') return `<img src="${src}" style="object-position:${esc(s.focus || focus || '50% 12%')}">`;
  const scale = sz ? Math.min(1.25, w / sz[0], h / sz[1]) : 1, iw = sz ? Math.round(sz[0] * scale) : 'auto', ih = sz ? Math.round(sz[1] * scale) : 'auto';
  const back = alpha
    ? `<div style="position:absolute;inset:0;background:linear-gradient(160deg,#F7F8FB,#E4E9F1)"></div>`
    : `<img src="${src}" style="position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) saturate(1.1);opacity:.85"><div style="position:absolute;inset:0;background:rgba(18,22,31,.12)"></div>`;
  return `${back}<img src="${src}" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:${iw}${sz ? 'px' : ''};height:${ih}${sz ? 'px' : ''};object-fit:contain;${alpha ? '' : 'border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.35)'}">`;
}
function photoBox(s, h = 560, p = 1, extra = '') {
  const src = photoSrc(s.img), team = s.team || (s.teams || [])[0];
  const sz = photoSize(s.img);
  let w = 900;   /* 9/20: 세로 사진이면 틀 폭을 사진 비율로 좁혀 양옆 흐린 여백을 없앤다 */
  if (src && sz && sz[1] > sz[0] * 1.05) { w = Math.max(360, Math.min(900, Math.round(h * sz[0] / sz[1]) + 12)); extra += `width:${w}px;`; if (!s.fit) s = Object.assign({}, s, { fit: 'cover' }); }
  const inner = src
    ? photoImg(s, src, w, h)
    : FLAG[String(team || '').trim()]
      ? `<div class="col" style="width:100%;height:100%;background:linear-gradient(160deg,#EEF1F6,#DDE3EC)"><div style="width:${Math.round(h * 1.05)}px;height:${Math.round(h * .7)}px;border-radius:24px;overflow:hidden;box-shadow:0 18px 48px rgba(18,22,31,.14);border:3px solid #E3E7EE">${FLAG[String(team).trim()]()}</div></div>`   /* 9/20: 나라면 국기 */
      : `<div class="col" style="width:100%;height:100%;background:linear-gradient(160deg,#EEF1F6,#DDE3EC)">${team ? chip(T(team), 'L') : ''}</div>`;
  const tag = s.tag ? `<div class="tag">${esc(s.tag)}</div>` : '';
  const cap = s.caption ? `<div class="cap">${br(s.caption)}</div>` : '';
  return `<div class="photo" style="height:${h}px;${s._keep ? '' : rise(p, 40)};${extra}">${inner}${tag}${cap}</div>`;
}

const SCENE = {};

/* hook: (사진 있으면 사진 위) 로고 + 큰 문구 */
SCENE.hook = (lt, s) => {
  const pulse = 1 + 0.02 * Math.sin(lt * 4), p = seg(lt, .35, .7);
  const teams = s.teams || (s.team ? [s.team] : []);
  if (s.img) {
    B(`${photoBox(s, 560, seg(lt, 0, .6))}<div class="mega gold" style="margin-top:40px;font-size:${s.size || 150}px;opacity:${c01(p * 1.4)};transform:scale(${(0.6 + 0.4 * eb(p)) * (lt > 1.1 ? pulse : 1)})">${br(s.text)}</div>`);
    return;
  }
  const logos = teams.length ? `<div class="row" style="gap:${teams.length > 1 ? 56 : 40}px;align-items:flex-start;${pop(seg(lt, 0, .55))}">${teams.map((n, i) => withNext(chipM(T(n), teams.length > 1 ? 'M' : 'L', markOf(s, n, i), seg(lt, .7, .4)), nextOf(s, n, i), seg(lt, .8, .4))).join('')}</div>` : '';
  B(`${logos}<div class="mega gold" style="margin-top:${teams.length ? 44 : 0}px;font-size:${s.size || 168}px;opacity:${c01(p * 1.4)};transform:scale(${(0.6 + 0.4 * eb(p)) * (lt > 1.1 ? pulse : 1)})">${br(s.text)}</div>`);
};

function numBadge(lt, num, label) {
  if (!num) return '';
  // 글자를 붙이거나(numLabel) 숫자가 세 자리 이상이면 동그라미 대신 알약 배지 — 104px 원에 세 자리를 넣으면 숫자가 삐져나온다(9/17)
  const wide = label || String(num).length >= 3;
  if (wide) return `<div class="row" style="margin:30px 0;${pop(seg(lt, .1, .5))}"><div class="num" style="height:96px;padding:0 40px;border-radius:20px;background:${ACC};color:#fff;font-size:56px;font-weight:900;letter-spacing:-1px;display:flex;align-items:center;justify-content:center;gap:16px">${label ? `<span style="font-size:46px;font-weight:800;opacity:.9">${esc(label)}</span>` : ''}<span>${num}</span></div></div>`;
  return `<div class="row" style="margin:30px 0;${pop(seg(lt, .1, .5))}"><div class="num" style="width:104px;height:104px;border-radius:50%;background:${ACC};color:#fff;font-size:66px;font-weight:900;letter-spacing:0;display:flex;align-items:center;justify-content:center">${num}</div></div>`;
}

/* big: 큰 문구 하나 (로고 또는 사진 선택) */
SCENE.big = (lt, s) => {
  let text = s.text || '', num = s.num || '';
  const m = text.match(/^\s*(?:([①②③④⑤])|([1-5])[.)]|(첫째|둘째|셋째|넷째|다섯째))\s*/);
  if (!num && m) { num = m[1] ? '①②③④⑤'.indexOf(m[1]) + 1 : m[2] ? m[2] : ['첫째', '둘째', '셋째', '넷째', '다섯째'].indexOf(m[3]) + 1; text = text.slice(m[0].length); }
  const badge = numBadge(lt, num, s.numLabel);
  const extra = noteLine(lt, s.note, .35) + statRow(lt, s.stats, .35, s.showFrom);   /* 9/20: 롱폼 콘티의 note·stats */
  if (s.img || FLAG[String(s.team || '').trim()]) {
    const ph = extra ? ((s.stats && s.stats.length) && s.note ? 340 : 420) : (num ? 460 : 560);
    B(`${badge}${photoBox(s, ph, seg(lt, 0, .6))}<div class="mega gold" style="margin-top:32px;font-size:${s.size || 140}px;${s._keep ? pop(seg(lt, .05, .5)) : pop(seg(lt, .2, .6))}">${br(text)}</div>${extra}`);
    return;
  }
  B(`${s.team ? `<div style="${pop(seg(lt, 0, .5))}">${chipM(T(s.team), num ? 'M' : 'L', s.mark || markOf(s, s.team, 0), seg(lt, .8, .4))}</div>` : ''}${badge}
  <div class="mega ${s.gold === false ? '' : 'gold'}" style="margin-top:${s.team && !num ? 44 : 0}px;font-size:${s.size || 168}px;${pop(seg(lt, .25, .6))}">${br(text)}</div>${extra}`);
};

/* 9/20 롱폼 챕터 쇼츠용: 스탯 칩 줄 · 보조 문구 (template_long 과 같은 콘티 키) */
function statRow(lt, sts, t0, from) {

}
function noteLine(lt, n, t0) {

/* profile: 사진 + 이름 + 소속 배지 + 강조 문구 + 스탯 칩 (세로) */
SCENE.profile = (lt, s) => {
  const K = s._keep, sts = s.stats || [], f = s.showFrom || 0, nn = s._nmax || sts.length;

    <div class="row" style="gap:18px;margin-top:26px;${K ? '' : rise(seg(lt, .08, .45), 22)}"><div class="big" style="font-size:${s.size || 92}px">${br(s.name || '')}</div>${s.sub ? `<div class="badge" style="background:${ACC}">${esc(s.sub)}</div>` : ''}</div>
    ${s.text ? `<div class="big gold" style="margin-top:14px;font-size:${s.textSize || 78}px;white-space:${/\n/.test(s.text) ? 'normal' : 'nowrap'};${same ? '' : pop(seg(lt, K ? .08 : .2, .5))}">${br(s.text)}</div>` : ''}

/* roster: 두 판 나란히 (세로라 폭 438씩) */
function rosterPane(x, p) {

/* photo: 사진이 주인공인 장면. {img, team, text, caption, tag, focus, size} — 사진 크게(640) + 아래 큰 문구 */

/* people: 인물 카드 1~3장. {title, items:[{img, name, team, note, bad:true|false}], text}
   사진(없으면 로고) + 이름 + 상태 한 줄. bad 면 상태 글자가 빨강, 아니면 초록 */
SCENE.people = (lt, s) => {

/* matchup: 두 팀 로고 + vs + 큰 문구 (img 있으면 위에 사진) */

/* table: 순위표 */

function dots(n, color, lt, start) {

SCENE.streaks = (lt, s) => {

  let h = '<div class="col" style="gap:34px">';

    const n = Math.min(stN(it.st), 10), col = stColor(it.st), t0 = i * 1.0;
    h += `<div class="sk pane" style="${slideX(seg(lt, i * .25, .5), i % 2 ? 120 : -120)}">${chip(it.t, 'S')}<div class="nm">${esc(it.t.nm)}</div>
      ${dots(n, col, lt, .5 + t0)}<div class="st" style="color:${col};opacity:${seg(lt, .5 + t0 + n * .12 + .1, .3)}">${esc(stLabel(it.st))}</div></div>`;
  });
  B(h + '</div>');
};

/* 스탯 카드 두 장 (left/right: {team|name|img, value|win/lose, label}) — img 있으면 사진이 머리 부분 */
function cards(lt, L, R) {
  const side = (x, i, p) => {
    const v = x.value != null ? br(x.value) : winLose(cnt(p, x.win), cnt(p, x.lose));
    const two = x.value == null || String(x.value).includes('\n');
    const src = photoSrc(x.img);
    const head = src ? `<div style="width:380px;height:220px;border-radius:26px;overflow:hidden;position:relative;background:#E9EDF3"><div class="pp" style="position:absolute;inset:0">${photoImg(x, src, 380, 220, x.focus || '50% 10%')}</div>${x.team ? `<div style="position:absolute;left:12px;top:12px">${chip(T(x.team), 'S')}</div>` : ''}</div>`
      : FLAG[String(x.team || '').trim()] ? `<div style="height:190px;display:flex;align-items:center">${sideChip(x.team, 'M')}</div>`   /* 9/20: 나라 국기 */
      : x.team ? withNext(chipM(T(x.team), 'M', x.mark || '', seg(lt, .9 + i * .3, .4)), x.next || '', seg(lt, 1.0 + i * .3, .4), x.nextNote || '')
      : `<div class="title" style="font-size:60px;font-weight:900;height:190px;display:flex;align-items:center">${br(x.name || '')}</div>`;
    return `<div class="card" style="${x.next || src ? 'height:600px;' : ''}${rise(seg(lt, i * .35, .5), 50)}">${head}
      <div class="v num ${two ? 'two' : ''} ${i === 0 ? 'gold' : ''}" style="${i ? 'color:' + GRAY : ''}">${v}</div>
      ${x.label ? `<div class="l">${br(x.label)}</div>` : ''}</div>`;
  };
  return `<div class="row" style="gap:40px">${side(L, 0, seg(lt, .3, .9))}${side(R, 1, seg(lt, .65, .9))}</div>`;
}
SCENE.versus = (lt, s) => B(numBadge(lt, s.num, s.numLabel) + cards(lt, s.left, s.right));
SCENE.need = (lt, s) => B(numBadge(lt, s.num, s.numLabel) + cards(lt, s.left, s.right));

SCENE.wins = (lt, s) => {
  const rows = s.rows || [];
  let h = '<div class="col" style="gap:30px;width:900px">';
  rows.forEach((r, i) => {
    const t = T(r.team), total = Number(r.total) || 0, need = Math.min(Number(r.need) || 0, total), t0 = .35 + i * 1.1;
    const cw = Math.min(40, Math.floor((900 - 80 - (total - 1) * 8) / Math.max(total, 1)));
    let cells = '';
    for (let k = 0; k < total; k++) {
      const on = k < need, p = seg(lt, t0 + .2 + k * .045, .25);
      cells += `<div style="width:${cw}px;height:${cw + 10}px;border-radius:8px;background:${on ? GREEN : LINE};${on ? `opacity:${.3 + .7 * c01(p)};transform:scale(${.7 + .3 * eb(p)})` : 'opacity:.9'}"></div>`;
    }
    const done = seg(lt, t0 + .2 + need * .045 + .1, .35);
    h += `<div class="pane" style="width:900px;border-radius:32px;padding:30px 40px;${slideX(seg(lt, i * .3, .5), i % 2 ? 120 : -120)}">
      <div class="row" style="justify-content:space-between;margin-bottom:22px">
        <div class="row" style="gap:18px">${chip(t, 'S')}<div class="title" style="font-size:46px;font-weight:800">${esc(t.nm)}</div></div>
        <div class="label num" style="font-size:38px;color:${TXT}">남은 <b class="gold">${total}</b>경기</div></div>
      <div class="row" style="gap:8px;justify-content:flex-start;flex-wrap:nowrap">${cells}</div>
      <div class="row" style="justify-content:space-between;margin-top:22px;opacity:${done}">
        <div class="big num" style="font-size:84px;color:${GREEN}">${need}승</div>
        <div class="label" style="font-size:40px;color:${TXT}">${br(r.label || '')}</div></div></div>`;
  });
  h += '</div>';
  if (s.text) h += `<div class="big gold" style="margin-top:34px;font-size:${s.size || 96}px;${pop(seg(lt, .4 + rows.length * 1.1, .5))}">${br(s.text)}</div>`;
  B(h);
};

/* schedule: 날짜(또는 이름)별 목록. items[].img 가 있으면 왼쪽에 작은 사진 */
SCENE.schedule = (lt, s) => {
  const items = s.items || [];
  let h = s.title ? `<div class="title gold" style="font-size:56px;font-weight:900;margin-bottom:26px;${pop(seg(lt, 0, .4))}">${br(s.title)}</div>` : '';
  h += '<div class="col" style="gap:16px;width:900px">';
  items.forEach((it, i) => {
    const p = seg(lt, .3 + i * .22, .4), ts = it.teams || [], src = photoSrc(it.img);
    const pic = src ? `<img src="${src}" style="width:84px;height:84px;border-radius:20px;object-fit:cover;object-position:top;flex:0 0 auto">` : '';
    h += `<div class="row pane" style="width:900px;height:${src ? 120 : 104}px;border-radius:26px;padding:0 30px;justify-content:space-between;${slideX(p, 90)}">
      <div class="row" style="gap:18px;width:${src ? 330 : 250}px;justify-content:flex-start">${pic}<div class="num" style="font-size:44px;font-weight:800;text-align:left;${it.tbd ? 'color:' + GRAY : ''}">${esc(it.date || '')}</div></div>
      <div class="row" style="gap:16px">${ts.map(n => chip(T(n), 'S')).join('<span class="label" style="font-size:30px">vs</span>')}</div>
      <div class="label" style="font-size:36px;width:250px;text-align:right;color:${it.tbd ? GRAY : it.bad === true ? RED : it.bad === false ? GREEN : TXT}">${esc(it.place || '')}</div></div>`;
  });
  h += '</div>';
  if (s.text) h += `<div class="big gold" style="margin-top:34px;font-size:${s.size || 96}px;${pop(seg(lt, .5 + items.length * .22, .5))}">${br(s.text)}</div>`;
  B(h);
};

SCENE.shift = (lt, s) => {
  const d = seg(lt, .9, 1.0), dec = s.dec == null ? 3 : s.dec, f = Number(s.from), to = Number(s.to);
  const z = x => dec >= 3 ? x.replace(/^0\./, '.') : x; const v = z((f - (f - to) * eo(d)).toFixed(dec)), fs = z(Number(s.from).toFixed(dec));
  B(`<div style="${pop(seg(lt, 0, .5))}">${chip(T(s.team), 'L')}</div>
  <div class="row" style="margin-top:44px;gap:40px">
    <div class="col" style="${rise(seg(lt, .3, .5))}"><div class="big num">${esc(fs)}</div>${s.fromLabel ? `<div class="label" style="margin-top:12px">${br(s.fromLabel)}</div>` : ''}</div>
    <div style="width:${110 * eo(seg(lt, .8, .5))}px;height:8px;background:${GRAY};border-radius:4px;position:relative">
      <div style="position:absolute;right:-6px;top:-10px;border:13px solid transparent;border-left:18px solid ${GRAY};opacity:${seg(lt, 1.1, .2)}"></div></div>
    <div class="col" style="opacity:${seg(lt, .9, .3)}"><div class="big num" style="color:${d > .98 ? ACC : TXT}">${esc(v)}</div>${s.toLabel ? `<div class="label" style="margin-top:12px">${br(s.toLabel)}</div>` : ''}</div>
  </div>`);
};

SCENE.rival = (lt, s) => {
  const up = ((lt * 1.2) % 1), down = s.dir === 'down';
  B(`<div style="${rise(seg(lt, 0, .7), 90)}">${chip(T(s.team), 'L')}</div>
  <div class="mega" style="font-size:130px;margin-top:40px;${pop(seg(lt, .5, .6))}">${br(s.text || '')}</div>
  <div style="margin-top:20px;font-size:70px;color:${down ? RED : ACC};opacity:${(1 - up) * seg(lt, 1, .4)};transform:translateY(${(down ? 1 : -1) * up * 50}px)">${down ? '▼' : '▲'}</div>`);
};

/* verdict: 결론 문구 (+ 사진 또는 두 팀 로고) */
SCENE.verdict = (lt, s) => {
  const drop = seg(lt, .3, .7);
  B(`${s.img ? photoBox(s, 420, seg(lt, 0, .6), 'margin-bottom:30px') : ''}${s.label ? `<div class="title gray" style="opacity:${seg(lt, 0, .4)}">${br(s.label)}</div>` : ''}
  <div class="mega gold" style="margin-top:20px;font-size:${s.size || 150}px;opacity:${c01(drop * 1.5)};transform:translateY(${(1 - eb(drop)) * -120}px)">${br(s.big || '')}</div>
  ${s.left && s.right ? `<div class="row" style="margin-top:60px;gap:36px">
    <div style="${slideX(seg(lt, 1.2, .5), -140)}">${chipM(T(s.left), 'M', markOf(s, s.left, 0), seg(lt, 1.8, .4))}</div>
    <div class="title gray" style="opacity:${seg(lt, 1.6, .4)}">vs</div>
    <div style="${slideX(seg(lt, 1.2, .5), 140)}">${chipM(T(s.right), 'M', markOf(s, s.right, 1), seg(lt, 2.0, .4))}</div></div>` : ''}`);
};

/* teamgrid: 구단 로고 격자 + 숫자. {title, items:[{team, value, label, bad}], cols(기본 5), text}
   — "구단별 몇 명" 같은 걸 로고로 한눈에 (9/14 피드백) */
SCENE.teamgrid = (lt, s) => {
  const items = s.items || [], cols = s.cols || 5, n = items.length || 1;
  const w = cols >= 5 ? 176 : cols === 4 ? 210 : 280, gap = 18;
  let h = s.title ? `<div class="title gold" style="font-size:56px;font-weight:900;margin-bottom:28px;${pop(seg(lt, 0, .4))}">${br(s.title)}</div>` : '';
  h += `<div style="display:grid;grid-template-columns:repeat(${cols},${w}px);gap:${gap}px;justify-content:center">`;
  items.forEach((it, i) => {
    const t = T(it.team), p = seg(lt, .25 + i * .12, .45);
    const col = it.bad === true ? RED : it.bad === false ? GREEN : (i === 0 ? 'var(--acc)' : TXT);
    h += `<div class="pane col" style="width:${w}px;border-radius:28px;padding:18px 0 14px;gap:8px;${rise(p, 40)}">
      ${chip(t, 'M', `width:${cols >= 5 ? 112 : 130}px;height:${cols >= 5 ? 112 : 130}px;border-radius:26px`)}
      <div class="num" style="font-size:${cols >= 5 ? 74 : 84}px;font-weight:900;line-height:1.05;color:${col}">${br(it.value == null ? '' : String(it.value))}</div>
      ${it.label ? `<div class="label" style="font-size:26px;color:${GRAY}">${esc(it.label)}</div>` : ''}</div>`;
  });
  h += '</div>';
  if (s.text) h += `<div class="big gold" style="margin-top:34px;font-size:${s.size || 96}px;${pop(seg(lt, .4 + n * .12, .5))}">${br(s.text)}</div>`;
  B(h);
};

/* steps: 날짜 카드가 왼쪽→오른쪽으로 이어지는 일정. {title, items:[{date, text, sub, hi}], text}
   — "15~16 훈련 / 17 연습경기 / 18 출국 / 21 대만전" 을 글자 나열 대신 카드로 (9/14 피드백) */
SCENE.steps = (lt, s) => {
  const items = s.items || [], n = items.length || 1;
  const w = n <= 3 ? 280 : n === 4 ? 215 : 172, gap = 16;
  let h = s.title ? `<div class="title gold" style="font-size:56px;font-weight:900;margin-bottom:30px;${pop(seg(lt, 0, .4))}">${br(s.title)}</div>` : '';
  h += `<div class="row" style="gap:${gap}px;align-items:stretch">`;
  items.forEach((it, i) => {
    const p = seg(lt, .25 + i * .22, .45), hi = it.hi === true;
    h += `<div class="pane col" style="width:${w}px;border-radius:28px;padding:22px 10px 24px;gap:14px;justify-content:flex-start;${hi ? 'border-color:var(--acc);box-shadow:0 14px 40px rgba(232,120,40,.22);' : ''}${rise(p, 40)}">
      <div class="num" style="font-size:${n >= 5 ? 44 : 54}px;font-weight:900;line-height:1;color:${hi ? 'var(--acc)' : TXT}">${esc(it.date || '')}</div>
      <div style="width:60%;height:4px;border-radius:2px;background:${hi ? 'var(--acc)' : LINE}"></div>
      <div class="title" style="font-size:${n >= 5 ? 30 : 36}px;font-weight:800;line-height:1.25;text-align:center">${br(it.text || '')}</div>
      ${it.sub ? `<div class="label" style="font-size:26px;color:${GRAY};line-height:1.3;text-align:center">${br(it.sub)}</div>` : ''}</div>`;
  });
  h += '</div>';
  if (s.text) h += `<div class="big gold" style="margin-top:34px;font-size:${s.size || 96}px;${pop(seg(lt, .4 + n * .22, .5))}">${br(s.text)}</div>`;
  B(h);
};

/* cards: 이름 카드 2~4장 (9/21 드래프트 구단별 편). {title, items:[{badge, name, sub, hi}], text}
   steps 보다 크게 — 4장은 2×2, 3장 이하는 한 줄. 사진 없는 선수를 전부 같은 카드로 통일하는 용도 */
SCENE.cards = (lt, s) => {
  const items = s.items || [], n = items.length || 1;
  const grid = n >= 4, w = grid ? 470 : (n === 3 ? 330 : 440), gap = 15;
  let h = s.title ? `<div class="title gold" style="font-size:56px;font-weight:900;margin-bottom:28px;${pop(seg(lt, 0, .4))}">${br(s.title)}</div>` : '';
  h += grid ? `<div style="display:grid;grid-template-columns:repeat(2,${w}px);gap:${gap}px;justify-content:center">` : `<div class="row" style="gap:${gap}px;align-items:stretch">`;
  items.forEach((it, i) => {
    const p = seg(lt, .2 + i * .18, .45), hi = it.hi === true;
    h += `<div class="pane col" style="width:${w}px;border-radius:30px;padding:${grid ? 40 : 30}px 12px ${grid ? 44 : 32}px;gap:${grid ? 20 : 14}px;justify-content:flex-start;${hi ? 'border-color:var(--acc);box-shadow:0 14px 40px rgba(232,120,40,.22);' : ''}${rise(p, 40)}">
      <div class="num" style="height:54px;padding:0 22px;border-radius:14px;background:${hi ? 'var(--acc)' : '#12161F'};color:#fff;font-size:${grid ? 38 : 34}px;font-weight:900;display:flex;align-items:center">${esc(it.badge || '')}</div>
      <div class="title" style="font-size:${n === 3 ? 66 : 78}px;font-weight:900;line-height:1.1;text-align:center">${br(it.name || '')}</div>
      ${it.sub ? `<div class="label" style="font-size:${n === 3 ? 30 : 38}px;color:${GRAY};line-height:1.3;text-align:center">${br(it.sub)}</div>` : ''}</div>`;
  });
  h += '</div>';
  if (s.text) h += `<div class="big gold" style="margin-top:34px;font-size:${s.size || 96}px;${pop(seg(lt, .3 + n * .18, .5))}">${br(s.text)}</div>`;
  B(h);
};

/* question: 시청자 질문 (+ 사진) */
SCENE.question = (lt, s) => {
  B(`${s.img ? photoBox(s, 480, seg(lt, 0, .6), 'margin-bottom:30px') : ''}<div class="mega" style="font-size:${s.size || 120}px;${pop(seg(lt, 0, .6))}">${br(s.text || '여러분 생각은?')}</div>`);
};

const SUBS = EP.subs || [], BD = EP.bounds || [], SC = (EP.scenes || []);
function drawSub(t) {
  const h = SUBS.find(s => t >= s[0] && t < s[1]);
  const sp = document.querySelector('#sub span');
  sp.innerHTML = h ? br(h[2]) : ''; sp.style.visibility = h ? 'visible' : 'hidden';
  /* 9/23 구독 화살표: '구독' 자막이 시작되면 영상 끝까지 유지. 움직임은 t 기반 — 0.35초 스르륵 등장 + 1.6초 주기로 버튼 쪽으로 천천히 12px 다가갔다 돌아옴 */
  const hs = (SUBS.find(s => /구독/.test(s[2])) || [])[0];
  const on = hs !== undefined && t >= hs, hint = document.getElementById('subhint');
  if (hint) {
    hint.style.visibility = on ? 'visible' : 'hidden'; document.getElementById('sub').style.top = on ? '1220px' : '';
    if (on) {
      const a = hint.querySelector('.arrow'), d = t - hs, pin = Math.min(1, d / 0.35), e = 1 - Math.pow(1 - pin, 3);
      const nudge = 12 * (0.5 - 0.5 * Math.cos(2 * Math.PI * Math.max(0, d - 0.35) / 1.6));
      a.style.opacity = String(e); a.style.transform = `translateY(${-(1 - e) * 40 + nudge}px) scale(${0.85 + 0.15 * e})`;
    }
  }
  /* 9/23 저녁: 화살표는 버튼 위에서 아래로(중심 x523, 끝 y1542~1554, 사용자 '너무 올렸다 살짝만 내려줘' 반영) — 긴 화면(버튼 y≈1626)에서 간격을 두고 짧은 화면도 고려. 그동안 자막은 1220 으로 올림 */
}
const MOTION = {
  hook: () => 1.1, big: s => .9 + ((s.stats || []).length) * .12 + (s.note ? .3 : 0), profile: s => .8 + ((s.stats || []).length) * .12 + (s.text ? .3 : 0), roster: s => 1.3 + (s.text ? .5 : 0), matchup: () => 1.4, table: () => 2.3, versus: () => 1.6, need: () => 1.6,
  shift: () => 1.4, rival: () => 1.5, verdict: s => (s.left && s.right ? 2.1 : 1.0), question: () => 0.7,
  photo: () => 1.0, people: s => .25 + ((s.items || []).length) * .3 + .5 + (s.text ? .5 : 0),
  teamgrid: s => .25 + ((s.items || []).length) * .12 + .45 + (s.text ? .5 : 0), steps: s => .25 + ((s.items || []).length) * .22 + .45 + (s.text ? .5 : 0), cards: s => .2 + ((s.items || []).length) * .18 + .45 + (s.text ? .5 : 0),
  wins: s => { const rows = s.rows || []; const last = rows.length ? Math.min(Number(rows[rows.length - 1].need) || 0, Number(rows[rows.length - 1].total) || 0) : 0; return .35 + (rows.length - 1) * 1.1 + .2 + last * .045 + .5 + (s.text ? .5 : 0); },
  schedule: s => .3 + ((s.items || []).length) * .22 + .5 + (s.text ? .5 : 0),
  streaks: s => { const ts = s.teams || []; const last = ts.length ? Math.min(stN(ts[ts.length - 1].streak || (T(ts[ts.length - 1].team) || {}).st || ''), 10) : 0; return .5 + (ts.length - 1) * 1.0 + last * .12 + .45; },
};
function render(t) {
  let k = 0; while (k < BD.length && t >= BD[k]) k++;
  const start = k === 0 ? 0 : BD[k - 1], end = k < BD.length ? BD[k] : (EP.total || start + 3);
  const s = SC[Math.min(k, SC.length - 1)] || { type: 'big', text: '' };
  const prev = k > 0 ? SC[k - 1] : null;   // 9/20: 같은 사진이 이어지면 사진은 그대로 두고 내용만 바뀐다(롱폼과 같은 규칙)
  s._keep = !!(prev && photoSrc(prev.img) && photoSrc(prev.img) === photoSrc(s.img)); s._prev = prev;
  if (s._nmax == null) {
    let a = k, b = k; const same = (x, y) => x && y && x.type === 'profile' && y.type === 'profile' && photoSrc(x.img) && photoSrc(x.img) === photoSrc(y.img);
    while (a > 0 && same(SC[a - 1], SC[a])) a--;
    while (b + 1 < SC.length && same(SC[b], SC[b + 1])) b++;
    let m = 0; for (let j = a; j <= b; j++) m = Math.max(m, (SC[j].stats || []).length);
    for (let j = a; j <= b; j++) SC[j]._nmax = m;
  }
  const need = (MOTION[s.type] || MOTION.big)(s), fit = Math.max(0.6, (end - start) * 0.75);
  const lt = (t - start) * (need > fit ? need / fit : 1);
  (SCENE[s.type] || SCENE.big)(lt, s);
  document.getElementById('body').style.opacity = s._keep ? '1' : String(c01((t - start) / 0.28));
  /* 바탕: 흰색에 주인공 팀 색을 아주 연하게 (위쪽에서 천천히 움직이는 빛) */
  const gx = 50 + 4 * Math.sin(t * .5), gy = 22 + 2 * Math.cos(t * .37);
  document.getElementById('stage').style.background = `radial-gradient(70% 40% at ${gx}% ${gy}%, ${ACC}22 0%, rgba(244,246,250,0) 70%),#F4F6FA`;
  drawSub(t);
}
window.render = render; render(0);
</script></body></html>
