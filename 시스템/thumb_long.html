<!doctype html>
<!-- 야구자판기 롱폼 썸네일 1280x720 (2026-09-18 다시 디자인)
     어두운 배경 + 사진 오른쪽 화면 높이 꽉 + 왼쪽 큰 글씨(마지막 줄 노랑).
     데이터: thumb.img / thumb.top / thumb.big(\n 로 줄바꿈) / thumb.tag / thumb.focus, 날짜는 콘티 date -->
<html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_bold.ttf') format('truetype');font-weight:700 900}
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_medium.ttf') format('truetype');font-weight:400 600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#0A0F1A}
body{font-family:'KBO','Malgun Gothic',sans-serif;color:#fff}
#s{position:relative;width:1280px;height:720px;overflow:hidden;background:
  radial-gradient(70% 90% at 78% 40%, rgba(234,0,41,.30) 0%, rgba(10,15,26,0) 62%),
  linear-gradient(160deg,#10182A 0%,#070B14 100%)}
/* 사진: 오른쪽에 화면 높이 꽉, 왼쪽으로 사라지게 */
#ph{position:absolute;right:-40px;top:0;width:640px;height:720px;overflow:hidden}
#ph img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;filter:saturate(1.08) contrast(1.06)}
#ph:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#070B14 0%,rgba(7,11,20,.85) 22%,rgba(7,11,20,0) 58%)}
#ph:before{content:'';position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(7,11,20,.75) 0%,rgba(7,11,20,0) 38%)}
/* 왼쪽 글 */
#L{position:absolute;left:68px;top:118px;width:720px;z-index:5}
.tag{display:inline-flex;align-items:center;gap:14px;font-size:34px;font-weight:800;letter-spacing:-1px;color:#FF5A6E;margin-bottom:18px}
.tag i{display:block;width:56px;height:8px;border-radius:4px;background:#EA0029}
.top{font-size:44px;font-weight:800;letter-spacing:-1.5px;color:#C7D2E6;margin-bottom:16px;line-height:1.2}
.big{font-size:132px;font-weight:900;letter-spacing:-6px;line-height:1.0;text-shadow:0 10px 36px rgba(0,0,0,.65)}
.big em{font-style:normal;color:#FFD400}
#date{position:absolute;left:68px;bottom:52px;z-index:6;background:#fff;color:#0A0F1A;font-size:32px;font-weight:900;letter-spacing:-1px;padding:12px 26px;border-radius:999px}
#brand{position:absolute;right:44px;bottom:44px;z-index:6;font-size:32px;font-weight:900;letter-spacing:-1px;color:rgba(255,255,255,.72)}
#brand b{color:#fff}
</style></head><body><div id="s">
<div id="ph"><img id="pimg"></div>
<div id="L"><div class="tag" id="tag"><i></i><span id="tagt"></span></div>
  <div class="top" id="top"></div><div class="big" id="big"></div></div>
<div id="date"></div><div id="brand">야구<b>자판기</b></div>
</div><script>
const TH=(window.EP&&EP.thumb)||{},P=(window.EP&&EP.photos)||{};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function src(n){if(!n)return'';if(P[n])return P[n];const k=Object.keys(P).find(k=>k.endsWith('/'+n)||k===n);return k?P[k]:''}
const tg=TH.tag||(window.EP&&EP.railTitle)||'';
document.getElementById('tagt').textContent=tg;
if(!tg)document.getElementById('tag').style.display='none';
const im=document.getElementById('pimg'); const s=src(TH.img); if(s)im.src=s; else document.getElementById('ph').style.display='none';
if(TH.focus)im.style.objectPosition=TH.focus;
document.getElementById('top').innerHTML=esc(TH.top||'').replace(/\n/g,'<br>');
/* 마지막 줄을 노랑으로 */
const ls=String(TH.big||'').split('\n');
document.getElementById('big').innerHTML=ls.map((t,i)=>i===ls.length-1?'<em>'+esc(t)+'</em>':esc(t)).join('<br>');
const DS=TH.date||EP.date||EP.gameDate||'', d=DS.split('-'); const w=['일','월','화','수','목','금','토'];   /* 9/20: 콘티 thumb.date 가 있으면 그게 우선(경기 날짜 등) — 다른 썸네일 템플릿과 같은 규칙 */
document.getElementById('date').textContent=d.length===3?`${+d[1]}월 ${+d[2]}일(${w[new Date(DS+'T12:00:00').getDay()]})`:'';
if(TH.noDate||TH.date===false)document.getElementById('date').style.display='none';   /* 9/20: 롱폼 썸네일은 날짜 배지 없이(사용자 지시) */
(function(){const el=document.getElementById('big');let fs=parseFloat(getComputedStyle(el).fontSize);
 const want=ls.length, lim=720, room=720-parseFloat(getComputedStyle(document.getElementById('L')).top)-150;
 while((el.scrollWidth>lim||el.offsetHeight>Math.min(room,fs*1.0*want+8))&&fs>54){fs-=3;el.style.fontSize=fs+'px';}
 const t=document.getElementById('top');let ts=parseFloat(getComputedStyle(t).fontSize);
 while(t.scrollWidth>lim&&ts>26){ts-=2;t.style.fontSize=ts+'px';}})();
</script></body></html>
