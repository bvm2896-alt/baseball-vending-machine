<!doctype html>
<!-- 야구자판기 롱폼 썸네일 '챔피언스리그 포스터형(ucl)' 1280x720 (2026-10-11 신설, 롱폼⑪)
     레퍼런스(사용자 10/11): 토트넘 FINALISTS · PSG GAMEDAY · PSG WE ARE PARIS 포스터 — 공통 기법
       ① 모든 누끼를 같은 색으로 보정(채도 ↓, 대비 ↑, 그림자에 남색 틴트) → 사진 조건이 달라도 한 장처럼
       ② 누끼 가장자리에 같은 색 림라이트(하늘색 빛 테두리) + 같은 방향 그림자
       ③ 뒷줄 = 큰 얼굴(머리~가슴, 가슴 아래로 서서히 투명) / 앞줄 = 작은 전신·상체(바닥 어둠에 녹음)
       ④ 배경 = 남색 밤 + 대각선 빛줄기 + 양옆 보라·자홍 리본 + 별 반짝임 + 보케 + 바닥 빛
       ⑤ 글씨 = 아주 크고 두꺼운 흰 글씨(빛 번짐) 위, 작은 안내 줄 한 줄
     콘티 thumb: {"layout":"ucl","kicker":"…","lines":[{t,c,s}],"people":[{"img","top","chin","cx","x","y","H"(머리 높이 px),"kind":"head|body","z","grade"}]} -->
<html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:'PB';src:url('__FONT_DIR__/Pretendard-Black.otf')}
@font-face{font-family:'GM';src:url('__FONT_DIR__/GmarketSansBold.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#s{position:relative;width:1280px;height:720px;overflow:hidden;
 background:radial-gradient(ellipse 820px 520px at 50% 42%,#1D3A9E 0%,#122670 32%,#0A1448 62%,#040825 100%)}
#deco,#deco2{position:absolute;inset:0;pointer-events:none}
#deco2{z-index:41}
#fx{position:absolute;inset:0}
#ppl{position:absolute;inset:0}
.pp{position:absolute;transform-origin:0 0}
.pp img{display:block}
.pp .tint{position:absolute;inset:0;mix-blend-mode:soft-light;pointer-events:none}
.pp .tint2{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none}
#floor{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:40;background:linear-gradient(180deg,rgba(4,8,37,0) 0%,rgba(4,8,37,.6) 40%,rgba(2,4,22,.96) 75%,#020416 100%)}
#kick{position:absolute;z-index:50;left:0;right:0;top:26px;text-align:center;font-family:'GM';font-size:28px;letter-spacing:6px;color:#CFE3FF;text-shadow:0 0 12px rgba(120,180,255,.7),0 2px 4px rgba(0,0,0,.7)}
#txt{position:absolute;z-index:50;left:0;right:0;top:58px;display:flex;flex-direction:column;align-items:center}
.ln{position:relative;white-space:nowrap;line-height:1;font-family:'PB';letter-spacing:-5px;transform:scaleX(.94);transform-origin:50% 50%}
.ln span{display:block}
.ln .ex{position:absolute;left:0;top:0;color:#020616;transform:translate(0,8px);filter:blur(4px);opacity:1}
.ln .fc{position:relative}
.w .fc{color:#fff;text-shadow:0 0 10px rgba(180,220,255,.9),0 0 34px rgba(90,150,255,.75),0 0 70px rgba(60,110,255,.5),0 4px 10px rgba(0,0,0,.9)}
.y .fc{color:#FFE14A;text-shadow:0 0 10px rgba(255,235,150,.9),0 0 30px rgba(255,200,60,.6)}
.c .fc{color:#BFEBFF;text-shadow:0 0 10px rgba(180,240,255,.95),0 0 32px rgba(0,200,255,.7),0 4px 10px rgba(0,0,0,.9)}
.o .fc{color:transparent;-webkit-text-stroke:5px #fff;text-shadow:0 0 18px rgba(120,180,255,.6)}
</style></head><body><div id="s"><div id="deco"></div><canvas id="fx" width="1280" height="720"></canvas>
<div id="ppl"></div><div id="floor"></div><div id="deco2"></div><div id="kick"></div><div id="txt"></div></div>
<script>
window.__thumbAsync=true;
const TH=(window.EP&&EP.thumb)||{}, P=(window.EP&&EP.photos)||{};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const src=n=>{if(!n)return '';if(P[n])return P[n];const k=Object.keys(P).find(x=>x.endsWith(n)||n.endsWith(x));return k?P[k]:''};
/* ── 배경: 대각선 빛줄기 + 양옆 리본 + 별 ── */
const D=document.getElementById('deco');
const star=(x,y,r,a)=>{let p='';for(let k=0;k<8;k++){const ang=-Math.PI/2+k*Math.PI/4,rr=k%2?r*.32:r;p+=(k?'L':'M')+(x+rr*Math.cos(ang)).toFixed(1)+','+(y+rr*Math.sin(ang)).toFixed(1)}return `<path d="${p}Z" fill="#fff" opacity="${a}"/>`};
let st='';[[90,120,18,.9],[1190,150,16,.85],[250,60,10,.7],[1040,70,11,.7],[40,420,12,.6],[1240,430,13,.65],[640,30,7,.5],[470,120,6,.5],[830,110,6,.5],[150,600,9,.5],[1130,620,9,.5]].forEach(q=>st+=star(...q));
D.innerHTML=`<svg width="1280" height="720" viewBox="0 0 1280 720"><defs>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset=".45" stop-color="#9FD0FF" stop-opacity=".22"/><stop offset="1" stop-color="#5A8CFF" stop-opacity="0"/></linearGradient>
 <linearGradient id="rib" x1="0" x2="1"><stop offset="0" stop-color="#FF2E9A"/><stop offset=".5" stop-color="#8A3BFF"/><stop offset="1" stop-color="#2F6BFF"/></linearGradient>
 <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".3" stop-color="#BFE3FF" stop-opacity=".4"/><stop offset="1" stop-color="#3C7BFF" stop-opacity="0"/></radialGradient>
 <radialGradient id="mg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C026D3" stop-opacity=".55"/><stop offset="1" stop-color="#C026D3" stop-opacity="0"/></radialGradient>
 <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter><filter id="b16"><feGaussianBlur stdDeviation="16"/></filter><filter id="b40"><feGaussianBlur stdDeviation="40"/></filter></defs>
 <ellipse cx="60" cy="560" rx="380" ry="300" fill="url(#mg)"/><ellipse cx="1220" cy="560" rx="380" ry="300" fill="url(#mg)"/>
 <g style="mix-blend-mode:screen"><polygon points="-80,-40 120,-40 760,720 300,720" fill="url(#beam)" filter="url(#b16)" opacity=".8"/><polygon points="1160,-40 1360,-40 980,720 520,720" fill="url(#beam)" filter="url(#b16)" opacity=".8"/>
  <polygon points="30,-30 80,-30 620,720 480,720" fill="url(#beam)" filter="url(#b6)" opacity=".55"/><polygon points="1200,-30 1250,-30 800,720 660,720" fill="url(#beam)" filter="url(#b6)" opacity=".55"/></g>
 <g style="mix-blend-mode:screen"><path d="M-120,520 C120,300 260,620 420,420 S560,280 700,360" fill="none" stroke="url(#rib)" stroke-width="80" opacity=".5" filter="url(#b40)"/><path d="M-120,520 C120,300 260,620 420,420 S560,280 700,360" fill="none" stroke="url(#rib)" stroke-width="22" opacity=".85" filter="url(#b6)"/>
  <path d="M1400,520 C1160,300 1020,620 860,420 S720,280 580,360" fill="none" stroke="url(#rib)" stroke-width="80" opacity=".5" filter="url(#b40)"/><path d="M1400,520 C1160,300 1020,620 860,420 S720,280 580,360" fill="none" stroke="url(#rib)" stroke-width="22" opacity=".85" filter="url(#b6)"/></g>
 <ellipse cx="640" cy="330" rx="420" ry="230" fill="url(#core)" opacity=".55"/>
 <g style="mix-blend-mode:screen">${st}</g></svg>`;
/* 보케 */
let sd=5;const R=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
const c=document.getElementById('fx').getContext('2d');
for(let i=0;i<60;i++){const x=R()*1280,y=R()*500,r=4+R()*16;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(190,220,255,'+(.08+R()*.22)+')');g.addColorStop(1,'rgba(190,220,255,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
for(let i=0;i<80;i++){const x=R()*1280,y=R()*640,r=.7+R()*1.6;c.fillStyle='rgba(235,245,255,'+(.4+R()*.6)+')';c.beginPath();c.arc(x,y,r,0,7);c.fill()}
/* ── 선수: 머리 높이 H 로 크기 맞춤, 얼굴 가운데를 (x,y) 에 ── */
const PP=document.getElementById('ppl');
(TH.people||[]).slice().sort((a,b)=>(a.z||0)-(b.z||0)).forEach(p=>{
 const im=new Image();im.src=src(p.img);
 const H=p.H||120,s=H/(p.chin-p.top),cx=p.cx*s,cy=(p.top+p.chin)/2*s;
 const d=document.createElement('div');d.className='pp';d.style.left=(p.x-cx)+'px';d.style.top=(p.y-cy)+'px';d.style.zIndex=10+(p.z||0);
 const head=p.kind==='head';
 /* 아래 투명: 큰 얼굴은 턱 아래 0.7~1.5 머리 높이에서, 몸은 마지막 fade px 에서 */
 const fy=TH.fadeY, fe=TH.fadeEnd||720, top=p.y-cy;
 const chinPx=p.chin*s, m=(fy!=null&&!head)?`linear-gradient(180deg,#000 0,#000 ${Math.max(0,fy-top)}px,rgba(0,0,0,.35) ${Math.max(0,(fy+fe)/2-top)}px,transparent ${Math.max(1,fe-top)}px)`:head?`linear-gradient(180deg,#000 0,#000 ${chinPx+H*.15}px,rgba(0,0,0,.55) ${chinPx+H*.5}px,transparent ${chinPx+H*.95}px)`:`linear-gradient(180deg,#000 0,#000 calc(100% - ${p.fade||150}px),transparent 100%)`;
 const grade=p.grade||(head?'saturate(.62) contrast(1.16) brightness(1.02)':'saturate(.78) contrast(1.12) brightness(1.04)');
 const glow=head?'drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 6px rgba(200,230,255,.8)) drop-shadow(0 0 30px rgba(90,160,255,.6))':'drop-shadow(0 0 2px rgba(220,240,255,.95)) drop-shadow(0 0 18px rgba(90,160,255,.6)) drop-shadow(14px 18px 22px rgba(0,0,0,.65))';
 d.style.cssText+=`;-webkit-mask-image:${m};mask-image:${m};filter:${glow}`;
 im.style.cssText=`width:${Math.round(im.naturalWidth?im.naturalWidth*s:0)}px;filter:${grade}`;
 im.onload=()=>{im.style.width=Math.round(im.naturalWidth*s)+'px'};
 d.appendChild(im);
 /* 같은 색 틴트: 그림자에 남색, 밝은 곳에 하늘색 — 사진마다 다른 조명을 한 톤으로 */
 const t=document.createElement('div');t.className='tint';t.style.cssText=`background:linear-gradient(180deg,rgba(120,170,255,.55) 0%,rgba(40,60,160,.6) 60%,rgba(20,30,110,.7) 100%);-webkit-mask-image:url(${im.src});-webkit-mask-size:100% 100%;mask-image:url(${im.src});mask-size:100% 100%`;d.appendChild(t);
 const t2=document.createElement('div');t2.className='tint2';t2.style.cssText=`background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 45%,rgba(60,80,190,.55) 100%);-webkit-mask-image:url(${im.src});-webkit-mask-size:100% 100%;mask-image:url(${im.src});mask-size:100% 100%`;d.appendChild(t2);
 PP.appendChild(d)});
/* 앞쪽 효과: 바닥 빛 + 가운데 아래 사이안 번짐 */
document.getElementById('deco2').innerHTML=`<svg width="1280" height="720" viewBox="0 0 1280 720"><defs><radialGradient id="fl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7FE0FF" stop-opacity=".45"/><stop offset="1" stop-color="#7FE0FF" stop-opacity="0"/></radialGradient><filter id="c30"><feGaussianBlur stdDeviation="30"/></filter></defs><g style="mix-blend-mode:screen"><ellipse cx="640" cy="730" rx="560" ry="130" fill="url(#fl)"/><ellipse cx="60" cy="40" rx="260" ry="140" fill="url(#fl)" opacity=".8"/><ellipse cx="1220" cy="40" rx="260" ry="140" fill="url(#fl)" opacity=".8"/></g></svg>`;
if(TH.kicker)document.getElementById('kick').textContent=TH.kicker; else document.getElementById('kick').remove();
const LINES=TH.lines||[], T=document.getElementById('txt');if(TH.txtTop!=null)T.style.top=TH.txtTop+'px';if(TH.txtBottom!=null){T.style.top='auto';T.style.bottom=TH.txtBottom+'px'}
LINES.forEach(Ln=>{const d=document.createElement('div');d.className='ln '+(Ln.c||'w');d.style.fontSize=(Ln.s||150)+'px';d.style.marginTop=(Ln.mt||0)+'px';
 d.innerHTML='<span class="ex">'+esc(Ln.t)+'</span><span class="fc">'+esc(Ln.t)+'</span>';T.appendChild(d)});
(async()=>{try{await document.fonts.ready}catch(e){}
 document.querySelectorAll('.ln').forEach((d,i)=>{const W=LINES[i].w;if(!W)return;let s=LINES[i].s||150;for(let k=0;k<30;k++){const w=d.querySelector('.fc').getBoundingClientRect().width;if(Math.abs(w-W)<3)break;s=s*W/w;d.style.fontSize=s+'px'}});
 await new Promise(r=>setTimeout(r,400));window.__thumbDone=true})();
</script></body></html>
