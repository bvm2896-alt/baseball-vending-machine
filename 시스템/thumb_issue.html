<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* 야구이슈 전용 썸네일 (thumb_issue.html) — 화이트 베이스, 사진이 주인공.
   순위 편 썸네일(다크·노란 날짜 배지·로고 VS)과 확실히 구분되게: 밝은 바탕, 큰 사진 카드, 왼쪽 정렬 헤드라인, 팀 색 굵은 줄.
   thumb: {img(사진 이름), teams|team, top(작은 문구), big(큰 문구), date(직접 지정 시), focus} */
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_bold.ttf') format('truetype');font-weight:700 900}
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_medium.ttf') format('truetype');font-weight:400 600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F4F6FA}
body{font-family:'KBO','Noto Sans CJK KR','Malgun Gothic',sans-serif;font-weight:900;color:#12161F;-webkit-font-smoothing:antialiased}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F4F6FA}
.bg{position:absolute;inset:0}
.pill{position:absolute;display:inline-flex;align-items:center;gap:18px;height:104px;padding:0 40px;border-radius:52px;font-size:52px;letter-spacing:-1px;white-space:nowrap}
.photo{position:absolute;left:70px;right:70px;top:340px;height:980px;border-radius:56px;overflow:hidden;background:#E9EDF3;box-shadow:0 40px 100px rgba(18,22,31,.28)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.35);border:8px solid #fff}
.chip img{width:80%;height:80%;object-fit:contain}
.top{position:absolute;left:80px;right:80px;top:1330px;font-size:104px;letter-spacing:-5px;line-height:1.05;color:#12161F;white-space:nowrap}
.bigw{position:absolute;left:80px;right:80px;top:1460px;font-size:250px;letter-spacing:-12px;line-height:1.0;white-space:nowrap;font-weight:900}
.bar{position:absolute;left:80px;width:220px;height:22px;border-radius:11px;top:1290px}
.brand{position:absolute;right:80px;bottom:70px;font-size:44px;letter-spacing:4px;color:#6A7382}
.brand b{color:#12161F}
</style></head><body><div id="st"></div>
<script>
const EP=window.EP||{}, TH=EP.thumb||{};
const COLOR={SS:'#074CA1',KT:'#1E5EFF',LG:'#C30452',HT:'#EA0029',OB:'#2B2A5E',NC:'#315288',LT:'#1E3A6B',SK:'#CE0E2D',HH:'#FC4E00',WO:'#820024'};
const ALIAS={'기아':'HT','KIA':'HT','엘지':'LG','케이티':'KT','엔씨':'NC','SSG':'SK','두산':'OB','삼성':'SS','롯데':'LT','한화':'HH','키움':'WO'};
const codeOf=n=>{const t=(EP.standings||[]).find(t=>t.team===n||t.code===n||t.code===ALIAS[n]);return t?t.code:(ALIAS[n]||n)};
const logo=c=>(EP.logos||{})[c]||'';
const teams=(TH.teams||(TH.team?[TH.team]:[EP.focusTeam||''])).map(codeOf).filter(Boolean);
const nl=t=>String(t||'').replace(/["“”'‘’]/g,'').split('\n').join('<br>');   // 썸네일 글씨엔 따옴표를 넣지 않는다(9/15)
/* 큰 글씨 색(9/15): 한 썸네일 안에서는 한 색, 편마다 강조색을 바꾼다 — 그날 첫 편은 구단색, 2·3·4편은 주황·보라·초록·파랑·빨강 순(구단색과 비슷한 색은 건너뜀). thumb.color 로 직접 지정 가능 */
const hue=h=>{const n=parseInt(h.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; if(!d) return -999; let H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4; H*=60; return H<0?H+360:H;};
const nearHue=(a,b)=>{const x=hue(a),y=hue(b); if(x<-1||y<-1) return false; const d=Math.abs(x-y); return Math.min(d,360-d)<35;};
const pickAccent=(base,idx)=>{ if(idx<=0) return base; const alt=['#D97706','#7C3AED','#059669','#1E5EFF','#E5484D'].filter(c=>!nearHue(c,base)); return alt[(idx-1)%alt.length]; };
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const c1=COLOR[teams[0]]||'#E5484D';
const cBig=TH.color||(EP.series==='야구분석'?c1:pickAccent(c1, EP.epIndex||0));   // 큰 글씨 색: 이슈는 편마다 다르게, 분석은 그 편 구단 키컬러(9/15)
const hex2=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
// 날짜 배지 = '올리는 날짜'(콘티 date) — 레일 날짜·제목 첫 해시태그와 같은 날. 2026-09-17 사용자 지시로 '경기 날짜'에서 바꿈
const dateText=(()=>{ if(TH.date) return TH.date; let d=new Date((EP.date||EP.gameDate||'')+'T00:00:00'); if(isNaN(d)) return EP.dateLabel||'';
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; })();
/* 사진: EP.photos[이름] (build.py 가 넣음). 크기(EP.photoSizes)로 잘라 채울지/통째로 보일지 결정 — 영상 템플릿과 같은 규칙 */
const PH=EP.photos||{}, PS=EP.photoSizes||{};
const find=(o,n)=>{ if(!n) return null; const b=String(n).replace(/\.[a-z0-9]+$/i,''); const k=Object.keys(o).find(x=>x===n||x===b||x.replace(/\.[a-z0-9]+$/i,'')===b); return k?o[k]:null; };
const src=find(PH,TH.img), sz=find(PS,TH.img);
function photoHtml(w,h){
  if(!src) return `<div style="position:absolute;inset:0;background:linear-gradient(160deg,${hex2(c1,.18)},${hex2(c1,.05)})"></div><div class="chip" style="left:50%;top:50%;transform:translate(-50%,-50%);width:480px;height:480px;border-radius:96px"><img src="${logo(teams[0])}"></div>`;
  let fit=TH.fit;
  if(!fit){ if(!sz) fit='cover'; else { const cs=Math.max(w/sz[0],h/sz[1]), r=(sz[0]/sz[1])/(w/h); fit=(!sz[2]&&cs<=1.3&&r>0.6&&r<1.7)?'cover':'contain'; } }
  if(fit==='cover') return `<img src="${src}" style="object-position:${esc(TH.focus||'50% 12%')}">`;
  const scale=sz?Math.min(1.3,w/sz[0],h/sz[1]):1, iw=sz?Math.round(sz[0]*scale):'auto', ih=sz?Math.round(sz[1]*scale):'auto';
  const back=sz&&sz[2]?`<div style="position:absolute;inset:0;background:linear-gradient(160deg,#F7F8FB,#E4E9F1)"></div>`
    :`<img src="${src}" style="position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(34px) saturate(1.1);opacity:.9"><div style="position:absolute;inset:0;background:rgba(18,22,31,.15)"></div>`;
  return `${back}<img src="${src}" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:${iw}${sz?'px':''};height:${ih}${sz?'px':''};object-fit:contain;${sz&&sz[2]?'':'border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.4)'}">`;
}
/* ── 9/26 그래픽 썸네일 (사용자: "썸네일에 선수 사진만 들어가서 지루하고 뻔하다") ──
   thumb.graphic: 'score' | 'faces' | 'versus' | 'podium' | 'branch' — 사진 카드 자리에 그림을 그린다 */
function trig(x, y, rot, bars) {
  const W = 15, H = 2.4, G = 2.0, half = (W - 2.0) / 2;
  let o = '';
  bars.forEach((b, i) => {
    const yy = -(H * 3 + G * 2) / 2 + i * (H + G);
    o += b ? `<rect x="${-W / 2}" y="${yy}" width="${W}" height="${H}"/>`
           : `<rect x="${-W / 2}" y="${yy}" width="${half}" height="${H}"/><rect x="${W / 2 - half}" y="${yy}" width="${half}" height="${H}"/>`;
  });
  return `<g transform="translate(${x},${y}) rotate(${rot})" fill="#12161F">${o}</g>`;
}
const FLAG = {
  '한국': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#fff"/>
    <g transform="translate(45,30) rotate(-56.31)"><!-- 9/26 태극 좌우가 뒤집혀 있던 것 수정(위키미디어 공식 도안 기준: 빨강 위·파랑 아래, 빨강 머리 왼쪽 위) -->
      <circle r="15" fill="#CD2E3A"/>
      <path d="M0,-15 A7.5,7.5 0 0,0 0,0 A7.5,7.5 0 0,1 0,15 A15,15 0 0,1 0,-15 Z" fill="#0047A0"/>
    </g>
    ${trig(18, 12, -56.3, [1, 1, 1])}${trig(72, 12, 56.3, [0, 1, 0])}${trig(18, 48, 56.3, [1, 0, 1])}${trig(72, 48, -56.3, [0, 0, 0])}</svg>`,
  '대만': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#FE0000"/><rect width="45" height="30" fill="#000095"/>
    <g transform="translate(22.5,15)"><g fill="#fff">${Array.from({length:12},(_,i)=>`<rect x="-1.5" y="-11.5" width="3" height="11.5" transform="rotate(${i*30})"/>`).join('')}</g>
    <circle r="6.4" fill="#000095"/><circle r="5.4" fill="#fff"/></g></svg>`,
  '일본': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#fff"/><circle cx="45" cy="30" r="18" fill="#BC002D"/></svg>`,
  '태국': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#A51931"/><rect y="10" width="90" height="40" fill="#F4F5F8"/><rect y="20" width="90" height="20" fill="#2D2A4A"/></svg>`,
  '홍콩': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#DE2910"/>
    <g transform="translate(45,30)">${Array.from({length:5},(_,i)=>`<path d="M0,0 C-7,-6 -7,-17 0,-19 C7,-17 7,-6 0,0 Z" fill="#fff" transform="rotate(${i*72})"/>`).join('')}<circle r="2.2" fill="#DE2910"/></g></svg>`,
  /* 9/22: A조 세 나라 */
  '중국': () => { const st = (x, y, r, rot) => `<polygon points="${Array.from({length:10},(_,i)=>{const a=-Math.PI/2+i*Math.PI/5+rot, rr=i%2?r*.382:r; return (x+rr*Math.cos(a)).toFixed(2)+','+(y+rr*Math.sin(a)).toFixed(2);}).join(' ')}" fill="#FFDE00"/>`;
    return `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"><rect width="90" height="60" fill="#DE2910"/>${st(15,15,9,0)}${st(30,6,3,.6)}${st(36,12,3,.3)}${st(36,21,3,0)}${st(30,27,3,.6)}</svg>`; },
  '필리핀': () => { const st = (x, y, r) => `<polygon points="${Array.from({length:10},(_,i)=>{const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.382:r; return (x+rr*Math.cos(a)).toFixed(2)+','+(y+rr*Math.sin(a)).toFixed(2);}).join(' ')}" fill="#FCD116"/>`;
    return `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"><rect width="90" height="30" fill="#0038A8"/><rect y="30" width="90" height="30" fill="#CE1126"/><polygon points="0,0 52,30 0,60" fill="#fff"/>
    <g transform="translate(17,30)"><circle r="6" fill="#FCD116"/>${Array.from({length:8},(_,i)=>`<rect x="-1" y="-11" width="2" height="5" fill="#FCD116" transform="rotate(${i*45})"/>`).join('')}</g>${st(6,6,3.2)}${st(6,54,3.2)}${st(41,30,3.2)}</svg>`; },
  '팔레스타인': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="20" fill="#000"/><rect y="20" width="90" height="20" fill="#fff"/><rect y="40" width="90" height="20" fill="#009736"/><polygon points="0,0 30,30 0,60" fill="#EE2A35"/></svg>`,
};

const flag=(n,w)=>FLAG[String(n||'').trim()]?`<div style="width:${w}px;height:${Math.round(w*.667)}px;border-radius:${Math.round(w*.1)}px;overflow:hidden;box-shadow:0 14px 34px rgba(18,22,31,.2);border:4px solid #E3E7EE;background:#fff;flex:0 0 auto">${FLAG[String(n).trim()]()}</div>`:(logo(codeOf(n))?`<div style="width:${w*.8}px;height:${w*.8}px;border-radius:${w*.18}px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(18,22,31,.2)"><img src="${logo(codeOf(n))}" style="width:80%;height:80%;object-fit:contain"></div>`:'');
const face=(img,d,extra='')=>{ const s2=find(PH,img); return `<div style="width:${d}px;height:${d}px;border-radius:50%;overflow:hidden;border:8px solid #fff;box-shadow:0 14px 34px rgba(18,22,31,.25);background:#E9EDF3;flex:0 0 auto;${extra}">${s2?`<img src="${s2}" style="width:100%;height:100%;object-fit:cover;object-position:${esc(TH.focus||'50% 18%')}">`:''}</div>`; };
function graphicHtml(){
  const g=TH.graphic, W='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#FFFFFF,#EEF1F6)';
  if(g==='score'){
    const L=TH.left||'한국', R=TH.right||'일본', sc=String(TH.score||'').split('-');
    const line=TH.line?`<div style="display:flex;gap:10px;margin-top:40px">${TH.line.map((v,k)=>`<div style="width:72px;height:92px;border-radius:14px;background:${(TH.lineHi||[]).includes(k+1)?c1:'#12161F'};color:#fff;font-size:52px;display:flex;align-items:center;justify-content:center">${esc(v)}</div>`).join('')}</div>`:'';
    return `<div style="${W}"><div style="display:flex;align-items:center;gap:30px">${flag(L,200)}<div style="font-size:200px;letter-spacing:-8px;line-height:1">${esc(sc[0]||'')}<span style="color:#AAB2BF">-</span>${esc(sc[1]||'')}</div>${flag(R,200)}</div>${line}</div>`;
  }
  if(g==='faces'){
    const fs=TH.faces||[], cols=TH.cols||Math.ceil(Math.sqrt(fs.length)), rows=Math.ceil(fs.length/cols), d=Math.min(Math.floor(860/cols)-16, Math.floor((PH_H-50)/rows)-12);
    return `<div style="${W}"><div style="display:grid;grid-template-columns:repeat(${cols},${d+12}px);gap:10px;justify-content:center">${fs.map(f=>face(f.img||f,d)).join('')}</div></div>`;
  }
  if(g==='versus'){
    const side=(x)=>x.img?face(x.img,380):flag(x.team,380);
    const lab=x=>x.label?`<div style="margin-top:22px;font-size:64px;letter-spacing:-2px">${esc(x.label)}</div>`:'';
    const A=TH.left||{}, B=TH.right||{};
    return `<div style="${W};flex-direction:row;gap:0"><div style="display:flex;flex-direction:column;align-items:center;width:420px">${side(A)}${lab(A)}</div>
      <div style="width:150px;height:150px;border-radius:50%;background:${c1};color:#fff;font-size:72px;display:flex;align-items:center;justify-content:center;margin:0 -30px;z-index:2;box-shadow:0 14px 34px rgba(0,0,0,.25)">VS</div>
      <div style="display:flex;flex-direction:column;align-items:center;width:420px">${side(B)}${lab(B)}</div></div>`;
  }
  if(g==='podium'){
    const by=m=>(TH.items||[]).find(x=>x.medal===m)||{};
    const col=(m,ht,c)=>{ const it=by(m); return `<div style="display:flex;flex-direction:column;align-items:center;width:270px;gap:16px">${flag(it.team,m==='금'?200:170)}<div style="font-size:56px;${it.hi?`color:${c1}`:''}">${esc(it.team||'')}</div><div style="width:100%;height:${ht}px;border-radius:24px 24px 0 0;background:${c};display:flex;justify-content:center;padding-top:20px;${it.hi?`box-shadow:0 0 0 10px ${c1} inset`:''}"><div style="width:110px;height:110px;border-radius:50%;background:#fff;color:${c};font-size:64px;display:flex;align-items:center;justify-content:center">${m}</div></div></div>`; };
    return `<div style="${W};justify-content:flex-end"><div style="display:flex;align-items:flex-end;gap:18px">${col('은',230,'#B8C0CC')}${col('금',320,'#F2B705')}${col('동',170,'#C97B3A')}</div></div>`;
  }
  if(g==='branch'){
    const rt=TH.root||['일본','대만'], rs=TH.results||[];
    return `<div style="${W};gap:22px"><div style="display:flex;align-items:center;gap:22px">${flag(rt[0],170)}<div style="font-size:70px;color:#8A93A3">vs</div>${flag(rt[1],170)}</div>
      ${rs.map(r=>`<div style="display:flex;align-items:center;gap:20px;background:#fff;border-radius:28px;padding:14px 26px;box-shadow:0 10px 26px rgba(18,22,31,.12)"><div style="width:380px;font-size:46px;letter-spacing:-2px;text-align:center;white-space:nowrap">${esc(r.cond)}</div><div style="font-size:64px;color:#16A34A">→</div>${flag(r.final[0],120)}<div style="font-size:44px;color:#8A93A3">vs</div>${flag(r.final[1],120)}</div>`).join('')}</div>`;
  }
  if(g==='poster'){   /* 9/26: 이목 끄는 포스터형 — 큰 국기 둘 + 가운데 큰 물음표/VS + X 표시 + 위 배지 */
    const F=TH.flags||[], cx=TH.center||'?';
    const one=(f,k)=>`<div style="position:relative;display:flex;flex-direction:column;align-items:center;transform:rotate(${k?4:-4}deg)">
      ${flag(f.team,370)}
      ${f.cross?`<svg viewBox="0 0 100 70" style="position:absolute;left:-10px;top:-14px;width:390px;height:275px"><path d="M8,8 L92,62 M92,8 L8,62" stroke="#E5484D" stroke-width="11" stroke-linecap="round"/></svg>`:''}
      ${f.label?`<div style="margin-top:22px;font-size:66px;letter-spacing:-3px;${f.labelColor?`color:${f.labelColor}`:''}">${esc(f.label)}</div>`:''}</div>`;
    if(F.length===3){   /* 세 나라: 위에 주인공(한국), 아래에 결승 상대 후보 둘 + 가운데 큰 물음표 */
      const sm=(f,k)=>`<div style="display:flex;flex-direction:column;align-items:center;transform:rotate(${k?4:-4}deg)">${flag(f.team,300)}${f.label?`<div style="margin-top:16px;font-size:56px;letter-spacing:-2px">${esc(f.label)}</div>`:''}</div>`;
      return `<div style="${W};gap:26px;background:radial-gradient(60% 60% at 50% 45%, ${hex2(c1,.22)}, #FFFFFF 70%)">
        <div style="display:flex;align-items:center;gap:26px">${flag(F[0].team,250)}${F[0].label?`<div style="font-size:70px;letter-spacing:-3px;line-height:1.05">${esc(F[0].label).replace('\\n','<br>')}</div>`:''}</div>
        <div style="display:flex;align-items:center">${sm(F[1],0)}
          <div style="width:170px;height:170px;border-radius:50%;background:#12161F;color:#FFD400;font-size:${[0,120,66,54][Math.min(3,String(cx).length)]}px;white-space:nowrap;display:flex;align-items:center;justify-content:center;margin:0 -36px;z-index:2;box-shadow:0 16px 40px rgba(0,0,0,.35);border:8px solid #fff">${esc(cx)}</div>
          ${sm(F[2],1)}</div></div>`;
    }
    return `<div style="${W};background:radial-gradient(60% 60% at 50% 45%, ${hex2(c1,.22)}, #FFFFFF 70%)">
      ${TH.badge?`<div style="position:absolute;top:40px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#E5484D;color:#fff;font-size:64px;letter-spacing:-2px;padding:14px 34px;border-radius:24px;box-shadow:0 12px 30px rgba(229,72,77,.35);white-space:nowrap">${esc(TH.badge)}</div>`:''}
      <div style="display:flex;align-items:center;gap:0;margin-top:${TH.badge?70:0}px">${F[0]?one(F[0],0):''}
        <div style="width:190px;height:190px;border-radius:50%;background:#12161F;color:#FFD400;font-size:${[0,130,70,58][Math.min(3,String(cx).length)]}px;white-space:nowrap;display:flex;align-items:center;justify-content:center;margin:0 -40px;z-index:2;box-shadow:0 16px 40px rgba(0,0,0,.35);border:8px solid #fff">${esc(cx)}</div>
        ${F[1]?one(F[1],1):''}</div></div>`;
  }
  return '';
}
const GR=!!TH.graphic;
const POSTER=TH.graphic==='poster', bigLines=String(TH.big||'').split('\n').length, PH_MAX=Math.min(980, 1100-(POSTER?190:250)*bigLines);   // 9/26 포스터형은 그림을 크게, 큰 글씨를 조금 작게   // 큰 글씨가 1660px(안전 영역) 안에 끝나도록 사진 높이 상한(1줄 850, 2줄 600)
const PH_H = (()=>{ if(TH.ph) return TH.ph;   /* 9/30: 콘티 thumb.ph = 사진 카드 높이 직접(작게 하면 큰 글씨가 커진다) */ if(GR) return Math.min(PH_MAX, TH.gh||900); if(!src||!sz) return PH_MAX; const h=Math.round(940*sz[1]/sz[0]); if(TH.perLine) return Math.min(h, TH.top?500:560); return Math.max(520, Math.min(PH_MAX, h)); })();   // 9/28 perLine(줄별 최대 글씨)이면 사진을 440까지 줄여 글자에 자리를 준다   // 사진 카드 높이: 사진 비율대로
const Y0 = 340 + PH_H;   // 사진 아래 글 시작 기준
const st=document.getElementById('st');
st.insertAdjacentHTML('beforeend',`
  <div class="bg" style="background:radial-gradient(70% 36% at 50% 18%,${hex2(c1,.16)} 0%,rgba(244,246,250,0) 70%),#F4F6FA"></div>
  <div class="pill" style="left:70px;top:200px;background:#12161F;color:#fff"><span style="width:18px;height:18px;border-radius:9px;background:${c1};display:inline-block"></span>${esc(EP.railTitle||"KBO 이슈")}</div>
  <div class="pill" style="right:70px;top:200px;background:#fff;color:#12161F;border:6px solid #12161F;font-size:56px">${esc(dateText)}</div>
  <div id="blk" style="position:absolute;inset:0"><div class="photo" style="height:${PH_H}px">${GR?graphicHtml():photoHtml(940,PH_H)}
    ${!GR&&src&&teams[0]&&TH.logos!==false?`<div class="chip" style="left:36px;top:36px;width:200px;height:200px;border-radius:48px"><img src="${logo(teams[0])}"></div>`:''}
    ${!GR&&src&&teams[1]&&TH.logos!==false?`<div class="chip" style="right:36px;top:36px;width:200px;height:200px;border-radius:48px"><img src="${logo(teams[1])}"></div>`:''}
  </div>
  <div class="bar" style="background:${c1};top:${Y0+50}px"></div>
  <div class="top" style="top:${Y0+90}px">${nl(TH.top)}</div>
  <div class="bigw" style="color:${cBig};top:${Y0+(String(TH.top||"").trim()?220:100)}px;${POSTER?'font-size:200px;letter-spacing:-9px':''}">${nl(TH.big)}</div></div>
  <div class="brand">야구<b>자판기</b></div>`);
// 글자가 폭(920)을 넘치면 자동 축소. 큰 글씨가 두 줄이면 위치를 위로 당긴다
for(const sel of ['.top','.bigw']){
  const e=document.querySelector(sel); if(!e) continue;
  const lines=e.innerHTML.split('<br>');
  e.innerHTML=lines.map(l=>`<span style="white-space:nowrap">${l}</span>`).join('<br>');
  const sps=[...e.querySelectorAll('span')];
  if(sel==='.bigw'&&TH.perLine){   // 9/28: 줄마다 따로 폭(920)에 꽉 차게 — 줄 길이가 달라도 각 줄이 최대 크기(사용자 "모든 줄이 다 같은 크기일 필요는 없어")
    e.style.lineHeight='1.0'; e.style.fontSize='1px';   // 부모 글자 크기의 줄 높이(strut)가 남지 않게
    for(const sp of sps){ sp.style.display='inline-block'; sp.style.lineHeight='1.0'; let f=60; sp.style.fontSize=f+'px';
      while(sp.getBoundingClientRect().width<920&&f<520){f+=4;sp.style.fontSize=f+'px';}
      while(sp.getBoundingClientRect().width>920&&f>60){f-=2;sp.style.fontSize=f+'px';} }
    if(Array.isArray(TH.lineScale)) sps.forEach((sp,i)=>{ const k=TH.lineScale[i]; if(k) sp.style.fontSize=(parseFloat(sp.style.fontSize)*k).toFixed(1)+'px'; });   // 9/28: 줄별 비율(예 [0.6,1] = 첫 줄을 60%로)
    // 10/1 사용자(쇼츠 목록 캡처): "텍스트가 썸네일에 가득 차지 않고 빈 공간이 있다" → 넘치면 글자를 줄이기 전에 사진 카드부터 줄인다(최소 360).
    //   글자는 줄마다 폭 920 에 꽉 찬 크기를 지키고, 사진이 360 까지 줄어도 넘칠 때만 글자를 줄인다. 콘티에 thumb.ph 를 직접 준 편은 건드리지 않는다.
    const over=e.getBoundingClientRect().bottom-1440, phEl=document.querySelector('.photo');
    if(over>0&&phEl&&!TH.ph&&!GR){ const d=Math.min(over, Math.max(0, PH_H-360));
      if(d>0){ phEl.style.height=(PH_H-d)+'px'; for(const q of ['.bar','.top','.bigw']){ const x=document.querySelector(q); if(x) x.style.top=(parseFloat(x.style.top)-d)+'px'; } } }
    for(let i=0;i<40&&e.getBoundingClientRect().bottom>1440;i++){ for(const sp of sps){ sp.style.fontSize=(parseFloat(sp.style.fontSize)*0.96).toFixed(1)+'px'; } }   // 안전 영역(아래 1440) 안에 들어갈 때까지 전체 비율 축소
    continue;
  }
  let fs=parseFloat(getComputedStyle(e).fontSize);
  const w=()=>Math.max(...sps.map(sp=>sp.getBoundingClientRect().width));
  while(w()>920&&fs>60){fs-=8;e.style.fontSize=fs+'px';}
}
// 사진+글 덩어리를 세로 가운데(살짝 위)로 — 쇼츠 피드에서 가운데가 보이므로
const big=document.querySelector('.bigw'), blk=document.getElementById('blk');
const SAFE_BOTTOM=1440;   // 9/28: 쇼츠 목록(격자)에서 아래 약 20%가 조회수 띠에 가려진다(사용자 캡처) → 글자는 1500px 위에서 끝나야 한다. 넘치면 사진+글 덩어리를 통째로 줄인다
if(big&&blk){ const bottom=big.getBoundingClientRect().bottom, top=340;
  if(bottom>SAFE_BOTTOM){ const k=(SAFE_BOTTOM-top)/(bottom-top); blk.style.transformOrigin=`50% ${top}px`; blk.style.transform=`scale(${k.toFixed(4)})`; }
  else { const shift=Math.round((1920-(bottom-top))/2 - top - 40); blk.style.transform=`translateY(${Math.max(-20, Math.min(shift, SAFE_BOTTOM-bottom))}px)`; } }
</script></body></html>
