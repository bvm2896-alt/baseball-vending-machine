</style></head><body><h1>야구자판기 <b>움직임 사전</b> · 16가지</h1><div class="g" id="g"></div>
<script>const c01=x=>x<0?0:x>1?1:x;
/* @@MOTIONKIT 11/1 사용자 "영상 디자인 효과(이즈 인·이즈 아웃·스프링·바운스·순차 등장·페이드·슬라이드·확대 전환·공유 요소 전환 등)를 학습해 적절하게".
   공용 움직임 도구 MK — 모든 장면에서 쓴다. p = 0~1 진행값(seg/pk 결과).
   규칙(사용자 지적 반영): 큰 글자·국기·사진은 넘침(오버슛) 금지(9/19) → spring/bounce 는 칩·점·배지 같은 작은 요소에만.
   사진 크기는 이어지는 장면에서 바뀌지 않는다(11/1) → 사진에는 zoom 효과 쓰지 않는다. 깜빡임 금지 → 페이드는 0.15초 이상. */
const MK = (() => {
  const c = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const E = {
    linear: t => c(t),
    inCubic: t => Math.pow(c(t), 3),                                   /* 이즈 인: 천천히 출발 → 빠르게(퇴장용) */
    outCubic: t => 1 - Math.pow(1 - c(t), 3),                          /* 이즈 아웃: 빠르게 출발 → 끝에서 천천히(등장 기본) */
    inOutCubic: t => { t = c(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },   /* 이동·전환 */
    outQuint: t => 1 - Math.pow(1 - c(t), 5),                          /* 강조 감속(MD3 emphasized decelerate 근사) */
    outBack: (t, s = 1.2) => { t = c(t); return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },   /* 살짝 넘쳤다 돌아옴 */
    spring: (t, z = .55, w = 14) => { t = c(t); if (t >= 1) return 1; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); },   /* 스프링: 툭 넘쳤다 튕기며 멈춤 */
    bounce: t => { t = c(t); const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; },   /* 바운스: 바닥에 튕김 */
  };
  const css = {
    /* 등장 */
    fade: p => `opacity:${c(p).toFixed(3)}`,
    rise: (p, px = 40) => `opacity:${c(p * 1.5).toFixed(3)};transform:translateY(${((1 - E.outCubic(p)) * px).toFixed(1)}px)`,
    slide: (p, dir = 'l', px = 120) => { const v = (1 - E.outQuint(p)) * px, tx = dir === 'l' ? -v : dir === 'r' ? v : 0, ty = dir === 'u' ? -v : dir === 'd' ? v : 0; return `opacity:${c(p * 2).toFixed(3)};transform:translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px)`; },
    springPop: (p, from = .6) => `opacity:${c(p * 3).toFixed(3)};transform:scale(${(from + (1 - from) * E.spring(p)).toFixed(4)})`,   /* 칩·배지·점만 */
    bounceDrop: (p, px = 80) => `opacity:${c(p * 3).toFixed(3)};transform:translateY(${(-(1 - E.bounce(p)) * px).toFixed(1)}px)`,   /* 점·공 아이콘만 */
    zoomIn: (p, from = .92) => `opacity:${c(p * 1.6).toFixed(3)};transform:scale(${(from + (1 - from) * E.outCubic(p)).toFixed(4)})`,   /* 판·카드 전체(사진 단독 ✗) */
    wipe: (p, dir = 'l') => { const r = (100 - 100 * E.inOutCubic(p)).toFixed(1); return `clip-path:inset(${dir === 'd' ? `0 0 ${r}% 0` : dir === 'u' ? `${r}% 0 0 0` : dir === 'r' ? `0 0 0 ${r}%` : `0 ${r}% 0 0`})`; },   /* 마스크 리빌 */
    shake: (p, amp = 10) => p <= 0 || p >= 1 ? '' : `transform:translateX(${(Math.sin(p * Math.PI * 6) * amp * (1 - p)).toFixed(1)}px)`,   /* 부정·경고 수치 한 번만 */
  };
  /* 순차 등장: i 번째 요소 시작 시각 */
  const stagger = (i, base = .15, step = .08) => base + i * step;
  /* 숫자 롤링(카운트업): 끝 자리수·소수 자리 유지 */
  const count = (v, p, dec) => { const n = +v; if (isNaN(n)) return String(v); const d = dec != null ? dec : (String(v).split('.')[1] || '').length; return (n * E.outCubic(p)).toFixed(d); };
  /* 하이라이트 스윕(광택이 한 번 지나감) — 강조 카드 안쪽에 겹쳐 넣는 div */
  const sweep = (p, color = 'rgba(255,255,255,.55)') => p <= 0 || p >= 1 ? '' : `<div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit"><div style="position:absolute;top:-20%;bottom:-20%;width:28%;left:${(-30 + 160 * E.inOutCubic(p)).toFixed(1)}%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,${color},transparent)"></div></div>`;
  /* 선 그리기: SVG path 에 stroke-dasharray/offset */
  const draw = (p, len = 2000) => `stroke-dasharray="${len}" stroke-dashoffset="${(len * (1 - E.inOutCubic(p))).toFixed(1)}"`;
  /* 펄스 고리(결론 숫자 뒤 한 번 퍼짐) */
  const pulse = (p, color = 'rgba(37,99,235,.35)') => p <= 0 || p >= 1 ? '' : `<div style="position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%) scale(${(1 + .35 * E.outCubic(p)).toFixed(3)});border:6px solid ${color};border-radius:inherit;opacity:${(1 - p).toFixed(3)};pointer-events:none"></div>`;
  /* 타이프라이터(인용문) */
  const type = (txt, p) => { const a = [...String(txt)], n = Math.round(a.length * c(p)); return a.slice(0, n).join(''); };
  return { E, css, stagger, count, sweep, draw, pulse, type };
})();
/* 장면 전환(s.tr): 'fade'(기본, 기존 그대로) · 'slide'(새 장면이 오른쪽에서 밀고 들어옴) · 'zoom'(살짝 커지며 등장 — 확대 전환) · 'up'(아래에서 올라옴).
   같은 chain 의 cont 장면(공유 요소 전환)에는 적용 안 함. render 끝에서 #body 에 transform 을 준다. */
function MK_tr(s, t, start) {
  const b = document.getElementById('body'); if (!b) return;
  if (!s || s._keep || s._chain || !s.tr || s.tr === 'fade') { b.style.transform = ''; return; }
  const p = c01((t - start) / .45), e = MK.E.outQuint(p);
  b.style.transform = s.tr === 'slide' ? `translateX(${((1 - e) * 160).toFixed(1)}px)` : s.tr === 'zoom' ? `scale(${(.94 + .06 * e).toFixed(4)})` : s.tr === 'up' ? `translateY(${((1 - e) * 70).toFixed(1)}px)` : '';
}
/* @@MOTIONKITEND */

const L=[['01 이즈 인','Ease-in'],['02 이즈 아웃','Ease-out'],['03 스프링','Spring'],['04 바운스','Bounce'],['05 순차 등장','Stagger'],['06 페이드','Fade'],['07 슬라이드','Slide'],['08 확대 전환','Zoom'],['09 공유 요소','Shared'],['10 숫자 롤링','Count-up'],['11 마스크 리빌','Wipe'],['12 광택 스윕','Sweep'],['13 선 그리기','Line draw'],['14 펄스','Pulse'],['15 흔들림','Shake'],['16 타자기','Typewriter']];
function frame(t){const T=2.6,lt=(t%T),p=c01((lt-.3)/1.2),q=c01((lt-.3)/1.6);let h='';
L.forEach(([a,b],i)=>{let x='';
 if(i==0) x=`<div class="st"></div><div class="d" style="left:${24+360*MK.E.inCubic(p)}px"></div>`;
 if(i==1) x=`<div class="st"></div><div class="d" style="left:${24+360*MK.E.outCubic(p)}px"></div>`;
 if(i==2) x=`<div class="st"></div><div class="d" style="left:${24+300*MK.E.spring(q)}px"></div><div style="position:absolute;left:340px;top:52px;width:3px;height:40px;background:#C9D2DE"></div>`;
 if(i==3) x=`<div style="position:absolute;left:206px;top:${20+100*MK.E.bounce(q)}px;width:28px;height:28px;border-radius:50%;background:#2563EB"></div><div style="position:absolute;left:150px;right:150px;top:150px;height:3px;background:#C9D2DE"></div>`;
 if(i==4) x=[0,1,2,3].map(j=>`<div style="position:absolute;left:30px;right:30px;top:${22+j*30}px;height:20px;border-radius:10px;background:#DCE6FB;${MK.css.slide(c01((lt-MK.stagger(j,.3,.18))/.5),'l',60)}"></div>`).join('');
 if(i==5) x=`<div style="position:absolute;left:120px;right:120px;top:40px;height:80px;border-radius:14px;background:#2563EB;${MK.css.fade(p)}"></div>`;
 if(i==6) x=`<div style="position:absolute;left:60px;right:60px;top:30px;height:100px;border-radius:14px;background:#2563EB;${MK.css.slide(p,'r',300)}"></div>`;
 if(i==7) x=`<div style="position:absolute;left:80px;right:80px;top:24px;height:110px;border-radius:14px;background:#2563EB;${MK.css.zoomIn(p,.5)}"></div>`;
 if(i==8){const e=MK.E.inOutCubic(p);x=`<div style="position:absolute;left:${30+e*90}px;top:${30-e*10}px;width:${60+e*200}px;height:${40+e*80}px;border-radius:12px;background:#2563EB"></div><div style="position:absolute;left:30px;top:90px;width:60px;height:40px;border-radius:12px;background:#DCE6FB;opacity:${1-e}"></div>`;}
 if(i==9) x=`<div style="position:absolute;left:0;right:0;top:20px;text-align:center;font-size:96px;font-weight:900;color:#2563EB;letter-spacing:-3px">${MK.count(53.84,q)}<span style="font-size:48px">%</span></div>`;
 if(i==10) x=`<div style="position:absolute;left:40px;right:40px;top:40px;height:80px;border-radius:14px;background:#12161F;color:#fff;font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center;${MK.css.wipe(p)}">KT 4승 2패</div>`;
 if(i==11) x=`<div style="position:absolute;left:40px;right:40px;top:30px;height:100px;border-radius:14px;background:#2563EB;color:#fff;font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center;overflow:hidden">77.06%${MK.sweep(q)}</div>`;
 if(i==12) x=`<svg width="440" height="160" style="position:absolute;left:0;top:0"><path d="M30 130 L110 90 L190 110 L270 50 L400 30" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" ${MK.draw(q,600)}/></svg>`;
 if(i==13) x=`<div style="position:absolute;left:150px;top:30px;width:140px;height:100px;border-radius:18px;background:#2563EB;color:#fff;font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center">81.8%${MK.pulse(c01((lt-.6)/1.0))}</div>`;
 if(i==14) x=`<div style="position:absolute;left:120px;right:120px;top:40px;height:80px;border-radius:14px;background:#E5484D;color:#fff;font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;${MK.css.shake(c01((lt-.6)/.6),14)}">실책 3개</div>`;
 if(i==15) x=`<div style="position:absolute;left:30px;right:30px;top:40px;font-size:34px;font-weight:800;color:#12161F">“${MK.type('유지가 아니라 찾으라는 것',q)}”</div>`;
 h+=`<div class="c">${x}<div class="l">${a}<small>${b}</small></div></div>`;});
document.getElementById('g').innerHTML=h;}
</script></body></html>
