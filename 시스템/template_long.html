<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* ===== 야구자판기 롱폼 전용 가로 템플릿 (template_long.html) — 2026-09-18 신설 =====
   캔버스 1920x1080 (16:9). 쇼츠 세로 템플릿(template_issue.html)과 같은 window.EP 구조·같은 장면 이름을 쓰되
   가로 화면에 맞춰 '왼쪽 비주얼 / 오른쪽 큰 글씨' 2단으로 다시 짰다.
   build.py 가 콘티 series 가 "야구롱폼" 이면 이 템플릿을 쓴다.
   영역: 레일 y40~126 / 본문 y176~886(좌우 96 여백, 폭 1728) / 자막 y930 / 아래 60px 은 플레이어 UI 여백.
   챕터: EP.chapters = [{key,title,from,to}] 이면 레일 오른쪽에 "2/5 대만 반응" 과 진행 바를 그린다. */
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_bold.ttf') format('truetype');font-weight:700 900}
@font-face{font-family:'KBO';src:url('__FONT_DIR__/KBO Dia Gothic_medium.ttf') format('truetype');font-weight:400 600}
*{margin:0;padding:0;box-sizing:border-box;word-break:keep-all}   /* 9/27: 낱말 가운데서 줄이 끊기지 않게(정규시즌 막바/지 사고) */
html,body{width:1920px;height:1080px;overflow:hidden;background:#F4F6FA}
body{font-family:'KBO','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:700;-webkit-font-smoothing:antialiased;color:#12161F}
#stage{position:relative;width:1920px;height:1080px;background:#F4F6FA}
.num{font-variant-numeric:tabular-nums;letter-spacing:-2px}
/* 레일 */
#hdr{position:absolute;left:56px;right:56px;top:36px;height:80px;display:flex;align-items:center;justify-content:space-between}
#brand{display:flex;align-items:center;gap:14px;font-size:42px;font-weight:900;letter-spacing:-1px;color:#12161F}
#brand .m{width:10px;height:38px;border-radius:5px;background:#EA0029}
#meta{display:flex;align-items:center;gap:20px}
#chap{display:flex;align-items:center;gap:14px;background:#12161F;color:#fff;font-size:32px;font-weight:800;letter-spacing:-1px;padding:10px 24px;border-radius:999px}
#chap .n{font-size:26px;font-weight:900;opacity:.72;letter-spacing:1px}
#meta .d{font-size:32px;font-weight:600;color:#6A7382;letter-spacing:1px}
#prog{position:absolute;left:56px;right:56px;top:122px;height:5px;border-radius:3px;background:#E3E7EE;overflow:hidden}
#prog i{display:block;height:5px;border-radius:3px;background:var(--acc);width:0}
/* 10/7 사용자 "모든 기록은 기준일을 작게 표기" → 장면에 asof 가 있으면 진행 막대 아래 오른쪽에 작은 회색 글씨 */
#asof{display:none;font-size:32px;font-weight:800;color:#2B3A55;letter-spacing:-.5px;background:#fff;border:3px solid #C9D3E3;border-radius:999px;padding:6px 22px 7px;box-shadow:0 4px 12px rgba(18,22,31,.08);white-space:nowrap}  /* 10/7 밤 사용자 "기록 기준일이 조금 더 잘 보이게": 위 머리줄(챕터 알약 왼쪽)에 흰 알약 — 본문과 절대 안 겹침 */
/* 본문 */
#body{position:absolute;left:56px;width:1808px;top:146px;height:714px;will-change:opacity,transform;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* 2단: 왼쪽 비주얼 / 오른쪽 글씨 */
.lr{display:flex;align-items:center;justify-content:center;gap:64px;width:100%;height:100%}
.lr>.v{flex:0 0 940px;max-width:940px;display:flex;align-items:center;justify-content:center}
.lr>.t{flex:0 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;gap:32px}  /* 9/18: flex:1 이면 글 칸이 남는 폭을 다 먹어 내용이 왼쪽에만 몰렸다 → 내용 폭만 쓰고 사진과 함께 가운데로 */
.lr>.t.mid{align-items:center;text-align:center}
/* 자막 */
#sub{position:absolute;left:120px;right:120px;bottom:40px;text-align:center}
#sub span{display:inline;background:rgba(18,22,31,.96);color:#FFFFFF;font-size:52px;font-weight:700;
  letter-spacing:-1px;line-height:1.55;padding:9px 20px;border-radius:14px;word-break:keep-all;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
/* 타이포 */
.mega{font-size:168px;font-weight:900;letter-spacing:-5px;line-height:1.06;color:#12161F}
.big{font-size:130px;font-weight:900;letter-spacing:-4px;line-height:1.08;color:#12161F}
.title{font-size:60px;font-weight:700;letter-spacing:-1.5px;color:#12161F}
.label{font-size:40px;font-weight:600;color:#6A7382;letter-spacing:-1px}
.gold{color:var(--acc)}.green{color:#16A34A}.red{color:#E5484D}.gray{color:#6A7382}
.row{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center}
.chip{background:transparent;border:0;overflow:visible;display:flex;align-items:center;justify-content:center;flex:0 0 auto}  /* 10/1 밤 사용자: 로고를 네모 카드에 넣지 말고 누끼 그대로 */
.chip img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 14px rgba(18,22,31,.14))}
.card{width:470px;min-height:560px;background:#FFFFFF;border:4px solid #E3E7EE;border-radius:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:38px 30px;box-shadow:0 18px 48px rgba(18,22,31,.10)}
.card .v{font-size:110px;font-weight:900;letter-spacing:-4px;line-height:1.05;white-space:nowrap;color:#12161F}
.card .l{font-size:36px;line-height:1.35;font-weight:600;color:#6A7382;letter-spacing:-1px}
.pane{background:#FFFFFF;border:3px solid #E3E7EE;box-shadow:0 14px 40px rgba(18,22,31,.08)}
/* 사진 틀 — 폭은 부모가 정한다(가로에서는 칸마다 다름) */
.photo{position:relative;width:100%;border-radius:32px;overflow:hidden;background:#E9EDF3;border:3px solid #E3E7EE;box-shadow:0 18px 50px rgba(18,22,31,.14);flex:0 0 auto}
.photo img,.pp img{width:100%;height:100%;object-fit:cover;display:block}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:20px 28px;background:linear-gradient(180deg,rgba(18,22,31,0),rgba(18,22,31,.72));color:#fff;font-size:32px;font-weight:700;text-align:left;letter-spacing:-1px}
.photo .tag{position:absolute;left:24px;top:24px;background:rgba(255,255,255,.92);color:#12161F;font-size:30px;font-weight:800;padding:9px 20px;border-radius:999px;letter-spacing:-1px}
/* 9/27: 자료 제목(tag)은 사진 위에 겹치지 않게 사진 틀 바깥 위쪽에 따로 붙인다 */
.tagout{align-self:center;background:#12161F;color:#fff;font-size:32px;font-weight:800;padding:10px 26px;border-radius:999px;letter-spacing:-1px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
/* 챕터 타이틀 카드 */
.chaptitle{display:flex;flex-direction:column;align-items:center;gap:30px}
.chaptitle .kk{font-size:40px;font-weight:900;letter-spacing:6px;color:var(--acc)}
.chaptitle .tt{font-size:132px;font-weight:900;letter-spacing:-5px;line-height:1.08;color:#12161F;text-align:center}
.dots{display:flex;gap:16px}
.dots i{width:18px;height:18px;border-radius:9px;background:#D8DEE8;display:block}
.dots i.on{background:var(--acc);width:52px}
/* 표 */
#table{width:1600px}
#table .hd{display:flex;align-items:center;gap:18px;padding-bottom:10px;border-bottom:2px solid #12161F;font-size:24px;font-weight:700;color:#6A7382;letter-spacing:1px}
.tr{display:flex;align-items:center;gap:18px;height:62px;border-bottom:1px solid #E3E7EE}
.tr .rk{width:52px;font-size:32px;font-weight:800;text-align:center}
.tr .tm{width:200px;display:flex;align-items:center;gap:14px}
.tr .nm{font-size:36px;font-weight:800;letter-spacing:-1.5px;white-space:nowrap}
.tr .bw{flex:1;height:26px;position:relative}
.tr .bar{position:absolute;left:0;top:0;height:26px;border-radius:0 13px 13px 0}
.tr .gp{width:110px;font-size:30px;font-weight:600;text-align:right;color:#6A7382}
.tr .wr{width:130px;font-size:36px;font-weight:800;text-align:right;letter-spacing:-1.5px}
/* ===== 롱폼 정보형 장면 (2026-09-18 추가) — 한 화면에 요소를 많이 담기 위한 것 ===== */
/* h2h: 맞대결 기록판 */
.h2h{width:100%;display:flex;flex-direction:column;gap:13px}
.h2h .r{display:flex;align-items:center;gap:24px;background:#fff;border:3px solid #E3E7EE;border-radius:22px;padding:14px 30px;box-shadow:0 8px 24px rgba(18,22,31,.06)}
.h2h .w{flex:1;text-align:left;font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.2}
.h2h .w small{display:block;font-size:27px;font-weight:600;color:#6A7382;letter-spacing:-1px;margin-top:3px}
.h2h .s{font-size:58px;font-weight:900;letter-spacing:-2px;width:230px;text-align:center}
.h2h .b{width:92px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff;flex:0 0 auto}
/* roster: 두 팀 명단 비교 */
.rst{display:flex;gap:36px;width:100%;align-items:stretch}
.rst .p{flex:1;min-width:0;background:#fff;border:4px solid #E3E7EE;border-radius:32px;padding:30px 34px;display:flex;flex-direction:column;gap:20px;box-shadow:0 14px 40px rgba(18,22,31,.08)}
.rst .hh{display:flex;align-items:center;gap:16px;border-bottom:2px solid #E3E7EE;padding-bottom:12px}
.rst .hh b{font-size:60px;font-weight:900;letter-spacing:-2px;white-space:nowrap}
.rst .hh span{font-size:32px;font-weight:800;color:#fff;background:#12161F;padding:6px 16px;border-radius:999px;letter-spacing:-1px;white-space:nowrap}
.rst .g{display:flex;align-items:flex-start;gap:14px;text-align:left}
.rst .g i{font-style:normal;flex:0 0 152px;font-size:32px;font-weight:700;color:#6A7382;padding-top:8px;letter-spacing:-1px;white-space:nowrap}
.rst .g u{text-decoration:none;flex:1;min-width:0;font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.36;word-break:keep-all}
/* statbars: 항목별 좌우 비교 막대 */
.sb{width:100%;display:flex;flex-direction:column;gap:16px}
.sb .r{display:flex;align-items:center;gap:18px}
.sb .k{width:340px;flex:0 0 340px;font-size:38px;font-weight:700;color:#6A7382;letter-spacing:-1px;text-align:center;line-height:1.25}
.sb .h{flex:1;min-width:0;display:flex;align-items:center;gap:14px}
.sb .h.l{justify-content:flex-end}
.sb .bar{height:46px;border-radius:10px;flex:0 0 auto}
.sb .n{font-size:46px;font-weight:900;letter-spacing:-1.5px;min-width:140px;flex:0 0 auto}
/* 스탯 칩 */
.st{display:flex;gap:20px;flex-wrap:wrap}
.st>div{background:#fff;border:4px solid #E3E7EE;border-radius:26px;padding:20px 34px;min-width:184px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;box-shadow:0 14px 34px rgba(18,22,31,.10)}
.st>div b{font-size:78px;font-weight:900;letter-spacing:-3px;line-height:1.05}
.st>div i{font-style:normal;font-size:36px;font-weight:700;color:#6A7382;letter-spacing:-1px}
/* 칩이 넷 이상이면 한 줄에 들어가게 조금 줄인다 — 줄이 넘어가면 둘째 줄 오른쪽이 휑하게 빈다(9/18) */
.st.n4>div{padding:18px 30px;min-width:170px}.st.n4>div b{font-size:70px}.st.n4>div i{font-size:34px}
.st.n5>div{padding:13px 20px;min-width:132px}.st.n5>div b{font-size:50px}.st.n5>div i{font-size:27px}
.badge{display:inline-flex;align-items:center;gap:10px;color:#fff;font-size:32px;font-weight:800;padding:8px 22px;border-radius:999px;letter-spacing:-1px}
</style></head><body>
<div id="stage">
  <div id="hdr">
    <div id="brand"><div class="m" id="brandBar"></div><div>야구<b>자판기</b></div></div>
    <div id="meta"><div id="asof"></div><div class="d" id="railTitle" style="font-size:32px;font-weight:800;color:#12161F;letter-spacing:1px"></div><div id="chap" style="display:none"><span class="n" id="chapN"></span><span id="chapT"></span></div><div class="d num" id="railDate"></div></div>
  </div>
  <div id="prog"><i id="progBar"></i></div>
  <div id="body"></div>
  <div id="sub"><span></span></div>
</div>

<script>
const EP = window.EP || {};
const D = (EP.standings || []).map(t => ({
  rk: t.rank, nm: t.team, code: t.code, wr: t.winRate, gb: Number(t.gameBehind).toFixed(1),
  g: t.games, st: t.streak, win: t.win, lose: t.lose, draw: t.draw }));
const LOGO = EP.logos || {}, PHOTO = EP.photos || {};
const TEAMCOL = { SS: '#074CA1', KT: '#4A4A4A', LG: '#C30452', HT: '#EA0029', OB: '#2B2A5E', NC: '#315288', LT: '#1E3A6B', SK: '#CE0E2D', HH: '#FC4E00', WO: '#820024' };
const ALIAS = { '기아': 'HT', 'KIA': 'HT', '엘지': 'LG', '케이티': 'KT', '엔씨': 'NC', '에스에스지': 'SK', 'SSG': 'SK', '두산': 'OB', '삼성': 'SS', '롯데': 'LT', '한화': 'HH', '키움': 'WO' };
const T = n => D.find(t => t.nm === n || t.code === n || t.code === ALIAS[n]) || { nm: n, code: ALIAS[n] || n };
/* 강조색 = 주인공 팀 색 (KT 회색은 화면에서 죽어서 파란색으로) */
let ACC = TEAMCOL[(T(EP.focusTeam || '') || {}).code] || '#1E5EFF'; if (ACC === '#4A4A4A') ACC = '#1E5EFF';
document.documentElement.style.setProperty('--acc', ACC);
document.getElementById('brandBar').style.background = ACC;
const GREEN = '#16A34A', RED = '#E5484D', GRAY = '#6A7382', LINE = '#E3E7EE', TXT = '#12161F';
document.getElementById('railDate').textContent = EP.dateLabel || '';
if (EP.railTitle && !(EP.chapters || []).length) document.getElementById('railTitle').textContent = EP.railTitle;   // 10/4: 롱폼(챕터 있음)은 오른쪽 위 문구 금지(10/2 사용자)
const WRS = D.map(t => t.wr);
const LO = Math.min(...WRS, .4) - .03, HI = Math.max(...WRS, .6) + .02, BM = 330;

const c01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const eo = t => 1 - Math.pow(1 - c01(t), 3);
const eb = t => { t = c01(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const seg = (lt, a, d) => c01((lt - a) / d);
const fmt = w => w.toFixed(3).replace(/^0/, '');
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const br = s => esc(s).split('\n').join('<br>');
const SZ = { L: [300, 64], M: [190, 42], S: [62, 14] };
function chip(t, size = 'M', extra = '') {
  const [s, r] = SZ[size];
  return `<div class="chip" style="width:${s}px;height:${s}px;border-radius:${r}px;${extra}"><img src="${LOGO[t.code] || ''}"></div>`;
}

/* 나라는 로고가 없다 → 국기를 그린다(9/18 사용자 지시). 국기는 SVG 로 직접 그려서 폰트·이모지에 의존하지 않는다 */
function trig(x, y, rot, bars) {
  const W = 15, H = 2.4, G = 2.0, half = (W - 2.0) / 2;
  let o = '';
  bars.forEach((b, i) => {
    const yy = -(H * 3 + G * 2) / 2 + i * (H + G);
    o += b ? `<rect x="${-W / 2}" y="${yy}" width="${W}" height="${H}"/>`
           : `<rect x="${-W / 2}" y="${yy}" width="${half}" height="${H}"/><rect x="${W / 2 - half}" y="${yy}" width="${half}" height="${H}"/>`;
  });
  return `<g transform="translate(${x},${y}) rotate(${rot})" fill="#12161F">${o}</g>`;
}
const FLAG = {
  '한국': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#fff"/>
    <g transform="translate(45,30) rotate(-56.31)"><!-- 9/26 태극 좌우가 뒤집혀 있던 것 수정(위키미디어 공식 도안 기준: 빨강 위·파랑 아래, 빨강 머리 왼쪽 위) -->
      <circle r="15" fill="#CD2E3A"/>
      <path d="M0,-15 A7.5,7.5 0 0,0 0,0 A7.5,7.5 0 0,1 0,15 A15,15 0 0,1 0,-15 Z" fill="#0047A0"/>
    </g>
    ${trig(18, 12, -56.3, [1, 1, 1])}${trig(72, 12, 56.3, [0, 1, 0])}${trig(18, 48, 56.3, [1, 0, 1])}${trig(72, 48, -56.3, [0, 0, 0])}</svg>`,
  '대만': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#FE0000"/><rect width="45" height="30" fill="#000095"/>
    <g transform="translate(22.5,15)"><g fill="#fff">${Array.from({length:12},(_,i)=>`<rect x="-1.5" y="-11.5" width="3" height="11.5" transform="rotate(${i*30})"/>`).join('')}</g>
    <circle r="6.4" fill="#000095"/><circle r="5.4" fill="#fff"/></g></svg>`,
  '일본': () => `<svg viewBox="0 0 90 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="90" height="60" fill="#fff"/><circle cx="45" cy="30" r="18" fill="#BC002D"/></svg>`,
};
function sideChip(name, size = 'M') {
  const n = String(name || '').trim();
  const [w, r] = SZ[size];
  if (FLAG[n]) return `<div class="chip" style="width:${Math.round(w * 1.18)}px;height:${Math.round(w * .79)}px;border-radius:${Math.round(r * .5)}px;padding:0;overflow:hidden">${FLAG[n]()}</div>`;
  const t = T(n);
  if (t && LOGO[t.code]) return chip(t, size);   // T() 는 못 찾아도 빈 객체를 돌려주니 로고 파일 유무로 판단한다
  return `<div class="chip" style="width:${w}px;height:${w}px;border-radius:${r}px;font-size:${Math.round(w * .30)}px;font-weight:900;letter-spacing:-3px;color:${TXT}">${esc(n)}</div>`;
}
const EMOJI = "font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji','KBO',sans-serif";
function chipM(t, size = 'M', mark = '', p = 1, extra = '') {
  if (!mark) return chip(t, size, extra);
  const isText = !/\p{Extended_Pictographic}/u.test(mark);
  const fs = (size === 'L' ? 104 : 80) * (isText ? 1.1 : 1);
  const style = isText ? `font-family:'KBO';font-weight:900;color:${TXT};text-shadow:0 4px 18px rgba(255,255,255,.9)` : EMOJI + ';filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))';
  return `<div style="position:relative;display:inline-block;flex:0 0 auto">${chip(t, size, extra)}
    <div style="position:absolute;right:-${fs * .45}px;top:-${fs * .35}px;font-size:${fs}px;line-height:1;${style};opacity:${c01(p * 1.5)};transform:scale(${0.4 + 0.6 * eb(p)}) rotate(${(1 - eb(p)) * -25 + 8}deg)">${esc(mark)}</div></div>`;
}
const markOf = (s, n, i) => (s.marks && (s.marks[n] || s.marks[i] || s.marks[String(i)])) || '';
const nextOf = (s, n, i) => (s.next && (typeof s.next === 'string' ? (i === 0 ? s.next : '') : (s.next[n] || s.next[i] || s.next[String(i)]))) || '';
function withNext(chipHtml, opp, p = 1, note = '') {
  if (!opp) return chipHtml;
  const o = T(opp);
  return `<div class="col" style="gap:14px">${chipHtml}

SCENE.big = (lt, s) => {
  const num = s.num || '', badge = numBadge(lt, num, s.numLabel);
  const H0 = 620, vis = PH(s, H0, seg(lt, 0, .5));
  const txt = `${badge}<div class="mega gold" style="font-size:${s.size ? Math.round(s.size * .95) : 120}px;${pop(seg(lt, .06, .5))};transform-origin:left center">${br(s.text || '')}</div>`
    + noteLine(lt, s.note, .3) + statRow(lt, s.stats, .3, s.showFrom);   /* 9/19: 글이 사진보다 한참 늦게 떠서 오른쪽이 비어 보였다 → 거의 동시에 */
  B(LR(vis, txt, false, phW(s, H0)));
};

/* photo: 사진이 주인공 — 사진 크게, 글씨는 옆에 */
SCENE.photo = (lt, s) => {
  const H0 = s.h || 680, vis = PH(s, H0, seg(lt, 0, .5));
  if (!vis) return SCENE.big(lt, { text: (s.tag ? s.tag + '\n' : '') + (s.text || ''), size: Math.min(s.size || 120, 112) });
  B(LR(vis, s.text ? `<div class="mega gold" style="font-size:${s.size ? Math.round(s.size * .95) : 112}px;${pop(seg(lt, .08, .5))};transform-origin:left center">${br(s.text)}</div>` : '', false, phW(s, H0)));
};

/* question: 가운데 큰 질문 */
SCENE.question = (lt, s) => {
  const vis = PH(s, s.ph || 560, seg(lt, 0, .5));   /* 10/5: s.ph — 가로 16:9 사진(관련 영상 썸네일)은 880 칸에 맞게 495 로 낮춰 안 잘리게 */
  const LS = s.logoSize || 170, n_ = (s.logos || []).length, gap_ = n_ >= 8 ? 18 : 40;   /* 10/4: 10구단 나열(마지막 질문) — 로고 150 · 간격 18 로 한 줄에 */
  const tl = (s.logos || []).map((t, i) => { const tt = T(t); return tt && LOGO[tt.code] ? `<div class="chip" style="width:${LS}px;height:${LS}px;${pop(seg(lt, .5 + i * (n_ >= 8 ? .06 : .12), .4))}"><img src="${LOGO[tt.code]}"></div>` : ''; }).join('');   /* 10/1 밤: 마지막 질문에 팀 로고 줄 */
  const ex = noteLine(lt, s.note, .3) + statRow(lt, s.stats, .3) + (tl ? `<div class="row" style="gap:${gap_}px;justify-content:center;margin-top:10px;flex-wrap:nowrap">${tl}</div>` : '');
  let mega = `<div class="mega" style="font-size:${s.size || 126}px;${pop(seg(lt, 0, .6))}">${br(s.text || '여러분 생각은?')}</div>`;
  if (s.arrow === 'left' && vis) {   /* 10/11: 왼쪽 사진(관련 영상 썸네일)을 가리키며 통통 튀는 화살표 — 유튜브 카드 자리 */
    const a = c01((lt - .3) / .35), b = Math.abs(Math.sin(lt * 4.2)) * 18;
    const chev = [0, 1].map(i => `<svg width="66" height="150" viewBox="0 0 40 96" style="display:block;opacity:${(0.35 + 0.65 * Math.max(0, Math.sin(lt * 5 - i * 0.9))).toFixed(2)}"><path d="M34 10 L6 48 L34 86" fill="none" stroke="${ACC}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>`).join('');
    mega = `<div class="row" style="gap:26px;align-items:center;flex-wrap:nowrap"><div class="row" style="gap:0;flex:0 0 auto;opacity:${a.toFixed(2)};transform:translateX(${(-b + (1 - a) * 30).toFixed(1)}px)">${chev}</div>${mega}</div>`;
  }
  B(LR(vis, `${mega}${ex}`, !vis));
};

/* 번호 배지 — 글자가 붙거나 세 자리 이상이면 알약 */
function numBadge(lt, num, label) {
  if (!num) return '';
  const wide = label || String(num).length >= 3;
  const st = `${pop(seg(lt, .05, .45))};background:${ACC};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:-1px`;
  if (wide) return `<div class="num" style="height:88px;padding:0 36px;border-radius:18px;font-size:52px;gap:14px;${st}">${label ? `<span style="font-size:42px;font-weight:800;opacity:.9">${esc(label)}</span>` : ''}<span>${num}</span></div>`;
  return `<div class="num" style="width:96px;height:96px;border-radius:50%;font-size:60px;${st}"></div>`.replace('></div>', `>${num}</div>`);
}

/* 카드 두 장 (versus / need / matchup) */
function cardOf(x, p, compact) {
  if (!x) return '';
  const t = x.team ? T(x.team) : null;
  /* 세로 사진을 가로 칸에 넣으면 양옆이 빈다 → 사진 비율에 맞춰 칸 모양을 고른다(9/18) */
  const sz = photoSize(x.img), tall = sz && sz[1] > sz[0] * 1.05;
  const bw = tall ? 260 : 340, bh = compact ? (tall ? 250 : 170) : (tall ? 300 : 200);
  const cs = compact ? 'min-height:0;padding:28px 30px;gap:16px;' : '';   /* 9/19: 사진 카드 두 장 + 배지가 본문(714px)을 넘어 배지가 구석으로 밀렸다 */
  const head = photoSrc(x.img)
    ? `<div style="width:${bw}px;height:${bh}px;border-radius:24px;overflow:hidden;position:relative;background:#E9EDF3"><div class="pp" style="position:absolute;inset:0">${photoImg(x, photoSrc(x.img), bw, bh, x.focus || '50% 12%')}</div></div>`
    : sideChip(x.team || x.name || '', 'M');   /* 사진이 없으면 로고, 나라면 국기(9/18) */
  return `<div class="card" style="${cs}${rise(p, 40)}">${head}
    <div class="v" style="${compact ? 'font-size:84px;' : ''}">${esc(x.value != null ? x.value : (t ? t.nm : (x.name || '')))}</div>
    ${x.name && x.value != null ? `<div class="l">${br(x.name)}</div>` : ''}
    ${x.label ? `<div class="l">${br(x.label)}</div>` : ''}</div>`;
}
SCENE.versus = (lt, s) => {
  const cp = !!(photoSrc((s.left || {}).img) || photoSrc((s.right || {}).img));
  B(LR('', `${numBadge(lt, s.num, s.numLabel)}<div class="row" style="gap:70px;justify-content:center;width:100%">
  ${cardOf(s.left, seg(lt, .08, .45), cp)}<div class="label" style="font-size:44px;${pop(seg(lt, .25, .4))}">VS</div>${cardOf(s.right, seg(lt, .3, .45), cp)}</div>`));
};
SCENE.need = SCENE.versus;
SCENE.matchup = (lt, s) => {
  /* 9/18: 가운데 칩 두 개만 있으면 화면이 허전하다 → 대회 배지·스탯 칩까지 얹는다 */
  const S_ = s._same;   /* 9/19: 앞 장면도 같은 두 팀 matchup 이면 국기·배지는 그대로 두고 점수와 문구만 바꾼다 */
  const tag = s.tag ? `<div class="badge" style="background:#12161F;margin-bottom:22px;${S_ && s._prev.tag === s.tag ? '' : rise(seg(lt, 0, .4), 16)}">${esc(s.tag)}</div>` : '';
  const sts = statRow(lt, s.stats, .35, s.showFrom);
  B(LR(PH(Object.assign({}, s, { tag: s.imgTag || '' }), 560, seg(lt, 0, .5)), `${tag}<div class="row" style="gap:54px;${S_ ? '' : pop(seg(lt, .05, .5))}">${sideChip(s.left, 'M')}<span class="big" style="font-size:150px;${S_ ? pop(seg(lt, .02, .4)) : ''}">${esc(s.score || 'vs')}</span>${sideChip(s.right, 'M')}</div>
    ${s.text ? `<div class="big gold" style="margin-top:24px;font-size:${s.size || 92}px;${pop(seg(lt, S_ ? .1 : .3, .5))}">${br(s.text)}</div>` : ''}
    ${sts ? `<div style="margin-top:22px">${sts}</div>` : ''}`, true, s.vw));   /* 9/28: s.vw = 사진 칸 폭(얼굴 가운데 사진은 좁게) */
};

/* people: 인물 카드 2~4장 (가로라 4장까지 들어간다) */
SCENE.people = (lt, s) => {
  const items = s.items || [], n = Math.max(1, items.length);
  let w = n <= 2 ? 460 : n === 3 ? 400 : n === 4 ? 330 : 300, ph = s.ph || (n <= 2 ? 400 : 330);   /* 9/30: 5장(키움 포스팅 5명) · s.ph 사진 높이 */
  if (s.full) {   /* 9/30 밤 사용자 "얼굴만 잘라서 띄우지 말고 프로필 사진 전체가 나오게": 카드 사진 칸을 사진 비율 그대로 → 잘리는 곳 없음 */
    const r = Math.max(...items.map(it => { const z = photoSize(it.img); return z ? z[1] / z[0] : 1.25; }));
    /* 10/5 밤 사용자(롱폼⑦ 'KBO 드래프트' 제목이 위 진행 줄과 겹침): 제목·이름·설명·아래 글씨를 뺀 남은 높이 안으로 사진 높이를 줄인다 → 본문 칸(#body)을 절대 안 넘음 */
    /* 10/10 사용자("이미지가 다음 장면과 같으면 그대로"): cont 로 이어지는 people 묶음에서 한 장면에만 아래 문구가 있으면 그 장면만 카드가 작아졌다 → 묶음 전체에서 가장 큰 문구 자리를 같이 잡는다 */
    const chP_ = []; for (let q = s; q && q.type === 'people'; q = q.cont && q._prev) chP_.push(q); for (let q = s._next; q && q.type === 'people' && q.cont; q = q._next) chP_.push(q);
    const txS_ = Math.max(0, ...chP_.filter(q => q.text).map(q => q.size || 80));
    const BH_ = (document.getElementById('body') || {}).clientHeight || 714, nl_ = Math.max(0, ...items.map(it => it.note ? String(it.note).split('\n').length : 0));
    const used_ = (s.title ? (s.titleSize || 52) * 1.3 + 26 : 0) + 40 + (n >= 4 ? 46 : 54) * 1.25 + 8 + Math.round(nl_ * (n >= 4 ? 32 : 36) * 1.28) + 8 + (txS_ ? txS_ * 1.25 + 28 : 0) + 36;
    const maxH = Math.min(s.fullH || 470, BH_ - used_); w = Math.min(w, Math.floor(maxH / r)); ph = Math.round(w * r); }
  let h = s.title ? `<div class="title gold" style="font-size:${s.titleSize || 52}px;margin-bottom:26px;${s._same && s._prev.title === s.title ? '' : s._same ? pop(seg(lt, .1, .45)) : rise(seg(lt, 0, .4), 20)}">${br(s.title)}</div>` : '';
  const anySay = items.some(it => it.say), sayTop = anySay && items.length >= 4;   /* 카드 3장 이하면 말풍선을 카드 옆에(세로 공간 안 먹음), 4장 이상이면 머리 위 */
  /* 10/4 사용자(롱폼⑥ 네일 카드만 길고 '200만/달러' 꺾임): note 자리는 모든 카드에 같은 높이로 미리 확보(가장 긴 note 줄 수) → 카드 높이 전부 같음, note 는 \n 에서만 줄바꿈(nowrap) */
  const NS_ = n >= 4 ? 32 : 36, noteLines = Math.max(0, ...items.map(it => Math.max(it.note ? String(it.note).split('\n').length : 0, it.note2 ? String(it.note2).split('\n').length : 0))), noteH = noteLines ? Math.round(noteLines * NS_ * 1.28) : 0;
  /* 10/13 밤 사용자("김현수 최원준 한승택을 묶어서 108억 표시 · 강백호는 보낸 표시"): s.bracket:{from,to,label,at} = 카드 위 묶음 괄호+금액, 항목 stamp:'보냄'·stampAt = 사진 위 도장 */
  const BR = s.bracket, brP_ = BR ? (s._same && s._prev.bracket && s._prev.bracket.label === BR.label ? 1 : pk(s, BR.at, .5, seg(lt, .6, .5))) : 0, GW_ = n * w + (n - 1) * 36;
  if (BR) h += `<div style="position:relative;width:${GW_}px;height:96px;margin:0 auto 6px">
      <div style="position:absolute;left:${BR.from * (w + 36)}px;width:${(BR.to - BR.from + 1) * w + (BR.to - BR.from) * 36}px;top:58px;height:30px;border:6px solid ${ACC};border-bottom:none;border-radius:16px 16px 0 0;transform-origin:50% 100%;transform:scaleX(${eo(brP_).toFixed(3)});opacity:${c01(brP_ * 2)}"></div>
      <div class="badge" style="position:absolute;left:${BR.from * (w + 36) + ((BR.to - BR.from + 1) * w + (BR.to - BR.from) * 36) / 2}px;top:4px;translate:-50% 0;background:${ACC};font-size:44px;padding:8px 30px;white-space:nowrap;${pop(brP_)}">${esc(BR.label)}</div></div>`;
  h += `<div class="row" style="gap:36px;align-items:stretch;justify-content:center;width:100%;${sayTop ? 'margin-top:96px;' : ''}">` + items.map((it, i) => {
    const S_ = s._same, pv = S_ ? ((s._prev.items || [])[i] || {}) : null, shownB_ = S_ && pv.img === it.img && (pv.at == null || pv.at < 50), p = it.at != null && !shownB_ ? pk(s, it.at, .5, 0) : S_ ? 1 : seg(lt, .2 + i * .25, .5),   /* 10/14 롱폼⑭ 검수: 카드마다 at(호흡) — 이름을 말하는 호흡에 카드가 뜬다, at 50 이상 = 자리만 */ src = photoSrc(it.img), t = it.team ? T(it.team) : null;   /* 9/30: cont 면 카드는 그대로, 바뀐 note 만 새로 뜬다 */
    const np = S_ && pv.note === it.note ? 1 : it.noteAt != null ? pk(s, it.noteAt, .4, 1) : S_ && pv.note !== it.note ? seg(lt, .1, .4) : 1;   /* 10/10: cont 에서 같은 설명은 다시 안 뜸 */
    const sp = it.say ? pk(s, it.sayAt, .4, seg(lt, .4 + n * .25 + i * .2, .4)) : 0;
    /* 10/13 사용자("케네디로 바뀌었다는 나레이션이 나올 때 사진을 웰스에서 케네디로"): img2·name2·note2 + swapAt(호흡) — 그 호흡에 사진이 0.5초 겹쳐 바뀌고 이름·설명도 같이 바뀐다. cont 로 이어지면 앞 장면에서 이미 바뀐 상태 유지 */
    const sw = it.img2 ? (S_ && pv.img2 === it.img2 && pv.swapAt != null ? 1 : pk(s, it.swapAt, .5, 0)) : 0, src2 = it.img2 ? photoSrc(it.img2) : null;
    const nm = sw >= .5 && it.name2 ? it.name2 : (it.name || ''), nt = sw >= .5 && it.note2 != null ? it.note2 : it.note;
    const pic = src ? `<div style="width:100%;height:${ph}px;overflow:hidden;background:#E9EDF3;position:relative"><div class="pp" style="position:absolute;inset:0">${photoImg(s.full ? Object.assign({}, it, { fit: 'cover' }) : it, src, w, ph, it.focus || (n >= 5 ? '50% 0%' : '50% 10%'))}</div>${src2 ? `<div class="pp" style="position:absolute;inset:0;opacity:${eo(sw).toFixed(3)}">${photoImg(s.full ? Object.assign({}, it, { fit: 'cover' }) : it, src2, w, ph, it.focus2 || it.focus || (n >= 5 ? '50% 0%' : '50% 10%'))}</div>` : ''}</div>`
      : `<div class="col" style="width:100%;height:${ph}px;background:linear-gradient(160deg,#EEF1F6,#DDE3EC)">${t ? chip(t, 'M') : ''}</div>`;
    const dm = it.dim ? (S_ && pv.dim ? 1 : seg(lt, .1, .45)) : 0;   /* 10/10: dim = 이 장면에선 흐리게(옆 카드에 집중) — cont 면 그 자리에서 서서히 */
    return `<div style="position:relative;${dm ? `filter:grayscale(${dm.toFixed(2)});opacity:${(1 - .5 * dm).toFixed(2)}` : ''}">${it.say ? miniBubble(it.say, sp, sayTop ? 't' : (i >= n / 2 ? 'r' : 'l'), n >= 4 ? 34 : 40, it.sayColor || ACC) : ''}<div class="pane" style="position:relative;width:${w}px;border-radius:28px;overflow:hidden;${S_ && (it.at == null || shownB_) ? '' : rise(p, 40)};${it.bad === true ? 'border-color:' + RED + ';' : ''}">${pic}${it.stamp ? (() => { const sp_ = S_ && pv.stamp === it.stamp ? 1 : pk(s, it.stampAt, .35, 0); return `<div style="position:absolute;left:50%;top:${Math.round(ph * .45)}px;transform:translate(-50%,-50%) rotate(-12deg) scale(${(1.8 - .8 * eo(sp_)).toFixed(3)});opacity:${c01(sp_ * 3)};border:7px solid ${RED};border-radius:18px;padding:6px 26px;background:rgba(255,255,255,.88);color:${RED};font-size:${n >= 4 ? 52 : 60}px;font-weight:900;white-space:nowrap;letter-spacing:-1px">${esc(it.stamp)}</div>`; })() : ''}
      <div class="col" style="padding:20px 14px;gap:8px"><div style="font-size:${n >= 4 ? 46 : 54}px;font-weight:900;letter-spacing:-1.5px">${esc(nm)}</div>
      ${nt ? `<div class="label" style="font-size:${NS_}px;min-height:${noteH}px;white-space:nowrap;color:${it.bad === true ? RED : it.bad === false ? GREEN : GRAY};text-align:center;line-height:1.28;${np < 1 ? pop(np) : ''}${it.bad === true ? ';font-weight:900' : ''}">${br(nt)}</div>` : noteH ? `<div style="min-height:${noteH}px"></div>` : ''}</div></div></div>`;
  }).join('') + `</div>`;
  if (s.text) h += `<div class="big gold" style="margin-top:28px;font-size:${s.size || 80}px;${s.full ? 'letter-spacing:-1px;' : ''}${s._same && s._prev.text === s.text ? '' : pop(pk(s, s.textAt, .5, seg(lt, s._same ? .1 : .3 + n * .25, .5)))}">${br(s.text)}</div>`;
  else { const cq = []; for (let q = s; q && q.type === 'people'; q = q.cont && q._prev) cq.push(q); for (let q = s._next; q && q.type === 'people' && q.cont; q = q._next) cq.push(q); const tq = cq.find(q => q.text); if (tq) h += `<div class="big gold" style="margin-top:28px;font-size:${tq.size || 80}px;visibility:hidden">${br(tq.text)}</div>`; }   /* 10/10: 묶음의 다른 장면 문구 자리 → 카드 위치 고정 */
  B(LR('', h));
};

/* teamgrid: 구단별 숫자 한 줄 */
SCENE.teamgrid = (lt, s) => {
  const items = s.items || [];
  let h = `<div class="row" style="gap:40px;justify-content:center;width:100%">` + items.map((it, i) => {
    const p = seg(lt, .15 + i * .12, .45), t = T(it.team || ''), hasL = items.some(x => x.label), hi = it.hi === true || (!!it.label && !items.some(x => x.hi));   /* 10/1 밤 사용자: 한 칸만 라벨이 붙어 위로 밀리지 않게 — 모든 칸 높이 같게(라벨 자리 미리 확보), 강조는 색·테두리 */
    return `<div class="col" style="gap:16px;justify-content:flex-start;${rise(pk(s, it.at, .45, p), 30)}">${chip(t, 'M')}<div class="big" style="font-size:78px;${hi ? `color:${ACC};` : ''}${hi ? `padding:0 22px;border:5px solid ${ACC};border-radius:24px;background:#fff;` : 'padding:0 22px;border:5px solid transparent;'}">${esc(it.value)}</div>${hasL ? `<div class="label" style="min-height:48px;text-align:center;color:${hi ? ACC : GRAY};font-weight:800;${it.label ? pop(seg(lt, .3 + i * .12, .4)) : ''}">${br(it.label || '')}</div>` : ''}</div>`;
  }).join('') + `</div>`;
  if (s.text) h += `<div class="big gold" style="margin-top:30px;font-size:${s.size || 84}px;${pop(pk(s, s.textAt, .5, seg(lt, .3 + items.length * .12, .5)))}">${br(s.text)}</div>`;
  B(LR('', h));
};

/* steps: 가로 타임라인 — 가로 화면에서 제일 잘 맞는다 */
SCENE.steps = (lt, s) => {
  /* 9/27: 원 안 글자가 넘쳤다(9.21~27) → 원 대신 글자 길이에 맞는 알약, 칸을 넓게, 낱말 단위 줄바꿈 */
  const items = s.items || [], n = items.length, GAP = n >= 5 ? 36 : 56;
  const colW = Math.min(440, Math.floor((1808 - GAP * (n - 1)) / Math.max(1, n)));
  const DS = n >= 5 ? 44 : 50, TS = n >= 5 ? 54 : 60;
  const PV = s._same ? (s._prev.items || []).filter(r => !r.hide).length : 0;   /* 10/1: cont 면 앞 칸은 그대로, 새 칸만 */
  let h = s.title ? `<div class="title gold" style="font-size:52px;margin-bottom:40px;${PV ? '' : rise(seg(lt, 0, .4), 20)}">${br(s.title)}</div>` : '';
  h += `<div class="row" style="gap:0;justify-content:center;width:100%;align-items:flex-start">` + items.map((it, i) => {
    const p = it.hide ? 0 : i < PV ? 1 : pk(s, it.at, .45, seg(lt, .15 + (i - PV) * .22, .45));   /* hide: 자리만 잡아 둔다 / at: 호흡 번호 */

/* ===== 정보형 장면 (2026-09-18) — 롱폼은 한 화면에 볼 게 많아야 한다 ===== */

  const R = n => Math.round(n * k);

  const hd = s.head ? `<div style="display:flex;align-items:flex-end;gap:24px;padding:0 30px ${R(6)}px;font-size:${R(30)}px;font-weight:800;color:#6A7382;letter-spacing:-1px;${S_ ? '' : rise(seg(lt, .05, .4), 12)}"><div style="flex:1;text-align:left">${esc(s.head[0] || '')}</div><div style="width:${R(260)}px;text-align:center;color:${ACC}">${esc(s.head[1] || '')}</div>${rows.some(r => r.res) ? `<div style="width:92px"></div>` : ''}</div>` : '';

    const medal = r.color && !r.res;   /* 메달표: 점수 칸을 색 알약으로 크게 */
    return `<div class="r" style="${rise(p, 26)};border-color:${r.hi ? ACC : '#E3E7EE'};padding:${R(14)}px 30px">
      <div class="w" style="font-size:${R(44)}px">${esc(r.when || '')}${r.sub ? `<small style="font-size:${R(27)}px">${esc(r.sub)}</small>` : ''}</div>
      ${medal ? `<div style="width:${R(260)}px;display:flex;justify-content:center"><div class="num" style="min-width:${R(150)}px;height:${R(70)}px;padding:0 24px;border-radius:999px;background:${col};color:#fff;display:flex;align-items:center;justify-content:center;font-size:${R(44)}px;font-weight:900">${esc(r.score || '')}</div></div>`

/* 9/27: 글자 비교표 — 왼쪽/오른쪽 이름을 머리로 둔 두 칸 카드, 줄마다 항목 이름은 가운데 작은 글씨 */
function textCompare(lt, s) {
  const rows = s.rows || [], CL = s.leftColor || '#12161F', CR = s.rightColor || ACC, W = 1500;
  const S_ = s._same, PV = S_ ? ((s._prev || {}).rows || []).filter(r => !r.hide).length : 0;   /* 10/15: cont 면 앞 줄은 그대로, 새 줄만 · hide = 자리만 · at = 호흡 · w = 앞선 쪽 칸 색 */
  let h = s.title ? `<div class="title gold" style="font-size:54px;margin-bottom:30px;${S_ ? '' : rise(seg(lt, 0, .4), 20)}">${br(s.title)}</div>` : '';
  const cell = (v, c, bg) => `<div style="flex:1;min-width:0;background:${bg};border-radius:22px;padding:26px 30px;font-size:${rows.length > 2 ? 48 : 56}px;font-weight:900;letter-spacing:-1.5px;line-height:1.25;color:${c};text-align:center">${br(v || '')}</div>`;
  h += `<div class="col" style="width:${W}px;gap:18px">

      <div style="width:220px"></div>

    rows.map((r, i) => { const q = r.hide ? 0 : (S_ && i < PV) ? 1 : r.at != null ? pk(s, r.at, .45, seg(lt, .2 + i * .22, .45)) : seg(lt, .2 + i * .22, .45);
      const wl = r.w === 'l', wr = r.w === 'r';
      return `<div style="display:flex;gap:24px;align-items:stretch;width:100%;${r.hide ? 'visibility:hidden;' : ''}${rise(q, 24)}">${wl ? cell(r.l, '#fff', CL + ';border:3px solid ' + CL) : cell(r.l, CL, '#fff;border:3px solid #E3E7EE')}
        <div style="width:220px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#6A7382;letter-spacing:-1px;text-align:center">${br(r.k || '')}</div>
        ${wr ? cell(r.r, '#fff', CR + ';border:3px solid ' + CR) : cell(r.r, CR, CR + '14;border:3px solid ' + CR)}</div>`; }).join('') + `</div>`;
  if (s.text) h += `<div class="big gold" style="margin-top:30px;font-size:${s.size || 76}px;${pop(seg(lt, .3 + rows.length * .22, .5))}">${br(s.text)}</div>`;
  B(LR('', `<div class="col" style="width:100%;align-items:center">${h}</div>`));
}
/* statbars: 항목별 좌우 비교 막대 */
SCENE.statbars = (lt, s) => {
  const rows = s.rows || [], L = s.left ? T(s.left) : null, R = s.right ? T(s.right) : null;
  if (rows.length && rows.every(r => r.lv == null && r.rv == null)) return textCompare(lt, s);   /* 9/27: 숫자 없는 비교는 막대 대신 두 칸 비교표 */
  /* 10/1 밤 사용자 "읽을 수가 없다" → 표를 가운데 1640px 카드에 크게: 숫자 64px·막대 64px, 항목 이름은 가운데 진하게. textSlot = 아래 문구 자리를 미리 비워 두어(px) 다음 장면에서 글이 생겨도 표가 밀리지 않는다 */
  const CL = s.leftColor || '#12161F', CR = s.rightColor || ACC, BW = 380, VW = 250, KW = 260, RH = rows.length >= 4 ? 90 : 108, BH = rows.length >= 4 ? 50 : 60;
  const PV = s._same ? (s._prev.rows || []).filter(r => !r.hide).length : 0;   /* 10/1: cont 면 앞 장면에 있던 줄은 그대로, 새 줄만 */
  let h = `<div class="pane col" style="width:1640px;border-radius:36px;padding:26px 44px 30px;gap:6px;${PV ? '' : rise(seg(lt, 0, .4), 18)}">
    ${L && R && /vs/i.test(s.title || '') ? /* 10/2 사용자 "가운데 롯데 vs 한화가 있는데 양 끝에 또 있다 → 가운데에 로고랑 같이": 머리줄 하나로 [로고] 롯데 vs 한화 [로고] */
      `<div class="row" style="width:100%;justify-content:center;gap:22px;margin-bottom:10px"><div class="chip" style="width:110px;height:110px"><img src="${LOGO[L.code] || ''}"></div><b style="font-size:60px;font-weight:900;letter-spacing:-2px;color:${CL}">${esc(s.leftName || L.nm)}</b><b style="font-size:46px;font-weight:900;color:${GRAY}">vs</b><b style="font-size:60px;font-weight:900;letter-spacing:-2px;color:${CR}">${esc(s.rightName || R.nm)}</b><div class="chip" style="width:110px;height:110px"><img src="${LOGO[R.code] || ''}"></div></div>` :
    `<div class="row" style="width:100%;justify-content:space-between;margin-bottom:10px">
    <div class="row" style="gap:16px">${L ? `<div class="chip" style="width:110px;height:110px"><img src="${LOGO[L.code] || ''}"></div>` : ''}<b style="font-size:56px;font-weight:900;letter-spacing:-2px;color:${CL}">${esc(s.leftName || (L ? L.nm : ''))}</b></div>
    ${s.title ? `<div class="title gold" style="font-size:50px">${br(s.title)}</div>` : ''}
    <div class="row" style="gap:16px"><b style="font-size:56px;font-weight:900;letter-spacing:-2px;color:${CR}">${esc(s.rightName || (R ? R.nm : ''))}</b>${R ? `<div class="chip" style="width:110px;height:110px"><img src="${LOGO[R.code] || ''}"></div>` : ''}</div></div>`}`;
  h += rows.map((r, i) => {

    const ql = r.hide ? 0 : i < PV ? 1 : pk(s, r.lAt, .6, q), qr = r.hide ? 0 : i < PV ? 1 : pk(s, r.rAt, .6, q);   /* 10/1 밤: 왼쪽·오른쪽 값이 나레이션 호흡(lAt/rAt)에 맞춰 각자 자란다 */
    const m = Math.max(1e-9, Number(r.lv) || 0, Number(r.rv) || 0);   // 줄마다 그 줄의 최대값을 100% 로

      <div style="width:${KW}px;flex:0 0 ${KW}px;text-align:center;font-size:44px;font-weight:900;letter-spacing:-1.5px;color:#3B4A63;line-height:1.2">${br(r.k || '')}</div>
      <div style="width:${BW}px;flex:0 0 ${BW}px;display:flex;justify-content:flex-start"><div style="width:${rw.toFixed(1)}px;height:${BH}px;border-radius:0 ${BH / 2}px ${BH / 2}px 0;background:${CR}"></div></div>
      <div class="num" style="width:${VW}px;flex:0 0 ${VW}px;text-align:left;font-size:${rows.length >= 4 ? 50 : 60}px;font-weight:900;letter-spacing:-2px;color:${CR};padding-left:18px;white-space:nowrap;opacity:${c01(qr * 1.6)}">${esc(r.r || '')}</div></div>`;
  }).join('') + `</div>`;
  const slot = s.textSlot || 0, tsz = s.size || 76;
  if (s.text) h += `<div class="big gold" style="margin-top:22px;min-height:${slot}px;font-size:${tsz}px;${PV && s._prev.text === s.text ? '' : pop(pk(s, s.textAt, .5, seg(lt, .3 + (rows.length - PV) * .16, .5)))}">${br(s.text)}</div>`;
  else if (slot) h += `<div style="margin-top:22px;min-height:${slot}px"></div>`;
  B(LR('', `<div class="col" style="width:100%;align-items:center">${h}</div>`));

/* profile: 선수 한 명 — 사진 + 이름 + 소속 배지 + 스탯 칩 + 한 줄 */
SCENE.profile = (lt, s) => {

     ② 사진 크기 통일: s.pw(기본 480)×H0 상자에 cover·위 기준(구단 프로필은 모자~가슴). 통째로 보이게 하려면 pw:0
     ③ 인용(“…”)은 말풍선 카드로 */
  const H0 = s.h || 620, PW = s.pw == null ? 480 : s.pw, sts = s.stats || [], K = s._keep || s._chain;   /* 10/5: 같은 사람 묶음(chain)이면 사진·이름은 그대로 */

      ${s.sub ? `<div class="badge" style="margin-top:14px;background:${ACC};${K && s._prev && s._prev.sub !== s.sub ? pop(seg(lt, .05, .4)) : ''}">${esc(s.sub)}</div>` : ''}</div>

      return `<div style="${same ? '' : pop(pk(s, s.textAt, .5, seg(lt, K ? .08 : .12, .5)))}">${box}</div>`; })() : ''}
    ${st ? `<div class="st${(s._nmax || sts.length) >= 5 ? ' n5' : (s._nmax || sts.length) === 4 ? ' n4' : ''}"${s._tw ? ' style="width:100%"' : ''}>${st}</div>` : ''}</div>`;

/* ───── 9/27: 쇼츠(template_issue) 그림 장면 이식 — facegrid·scoreboard·bars·podium·icons·compare ─────

  const hiA = new Array(n).fill(0), dimA = new Array(n).fill(0), vis = new Array(n).fill(1);
  if (on < 0) {
    const T = (EP.segT || [])[s.startLine] || [], first = s.itemFrom ?? 1;
    for (let i = 0; i < n; i++) vis[i] = seg(lt, .1 + i * .12, .4);            /* 칸은 첫 호흡 동안 차례로 올라온다 */
    if (T.length > first) {
      for (let i = 0; i < n; i++) {
        const t0 = T[first + i], t1 = T[first + i + 1];
        if (t0 == null) continue;
        const up = c01((NOW - t0 + .08) / .25), down = t1 == null ? 0 : c01((NOW - t1 + .08) / .25);
        hiA[i] = up * (1 - down);
        if (NOW >= t0 - .08) vis[i] = 1;
      }
    }
  } else {
    const P = s._prev, fromToc = !!(s._same && P && P.type === 'toc');
    const PT = fromToc ? ((EP.segT || [])[P.startLine] || []) : [], pLit = fromToc && (P.on ?? -1) < 0 && PT.length === (P.itemFrom ?? 1) + n;   /* 10/11: 마지막 칸 뒤에 호흡이 더 있으면("이 순서로 볼게요") 그 칸은 이미 꺼진 상태 → 아무 칸도 안 켜진 채 시작(5번 반짝 금지) */   /* 10/1 밤 사용자: 목차 소개(on:-1)가 마지막 칸을 켜 둔 채 끝났을 때만 거기서 이어 간다 — 아니면(itemFrom 99) 아무 칸도 안 켜진 상태에서 시작(키움 반짝 금지) */
    const pOn = fromToc ? ((P.on ?? -1) < 0 ? (pLit ? n - 1 : -1) : P.on) : -1, pDim = fromToc && (P.on ?? -1) >= 0;
    const q = eo(seg(lt, fromToc ? .05 : .25, .45));
    for (let i = 0; i < n; i++) {
      const was = i === pOn ? 1 : 0, now = i === on ? 1 : 0;
      hiA[i] = was + (now - was) * q;
      const d0 = pDim ? (i === pOn ? 0 : 1) : 0, d1 = i === on ? 0 : 1;
      dimA[i] = d0 + (d1 - d0) * q;
    }
  }
  const two = n > 6, RW = two ? 760 : 1180, NS = two ? 66 : 78, FS = two ? 50 : 58;   /* 10/13 롱폼⑬: 챕터 7개 이상이면 두 열(10개 구단 목차가 세로로 넘쳐 0.7배로 줄던 것) */
  /* 10/13 밤 사용자("원 안 숫자 빼고 순위랑 팀만 · 좌측 상단 1위 … 우측 하단 10위"): s.noNum = 번호 원 없앰, s.rankGrid = 제목의 'N위' 로 자리(왼쪽 열 1~5위, 오른쪽 열 6~10위, 위에서 아래) */
  const RK = c => +((String(c.title).match(/^(\d+)위/) || [])[1] || 0), half = Math.ceil(n / 2);
  const items = CH.map((c, i) => {
    const a = hiA[i], p = vis[i], r = RK(c), gpos = two && s.rankGrid && r ? `grid-column:${r <= half ? 1 : 2};grid-row:${r <= half ? r : r - half};` : two && s.colMajor ? `grid-column:${i < half ? 1 : 2};grid-row:${i < half ? i + 1 : i - half + 1};` : '';   /* 10/16 사용자: s.colMajor = 왼쪽 열을 위에서 아래로 먼저 채우고 오른쪽 열(기본 규칙~4위 | 3위~정리) */
    return `<div class="row" style="${gpos}gap:${two ? 20 : 28}px;justify-content:flex-start;width:${RW}px;padding:${two ? 14 : 19}px ${two ? 28 : 36}px;border-radius:26px;background:${mixC('#FFFFFF', ACC, a)};border:4px solid ${mixC(LINE, ACC, a)};
      box-shadow:0 10px 28px rgba(18,22,31,${(.06 + .12 * a).toFixed(3)});opacity:${((1 - .58 * dimA[i]) * c01(p * 1.4)).toFixed(3)};transform:translateY(${((1 - eo(p)) * 26).toFixed(1)}px) scale(${(1 + .035 * a).toFixed(4)})">
      ${s.noNum ? '' : `<div class="num" style="width:${NS}px;height:${NS}px;border-radius:50%;flex:0 0 auto;background:${mixC('#12161F', '#FFFFFF', a)};color:${mixC('#FFFFFF', ACC, a)};display:flex;align-items:center;justify-content:center;font-size:${two ? 38 : 44}px;font-weight:900">${i + 1}</div>`}
      <div style="font-size:${FS}px;font-weight:900;letter-spacing:-2px;color:${mixC(TXT, '#FFFFFF', a)};white-space:nowrap">${esc(c.title)}</div></div>`;
  }).join('');
  /* 10/18 사용자("유격수 후보 7명이라는데 화면은 목차뿐"): s.text = 목차 아래 한 줄(대사의 숫자를 화면에도) */
  const tx = s.text ? `<div class="big gold" style="margin-top:26px;text-align:center;font-size:${s.size || 60}px;${pop(pk(s, s.textAt, .5, seg(lt, .35, .5)))}">${br(s.text)}</div>` : '';
  wrapC((two ? `<div style="display:grid;grid-template-columns:repeat(2,${RW}px);gap:16px 24px;justify-content:center">${items}</div>` : `<div class="col" style="gap:${n > 4 ? 18 : 24}px">${items}</div>`) + tx);
};

/* gantt: 팀 수명 막대 — 연도 커서가 흐르며 막대가 자라고, 해체된 팀은 회색으로 끝난다.
   rows:[{name,spans:[[a,b]],kind:'bank'|'co',people:[..]}], show:N, from/until(커서), marks:[{y,label,color}], hi:[이름], ended:true, labels:{이름:[사람]} */
SCENE.gantt = (lt, s) => {
  const Y0 = s.y0 || 1946, Y1 = s.y1 || 2003, rows = (s.rows || []).slice(0, s.show || 99), n = rows.length;
  /* 9/28: 이름 칸 폭을 전체 팀 이름(보이지 않는 줄 포함 → 이어지는 장면끼리 폭이 같다) 길이에 맞춘다.
     예전엔 330 고정에 오른쪽 정렬이라 짧은 은행 이름일 때 그림 덩어리가 오른쪽으로 쏠려 보였다 */
  const estW = t => [...String(t)].reduce((a, c) => a + (/[가-힣]/.test(c) ? 36 : /[·\s]/.test(c) ? 16 : 22), 0);
  const W = 1180, LW = Math.min(330, Math.max(160, ...(s.rows || []).map(r => estW(r.label || r.name) + 34))), NA = (s.rows || []).length || n, RH = Math.min(NA <= 5 ? 84 : 62, Math.floor(560 / Math.max(1, NA))), BH = Math.round(RH * .62);
  const prevLab = (s._same && s._prev && s._prev.labels) || {};
  const x = y => (c01((y - Y0) / (Y1 - Y0)) * W);
  const cur = s.from != null ? s.from + (s.until - s.from) * eo(seg(lt, .15, 1.2)) : (s.until || Y1);
  const NEW = s.newFrom ?? n, hiSet = new Set(s.hi || []);
  let h = titleH(lt, s, 52, 18, s._same);
  h += `<div style="position:relative;width:${LW + W}px;left:-30px">`;   /* 9/28: 오른쪽 끝 연도 글자(2003·해체 연도) 만큼 살짝 왼쪽으로 → 그림 덩어리 가운데 */
  /* 축 */
  const ticks = s.ticks || [1946, 1960, 1970, 1982, 1990, 1997, 2003];
  h += `<div style="position:relative;height:44px;margin-left:${LW}px;width:${W}px">${ticks.map(y => `<div class="num" style="position:absolute;left:${x(y)}px;transform:translateX(-50%);font-size:28px;font-weight:800;color:${GRAY}">${y}</div>`).join('')}</div>`;
  h += `<div style="position:relative">`;
  rows.forEach((r, i) => {
    const p = i < NEW ? 1 : seg(lt, .05 + (i - NEW) * .15, .4), end = Math.max(...r.spans.map(z => z[1])), dead = cur >= end - .01 && end < Y1 + 1, isHi = hiSet.has(r.name);
    const base = r.kind === 'bank' ? '#3B6FD8' : '#F08A24';
    const col = isHi ? ACC : dead ? '#B8C0CC' : base;
    const bars = r.spans.map(([a, b]) => { const bb = Math.min(b, Math.max(a, cur)); if (bb <= a) return '';
      return `<div style="position:absolute;left:${x(a)}px;width:${Math.max(4, x(bb) - x(a))}px;top:${(RH - BH) / 2}px;height:${BH}px;border-radius:${BH / 2}px;background:${col};${isHi ? 'box-shadow:0 0 0 4px ' + ACC + '33' : ''}"></div>`; }).join('');
    const endLab = (s.endLabels && dead && (s.endLabels === true || s.endLabels.includes(r.name))) ? `<div class="num" style="position:absolute;left:${x(end) + 12}px;top:${(RH - 34) / 2}px;font-size:26px;font-weight:900;color:${isHi ? ACC : GRAY};white-space:nowrap">${end}</div>` : '';
    const ppl = (s.labels && s.labels[r.name] || []);
    const visEnd = Math.min(end, Math.max(r.spans[0][0], cur));   /* 9/28: 사람 이름표는 보이는 막대 끝 오른쪽에 */
    const pch = ppl.map((nm, j) => `<div style="position:absolute;left:${x(visEnd) + 18 + j * 142}px;top:${(RH - 48) / 2}px;height:48px;padding:0 20px;border-radius:999px;background:#12161F;color:#fff;font-size:31px;font-weight:900;display:flex;align-items:center;white-space:nowrap;${(prevLab[r.name] || []).includes(nm) ? '' : pop(seg(lt, .3 + j * .2, .4))}">${esc(nm)}</div>`).join('');   /* 9/28: 앞 장면에 있던 이름표는 그대로 */
    h += `<div style="display:flex;align-items:center;height:${RH}px;${i < NEW ? '' : rise(p, 16)}">
      <div style="width:${LW}px;flex:0 0 ${LW}px;text-align:left;padding-right:24px;font-size:${RH > 52 ? 36 : 31}px;font-weight:900;letter-spacing:-1px;white-space:nowrap;color:${dead && !isHi ? GRAY : TXT}">${esc(r.label || r.name)}</div>
      <div style="position:relative;width:${W}px;height:${RH}px;border-bottom:1px solid ${LINE}">${bars}${pch}${endLab}</div></div>`;
  });
  if (n < NA) h += `<div style="height:${(NA - n) * RH}px"></div>`;   /* 9/28: 뒤에 나올 줄 자리를 미리 비워 둔다(줄이 늘 때 표가 위로 밀리지 않게) */
  /* 세로선 */
  (s.marks || []).forEach((m, k) => {
    const q = s._same && (s._prev.marks || []).some(z => z.y === m.y) ? 1 : seg(lt, .1 + k * .15, .4);
    h += `<div style="position:absolute;left:${LW + x(m.y)}px;top:-8px;height:${n * RH + 16}px;width:4px;margin-left:-2px;background:${m.color || '#12161F'};opacity:${c01(q * 1.4) * .9}"></div>
      <div style="position:absolute;left:${LW + x(m.y)}px;top:${n * RH + 14}px;translate:-50% 0;background:${m.color || '#12161F'};color:#fff;font-size:28px;font-weight:900;padding:6px 16px;border-radius:999px;white-space:nowrap;${pop(q)}">${esc(m.label)}</div>`;
  });
  /* 커서 */
  if (s.from != null) h += `<div style="position:absolute;left:${LW + x(cur)}px;top:-6px;height:${n * RH + 12}px;width:3px;margin-left:-1px;background:${ACC};opacity:.55"></div>`;
  h += `</div></div>`;
  /* 9/28: 배지는 표 아래 빈자리 위에 띄운다 → 배지가 있든 없든 표 위치가 같다(이어지는 장면에서 표가 들썩이지 않게) */
  if (s.badge) h = h.replace(/<\/div><\/div>$/, '') + `<div style="position:absolute;left:${LW}px;width:${W}px;top:${n * RH + ((s.marks || []).length ? 64 : 22)}px;display:flex;justify-content:center"><div class="badge" style="background:${ACC};font-size:40px;padding:12px 30px;${pop(seg(lt, .5, .45))}">${esc(s.badge)}</div></div></div></div>`;
  if ((s.marks || []).length) h += `<div style="height:48px"></div>`;
  wrapC(h);
};

/* flow: 진로 흐름도 — 왼쪽 큰 상자에서 띠가 갈라져 나간다(굵기 = 인원). dir:'in' 이면 여러 곳 → 한 곳 */
SCENE.flow = (lt, s) => {
  const W = 1500, H = 560, bands = s.bands || [], NEW = s.newFrom ?? 0, n = bands.length;
  const tot = bands.reduce((a, b) => a + (b.w || 1), 0), GAP = 18, avail = H - GAP * (n - 1);
  const srcX = 0, srcW = 330, dstX = 1080, dstW = 420, bandH = b => Math.max(10, (b.w || 1) / tot * avail);
  let yR = 0, yL = (H - Math.max(...[avail * .98, 0])) / 2, svg = '', boxes = '';
  const Ltot = bands.reduce((a, b) => a + bandH(b), 0), L0 = (H - Ltot) / 2;
  let accL = L0;
  bands.forEach((b, i) => {
    const bh = bandH(b), p = i < NEW ? 1 : seg(lt, .25 + (i - NEW) * .28, .6), c = b.hi ? ACC : (b.color || '#AEB6C3');
    const x1 = srcX + srcW, x2 = dstX, yl = accL, yr = yR;
    const xm = x1 + (x2 - x1) * eo(p);
    const path = `M${x1},${yl} C${(x1 + x2) / 2},${yl} ${(x1 + x2) / 2},${yr} ${x2},${yr} L${x2},${yr + bh} C${(x1 + x2) / 2},${yr + bh} ${(x1 + x2) / 2},${yl + bh} ${x1},${yl + bh} Z`;
    svg += `<clipPath id="fc${i}"><rect x="0" y="0" width="${xm}" height="${H}"/></clipPath><path d="${path}" fill="${c}" fill-opacity="${b.dashed ? .18 : .55}" ${b.dashed ? `stroke="${c}" stroke-width="4" stroke-dasharray="14 10"` : ''} clip-path="url(#fc${i})"/>`;
    boxes += `<div style="position:absolute;left:${dstX + 18}px;top:${yr + bh / 2}px;transform:translateY(-50%);display:flex;align-items:baseline;gap:14px;white-space:nowrap;opacity:${c01((p - .5) * 3)}">
      <span style="font-size:${n > 4 ? 40 : 46}px;font-weight:900;letter-spacing:-1.5px;line-height:1.2;text-align:left;color:${b.hi ? ACC : TXT}">${br(b.label)}</span>${b.n ? `<span class="num" style="font-size:${n > 4 ? 40 : 52}px;font-weight:900;color:${b.hi ? ACC : TXT}">${esc(b.n)}</span>` : ''}${b.sub ? `<span style="font-size:30px;font-weight:700;color:${GRAY}">${esc(b.sub)}</span>` : ''}</div>`;
    accL += bh; yR += bh + GAP;
  });
  const src = s.src || {};
  const srcBox = `<div style="position:absolute;left:${srcX}px;top:${L0 - 20}px;width:${srcW}px;height:${Ltot + 40}px;border-radius:26px;background:#12161F;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;${s._same ? '' : pop(seg(lt, 0, .4))}">
    <div style="font-size:34px;font-weight:800;opacity:.8;text-align:center;line-height:1.2">${br(src.label || '')}</div><div class="num" style="font-size:${String(src.n || '').length > 5 ? 70 : 88}px;font-weight:900;letter-spacing:-3px">${esc(src.n || '')}</div></div>`;
  let h = titleH(lt, s, 52, 20, s._same);
  h += `<div style="position:relative;width:${W}px;height:${H}px"><svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;overflow:visible">${svg}</svg>${srcBox}${boxes}</div>`;
  h += textH(lt, s, .4 + n * .28, 68);
  wrapC(h);
};

/* cells: 칸 채우기(17개 시도 · 리그 8칸) — items:[{t,on,x}], dim:true 면 전체 흐려지고 가운데 큰 글씨(center) */
SCENE.cells = (lt, s) => {
  const its = s.items || [], cols = s.cols || 6, cw = s.cw || 230, chh = s.ch || 110;
  let h = titleH(lt, s, 52, 26, s._same);
  const dimP = s.dim ? seg(lt, .2, .6) : 0;
  h += `<div style="position:relative"><div style="display:grid;grid-template-columns:repeat(${cols},${cw}px);gap:16px;justify-content:center;filter:grayscale(${dimP});opacity:${1 - dimP * .7}">` + its.map((it, i) => {
    const p = s._same ? 1 : pk(s, it.at, .35, seg(lt, .1 + i * Math.min(.06, 1 / its.length), .35)), on = it.on !== false;
    const ic = it.icon && ICON[it.icon] ? `<div style="width:${Math.round(chh * .55)}px;height:${Math.round(chh * .55)}px;flex:0 0 auto;margin-right:18px">${ICON[it.icon](it.hi || it.bad ? '#fff' : (it.c || ACC))}</div>` : '';
    return `<div style="height:${chh}px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:${it.fs || 40}px;font-weight:900;letter-spacing:-1px;
      background:${on ? (it.bad ? RED : it.hi ? (it.c || ACC) : '#fff') : 'transparent'};color:${on ? (it.hi || it.bad ? '#fff' : TXT) : '#AAB2BF'};border:4px ${on ? 'solid' : 'dashed'} ${on ? (it.bad ? RED : it.hi ? (it.c || ACC) : LINE) : '#C9D0DB'};line-height:1.15;text-align:center;${s._same ? '' : pop(p)}">${ic}${br(it.t || '')}</div>`;
  }).join('') + `</div>`;
  if (s.center) h += `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div class="num" style="background:#12161F;color:#fff;font-size:120px;font-weight:900;letter-spacing:-4px;padding:18px 60px;border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.3);${pop(seg(lt, .5, .5))}">${esc(s.center)}</div></div>`;
  h += `</div>`;
  if (s.label) h += `<div class="badge" style="margin-top:30px;background:#12161F;font-size:38px;padding:12px 30px;${rise(seg(lt, .3, .4), 16)}">${esc(s.label)}</div>`;
  h += textH(lt, s, .8, 68);
  wrapC(h);
};

/* funnel: 깔때기 54 → 5 → 2 */
SCENE.funnel = (lt, s) => {
  const lv = (s.levels || []).slice(0, s.show || 99), NEW = s.newFrom ?? 0, n = lv.length, MAXW = 1300;
  let h = titleH(lt, s, 52, 26, s._same);
  h += `<div class="col" style="gap:14px">` + lv.map((l, i) => {
    const p = i < NEW ? 1 : seg(lt, .1 + (i - NEW) * .45, .5), w = Math.round(MAXW * Math.pow(.62, i)), last = i === n - 1 && n > 1;
    return `<div style="position:relative;display:flex;align-items:center;justify-content:center;${i < NEW ? '' : rise(p, 22)}">
      <div class="row" style="width:${w}px;height:130px;border-radius:${i ? 24 : 30}px;background:${last ? ACC : i ? '#3B4A63' : '#12161F'};color:#fff;gap:26px;clip-path:polygon(0 0,100% 0,${100 - 3}% 100%,3% 100%)">
        <span class="num" style="font-size:88px;font-weight:900;letter-spacing:-3px">${esc(l.n)}</span><span style="font-size:44px;font-weight:800">${esc(l.label || '')}</span></div>
      ${l.chip ? `<div style="position:absolute;left:100%;top:50%;transform:translateY(-50%);padding-left:28px"><div class="badge" style="background:#fff;color:${TXT};border:4px solid ${LINE};font-size:38px;padding:12px 26px;white-space:nowrap;${pop(seg(lt, .4 + (i - NEW) * .45, .4))}">${esc(l.chip)}</div></div>` : ''}</div>`;   /* 9/28: 칩은 막대 옆에 떠 있게(막대는 위 단과 같은 가운데 줄) */
  }).join('') + `</div>`;
  h += textH(lt, s, .5 + n * .45, 68);
  wrapC(h);
};

/* domino: 팀 칸이 차례로 쓰러진다(fall) / 쓰러진 채(down) / 한꺼번에 선다(rise) */
SCENE.domino = (lt, s) => {
  const n = s.n || 5, st = s.state || 'fall', W = 150, H = 300;
  let h = titleH(lt, s, 52, 30, false);
  const lean = st === 'fall' ? eo(seg(lt, .3 + (n - 1) * .22, .35)) : st === 'down' ? 1 : 1 - eo(seg(lt, .3, .7));
  h += `<div class="row" style="gap:70px;align-items:flex-end;height:${H + 40}px;transform:translateX(${(-120 * lean).toFixed(1)}px)">` + Array.from({ length: n }, (_, i) => {   /* 9/28: 쓰러진 칸은 오른쪽으로 눕는다 → 그만큼 왼쪽으로 옮겨 가운데 */
    let a;
    if (st === 'fall') a = 72 * eo(seg(lt, .3 + i * .22, .35));
    else if (st === 'down') a = 72;
    else a = 72 * (1 - eo(seg(lt, .3, .7)));
    const c = st === 'rise' ? ACC : a > 40 ? '#B8C0CC' : '#12161F';
    return `<div style="width:${W}px;height:${H}px;border-radius:20px;background:${c};transform-origin:100% 100%;transform:rotate(${a}deg);display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:900;writing-mode:vertical-rl;letter-spacing:4px;box-shadow:0 12px 30px rgba(18,22,31,.18)">${esc((s.labels || [])[i] || '팀')}</div>`;
  }).join('') + `</div><div style="width:1300px;height:8px;border-radius:4px;background:#12161F;opacity:.25"></div>`;
  if (s.caption) h += `<div class="row" style="gap:18px;margin-top:30px;${rise(seg(lt, .2, .4), 16)}">${s.caption.map((c, k) => `${k ? `<span style="font-size:48px;font-weight:900;color:${GRAY}">→</span>` : ''}<span class="badge" style="background:${k === s.caption.length - 1 ? ACC : '#12161F'};font-size:38px;padding:12px 28px">${esc(c)}</span>`).join('')}</div>`;
  h += textH(lt, s, 1.4, 68);
  wrapC(h);
};

/* flip: 뒤집힌 카드가 하나씩 열린다. items:[{back, sub, kind:'quote'|'flow'}], open:N, was:앞 장면에서 이미 열린 수 */
SCENE.flip = (lt, s) => {
  const its = s.items || [], open = s.open || 0, was = s.was || 0;
  let h = s.tag ? `<div class="tagout" style="margin-bottom:26px;${s._same || was ? '' : rise(seg(lt, 0, .4), 16)}">${esc(s.tag)}</div>` : '';
  h += `<div class="row" style="gap:44px;align-items:stretch">` + its.map((it, i) => {
    const isOpen = i < open, anim = isOpen && i >= was, p = anim ? seg(lt, .15, .6) : isOpen ? 1 : 0;
    const ang = 180 * (1 - eo(p)), showBack = ang < 90;
    const face = showBack
      ? `<div class="col" style="gap:22px;padding:40px 44px">${it.kind === 'quote' ? `<div style="position:absolute;left:40px;top:34px;font-size:120px;line-height:.9;font-weight:900;color:${ACC}">“</div>` : ''}
          <div style="font-size:${it.fs || 60}px;font-weight:900;letter-spacing:-2px;line-height:1.28;text-align:center;color:${TXT}">${br(it.back || '')}</div>
          ${it.sub ? `<div class="label" style="font-size:34px;text-align:center">${br(it.sub)}</div>` : ''}</div>`
      : `<div class="num" style="font-size:180px;font-weight:900;color:#fff;opacity:.9">${i + 1}</div>`;
    return `<div style="position:relative;width:${its.length > 2 ? 520 : 760}px;min-height:520px;border-radius:36px;display:flex;align-items:center;justify-content:center;
      background:${showBack ? '#fff' : '#12161F'};border:4px solid ${showBack ? (it.hi ? ACC : LINE) : '#12161F'};box-shadow:0 18px 48px rgba(18,22,31,.12);
      transform:perspective(1600px) rotateY(${showBack ? ang : 180 - ang}deg);${was || s._same ? '' : rise(seg(lt, i * .15, .4), 30)}">${face}</div>`;
  }).join('') + `</div>`;
  wrapC(h);
};

/* quote: 보도 인용 카드 — 매체·날짜 + 원문 한 문장 */
SCENE.quote = (lt, s) => {
  let h = `<div class="pane col" style="width:1500px;border-radius:40px;padding:56px 80px;gap:28px;align-items:flex-start;${rise(seg(lt, 0, .45), 30)}">
    ${(s.src || s.date) ? `<div class="row" style="gap:18px">${s.src ? `<span class="badge" style="background:#12161F;font-size:36px;padding:10px 26px">${esc(s.src)}</span>` : ''}${s.date ? `<span class="num" style="font-size:36px;font-weight:800;color:${GRAY}">${esc(s.date)}</span>` : ''}</div>` : ''}
    <div style="display:flex;gap:26px;align-items:flex-start"><div style="font-size:160px;line-height:.75;font-weight:900;color:${ACC}">“</div>
      <div style="font-size:${s.fs || 66}px;font-weight:900;letter-spacing:-2px;line-height:1.35;text-align:left;${rise(seg(lt, .2, .5), 16)}">${s.mark ? br(s.text).replace(esc(s.mark), `<span style="background:${ACC}26;box-shadow:inset 0 -18px 0 ${ACC}40">${esc(s.mark)}</span>`) : br(s.text)}</div></div>
    ${s.who ? `<div style="align-self:flex-end;font-size:40px;font-weight:800;color:${GRAY};${rise(seg(lt, .5, .4), 12)}">— ${esc(s.who)}</div>` : ''}</div>`;
  wrapC(h);
};


/* ───── 9/30 롱폼④(한화) 새 인포그래픽: rankline · password · scale · stack · contracts · zigzag ─────
   화면 글자는 이름·숫자·짧은 라벨만. cont:true 면 앞 장면 그림을 그대로 두고 새 부분만 움직인다. */

/* rankline: 연도별 순위 계단(1위 위 · 꼴찌 아래). series:[{name, color, pts:[[연도, 순위, 'last'|'ps'|'hi', '라벨']]}],
   from/to = 가로축 연도, show = 여기까지 그림, newFrom = 이 연도부터 새로 그려짐(앞은 그대로), teams = 세로축 칸 수 */
SCENE.rankline = (lt, s) => {
  const Y0 = s.from, Y1 = s.to, NT = s.teams || 10, W = s.w || 1560, H = s.h || 470, PADX = 46, R = s.r || 30;
  const x = y => PADX + (Y1 === Y0 ? .5 : (y - Y0) / (Y1 - Y0)) * (W - PADX * 2), yy = r => 18 + (r - 1) / (NT - 1) * (H - 36);
  const show = s.show ?? Y1, NEW = s.newFrom ?? (s._same ? show + 1 : Y0);
  let svg = '', dots = '';
  for (let r = 1; r <= NT; r++) svg += `<line x1="0" x2="${W}" y1="${yy(r)}" y2="${yy(r)}" stroke="${r === NT ? '#E5484D55' : LINE}" stroke-width="${r === NT ? 3 : 2}" ${r === NT ? 'stroke-dasharray="10 8"' : ''}/>`;
  (s.series || []).forEach((se, si) => {
    const pts = (se.pts || []).filter(p => p[0] >= Y0 && p[0] <= Math.min(Y1, show));
    const nNew = pts.filter(p => p[0] >= NEW).length, step = Math.min(s.step || .18, (s.span || 1.5) / Math.max(1, nNew));   /* 9/30: s.span = 점 전체가 찍히는 시간(초, 줄 길이에 맞춰 늘어남) */
    const col = se.color || ACC;
    let path = '', k = 0;
    pts.forEach((p, i) => {
      const isNew = p[0] >= NEW, q = isNew ? seg(lt, .15 + si * .3 + (k++) * step, .3) : 1;
      if (i > 0) { const a = pts[i - 1], xa = x(a[0]), ya = yy(a[1]), xb = x(p[0]), yb = yy(p[1]);
        path += `<line x1="${xa}" y1="${ya}" x2="${(xa + (xb - xa) * eo(q)).toFixed(1)}" y2="${(ya + (yb - ya) * eo(q)).toFixed(1)}" stroke="${col}" stroke-width="7" stroke-linecap="round" opacity="${q > 0 ? .55 : 0}"/>`; }
      const kind = p[2] || '', c = kind === 'last' ? RED : kind === 'ps' || kind === 'hi' ? col : '#8A93A3';
      const big = kind === 'hi';
      dots += `<div class="num" style="position:absolute;left:${x(p[0])}px;top:${yy(p[1])}px;width:${(big ? 1.35 : 1) * R * 2}px;height:${(big ? 1.35 : 1) * R * 2}px;margin:-${(big ? 1.35 : 1) * R}px 0 0 -${(big ? 1.35 : 1) * R}px;border-radius:50%;
        background:${c};color:#fff;display:flex;align-items:center;justify-content:center;font-size:${Math.round(R * (big ? 1.3 : 1.05))}px;font-weight:900;letter-spacing:-1px;box-shadow:0 6px 16px rgba(18,22,31,.18);${kind === 'ps' || big ? `outline:5px solid ${col}44;` : ''}${isNew ? pop(seg(lt, .15 + si * .3 + (k - 1) * step + .1, .3)) : ''}">${p[1]}</div>`;
      if (p[4] && p[4].length) { const fs = p[4], D = s.faceD || 112;   /* 9/30: 점 옆 작은 동그라미 얼굴(준우승 폰세·와이스) */
        fs.forEach((f, j) => { const src = photoSrc(f.img), q = isNew || !s._same ? seg(lt, .35 + si * .3 + k * step + j * .15, .4) : 1;
          const fx = x(p[0]) - R * 1.4 - (fs.length - j) * (D + 10), fy = yy(p[1]) - D / 2 + 6;
          dots += `<div style="position:absolute;left:${fx}px;top:${fy}px;width:${D}px;text-align:center;opacity:${c01(q * 1.6)};transform:scale(${(.4 + .6 * eb(q)).toFixed(3)}) rotate(${(j ? 6 : -6)}deg)">
            <div style="width:${D}px;height:${D}px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 6px 16px rgba(18,22,31,.25);background:#E9EDF3">${src ? `<img src="${src}" style="width:100%;height:100%;object-fit:cover">` : ''}</div>
            <div style="display:inline-block;margin-top:4px;background:${col};color:#fff;font-size:24px;font-weight:900;padding:2px 12px;border-radius:999px;white-space:nowrap">${esc(f.name || '')}</div></div>`; }); }
      if (p[3]) dots += `<div style="position:absolute;left:${x(p[0])}px;top:${yy(p[1]) + (p[1] > NT / 2 ? -R * 2.9 : R * 1.5)}px;translate:-50% 0;background:${c};color:#fff;font-size:30px;font-weight:900;padding:6px 16px;border-radius:999px;white-space:nowrap;${isNew || !s._same ? pop(seg(lt, .3 + si * .3 + k * step, .35)) : ''}">${esc(p[3])}</div>`;
    });
    svg += path;
    if (se.name && (s.series || []).length > 1) {
      const last = pts[pts.length - 1];
      if (last) dots += `<div style="position:absolute;left:${x(last[0]) + R * 1.6}px;top:${yy(last[1])}px;transform:translateY(-50%);font-size:34px;font-weight:900;color:${col};white-space:nowrap">${esc(se.name)}</div>`;
    }
  });
  const every = s.every || (Y1 - Y0 > 12 ? 2 : 1);
  let ax = '';
  for (let y = Y0; y <= Y1; y++) if ((y - Y0) % every === 0 || y === Y1 || (s.ticks || []).includes(y))
    ax += `<div class="num" style="position:absolute;left:${x(y)}px;top:${H + 12}px;transform:translateX(-50%);font-size:28px;font-weight:800;color:${(s.ticks || []).includes(y) ? TXT : GRAY}">${y}</div>`;
  const yl = `<div style="position:absolute;left:-58px;top:${yy(1)}px;transform:translateY(-50%);font-size:28px;font-weight:900;color:${GRAY}">1위</div><div style="position:absolute;left:-${NT >= 10 ? 72 : 58}px;top:${yy(NT)}px;transform:translateY(-50%);font-size:28px;font-weight:900;color:${RED}">${NT}위</div>`;
  let h = titleH(lt, s, 52, 18, s._same);
  h += `<div style="position:relative;width:${W}px;height:${H + 52}px;margin-left:40px"><svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;overflow:visible">${svg}</svg>${yl}${dots}${ax}</div>`;
  if (s.label) h += `<div class="badge" style="margin-top:14px;background:#12161F;font-size:36px;padding:10px 28px;${s._same && s._prev.label === s.label ? '' : rise(seg(lt, .5, .4), 14)}">${esc(s.label)}</div>`;
  wrapC(h);
};

/* password: 숫자 10개가 입력창에 하나씩 찍히고 아래에 연도가 붙는다. red:[칸 번호] 빨강(꼴찌), cont 면 이미 찍힌 상태 */
SCENE.password = (lt, s) => {
  const d = String(s.digits || ''), ys = s.years || [], n = d.length, red = new Set(s.red || []), BW = 132, BH = 176;
  const typed = s._same ? 1e9 : 0;
  let h = titleH(lt, s, 52, 26, s._same);
  h += `<div class="pane" style="border-radius:34px;padding:34px 40px 28px;${s._same ? '' : rise(seg(lt, 0, .35), 24)}"><div class="row" style="gap:12px;align-items:flex-start">` + [...d].map((c, i) => {
    const q = s._same ? 1 : seg(lt, .2 + i * .14, .18), r = red.has(i), rp = r ? (s._same && (s._prev.red || []).includes(i) ? 1 : seg(lt, .3 + [...red].indexOf(i) * .12, .35)) : 0;
    const bg = mixC('#12161F', '#E5484D', rp);
    return `<div class="col" style="gap:12px;width:${BW}px">
      <div class="num" style="width:${BW}px;height:${BH}px;border-radius:22px;background:${q > 0 ? bg : '#F4F6FA'};border:4px solid ${q > 0 ? bg : LINE};color:#fff;display:flex;align-items:center;justify-content:center;font-size:118px;font-weight:900;letter-spacing:-3px;transform:scale(${(1 + .12 * Math.sin(Math.PI * q)).toFixed(3)})"><span style="opacity:${c01(q * 2)}">${c}</span></div>
      <div class="num" style="font-size:30px;font-weight:800;color:${r ? RED : GRAY};opacity:${c01(q * 2)}">${esc(ys[i] || '')}</div></div>`;
  }).join('') + `</div></div>`;
  if (s.label) h += `<div class="badge" style="margin-top:30px;background:${(s.red || []).length ? RED : '#12161F'};font-size:40px;padding:12px 32px;${s._same && s._prev.label === s.label ? '' : pop(seg(lt, s._same ? .4 : .3 + n * .14, .4))}">${esc(s.label)}</div>`;
  wrapC(h);
};

/* scale: 저울. left/right:{label, v, chips:[이름]}, tilt(도, +면 왼쪽이 내려감). cont 면 앞 기울기에서 이어서 */
SCENE.scale = (lt, s) => {
  const W = 1600, H = 620, cx = W / 2, cy = 140, L = 520;
  const t0 = s._same ? (s._prev.tilt || 0) : 0, q = eo(seg(lt, s._same ? .1 : .35, .9));
  const a = (t0 + ((s.tilt || 0) - t0) * q) * Math.PI / 180;   /* +: 왼쪽 아래로(시계 반대) */
  const lx = cx - L * Math.cos(a), ly = cy + L * Math.sin(a), rx = cx + L * Math.cos(a), ry = cy - L * Math.sin(a);
  const pan = (P, px, py, side) => { const pc = (P || {}).chips || [];
    return `<div style="position:absolute;left:${px}px;top:${py}px;width:2px;height:70px;background:#3B4A63"></div>
    <div class="col" style="position:absolute;left:${px}px;top:${py + 70}px;transform:translateX(-50%);width:500px;gap:10px">
      <div style="width:500px;height:16px;border-radius:0 0 200px 200px;background:#3B4A63"></div>
      <div class="pane col" style="width:480px;border-radius:30px;padding:26px 22px;gap:10px;border:4px solid ${side === 'L' ? (s.lcolor || ACC) : (s.rcolor || '#3B4A63')}">
        <div style="font-size:56px;font-weight:900;letter-spacing:-1.5px;white-space:nowrap">${esc((P || {}).label || '')}</div>
        ${(P || {}).v ? `<div class="num" style="font-size:100px;font-weight:900;letter-spacing:-3px;color:${side === 'L' ? (s.lcolor || ACC) : TXT}">${esc(P.v)}</div>` : ''}
        ${pc.length ? `<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">${pc.map((c, i) => `<span class="badge" style="background:${ACC};font-size:40px;padding:8px 22px;${(s._same && ((s._prev[side === 'L' ? 'left' : 'right'] || {}).chips || []).includes(c)) ? '' : pop(seg(lt, .5 + i * .2, .35))}">${esc(c)}</span>`).join('')}</div>` : ''}
      </div></div>`; };
  let h = titleH(lt, s, 52, 10, s._same);
  h += `<div style="position:relative;width:${W}px;height:${H}px;${s._same ? '' : rise(seg(lt, 0, .35), 24)}">
    <div style="position:absolute;left:${cx - 12}px;top:${cy}px;width:24px;height:${H - cy - 30}px;background:#3B4A63;border-radius:12px"></div>
    <div style="position:absolute;left:${cx - 150}px;top:${H - 40}px;width:300px;height:30px;border-radius:15px;background:#3B4A63"></div>
    <div style="position:absolute;left:${cx - L}px;top:${cy - 9}px;width:${L * 2}px;height:18px;border-radius:9px;background:#12161F;transform:rotate(${(-a * 180 / Math.PI).toFixed(2)}deg);transform-origin:50% 50%"></div>
    ${s.pivotLogo && LOGO[(T(s.pivotLogo) || {}).code] ? `<div style="position:absolute;left:${cx - 62}px;top:${cy - 62}px;width:124px;height:124px;border-radius:50%;background:#fff;border:6px solid ${ACC};box-shadow:0 8px 20px rgba(18,22,31,.2);display:flex;align-items:center;justify-content:center"><img src="${LOGO[(T(s.pivotLogo) || {}).code]}" style="width:84%;height:84%;object-fit:contain"></div>` : `<div style="position:absolute;left:${cx - 26}px;top:${cy - 26}px;width:52px;height:52px;border-radius:50%;background:${ACC}"></div>`}   <!-- 9/30: 저울 가운데 구단 로고(pivotLogo) -->
    ${pan(s.left, lx, ly, 'L')}${pan(s.right, rx, ry, 'R')}</div>`;
  wrapC(h);
};

/* stack: FA 계약 카드가 겨울별 칸에 쌓인다. cols:[{h:'2013 겨울', cards:[{n:'정근우', v:'70억'}]}],
   newFrom = 앞 장면에서 이미 보인 카드 수(앞에서부터), brace:{from,to,label} 칸 묶음 괄호, total:'255억+' */
SCENE.stack = (lt, s) => {
  const cols = s.cols || [], nc = cols.length, CW = Math.min(360, Math.floor(1680 / Math.max(1, nc)) - 24), NEW = s.newFrom ?? 0;
  let idx = 0, nNew = 0, h = titleH(lt, s, 52, 34, s._same);
  const PREV = s._same ? new Set((s._prev.cols || []).flatMap(c => (c.cards || []).map(x => x.n))) : null;   /* 9/30: 앞 장면에 있던 카드는 그대로, 새 카드만 떨어진다 */
  const maxN = Math.max(2, ...cols.map(c => (c.cards || []).length)), CH = maxN > 3 ? 108 : 128;
  h += `<div style="position:relative">`;
  if (s.brace) { const b = s.brace, pb = s._same && s._prev.brace && s._prev.brace.label === b.label ? 1 : seg(lt, .5, .45);
    const L0 = b.from * (CW + 24), L1 = (b.to + 1) * (CW + 24) - 24;
    h += `<div style="position:absolute;left:${L0}px;width:${L1 - L0}px;top:0;height:64px;${pop(pb)}"><div style="position:absolute;left:0;right:0;bottom:0;height:22px;border:5px solid ${ACC};border-bottom:none;border-radius:14px 14px 0 0"></div>
      <div style="position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:${ACC};color:#fff;font-size:34px;font-weight:900;padding:6px 22px;border-radius:999px;white-space:nowrap">${esc(b.label)}</div></div>`; }
  h += `<div class="row" style="gap:24px;align-items:flex-end;margin-top:76px">` + cols.map((c, ci) => {
    const cards = (c.cards || []).map(cd => { const i = idx++, isNew = PREV ? !PREV.has(cd.n) : i >= NEW, p = isNew ? seg(lt, .15 + (nNew++) * .22, .35) : 1;
      return `<div class="pane" style="width:${CW}px;height:${CH}px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:4px solid ${cd.hi ? ACC : LINE};${isNew ? `opacity:${c01(p * 1.4)};transform:translateY(${((1 - eo(p)) * -90).toFixed(1)}px)` : ''}">
        <div style="font-size:${CW < 260 ? 38 : 46}px;font-weight:900;letter-spacing:-1.5px;white-space:nowrap">${esc(cd.n)}</div>
        <div class="num" style="font-size:${CW < 260 ? 42 : 54}px;font-weight:900;color:${ACC};letter-spacing:-2px;white-space:nowrap">${esc(cd.v)}</div></div>`; }).reverse().join('');
    const had = PREV ? (c.cards || []).some(x => PREV.has(x.n)) : (idx - (c.cards || []).length) < NEW, empty = !(c.cards || []).length;
    return `<div class="col" style="gap:12px;width:${CW}px;justify-content:flex-end;height:${maxN * (CH + 12) + 60}px">${cards}
      <div class="num" style="font-size:32px;font-weight:900;color:${GRAY};white-space:nowrap;border-top:4px solid ${empty ? '#C9D0DB' : '#12161F'};padding-top:8px;width:100%;text-align:center;opacity:${empty ? .35 : had ? 1 : c01(.35 + seg(lt, .1, .3))}">${esc(c.h)}</div></div>`;   /* 9/30: 아직 안 나온 겨울 칸은 이름만 흐리게(자리 미리 잡음) */
  }).join('') + `</div></div>`;
  if (s.total) h += `<div class="num" style="margin-top:22px;background:#12161F;color:#fff;font-size:56px;font-weight:900;padding:10px 40px;border-radius:26px;letter-spacing:-2px;${s._same && s._prev.total === s.total ? '' : pop(seg(lt, .4 + nNew * .22, .45))}">${esc(s.total)}</div>`;
  wrapC(h);
};

/* contracts: 감독 계약 막대. rows:[{name, a, b, x, now, empty}] a=부임, b=계약 끝, x=중도 퇴진, now=진행 중 끝.
   newFrom = 앞 장면에서 보인 줄 수 */
SCENE.contracts = (lt, s) => {
  const Y0 = s.from || 2014.5, Y1 = s.to || 2027, rows = s.rows || [], n = rows.length, NEW = s.newFrom ?? (s._same ? (s._prev.rows || []).length : 0);
  const FACE = rows.some(r => photoSrc(r.img)), FD = n <= 2 ? 200 : 150;   /* 10/1 밤 사용자: 감독 계약에 사진(감독·단장) → 왼쪽 칸에 둥근 사진 + 이름 + 직책, 막대도 굵게 */
  const W = FACE ? 900 : 1100, LW = FACE ? 440 : 300;   /* 10/1 밤 사용자 "너무 오른쪽으로 치우쳤어" → 전체 1340 을 가운데에 */
  const RH = FACE ? (n <= 2 ? 250 : 190) : n > 5 ? 72 : n > 4 ? 84 : 104, BH = FACE ? (n <= 2 ? 72 : 56) : n > 5 ? 40 : 50, x = y => c01((y - Y0) / (Y1 - Y0)) * W;
  let h = titleH(lt, s, 52, 18, s._same);

  h += `<div style="position:relative;width:${LW + W}px"><div style="position:relative;height:40px;margin-left:${LW}px">${ticks.map(y => `<div class="num" style="position:absolute;left:${x(y)}px;transform:translateX(-50%);font-size:28px;font-weight:800;color:${GRAY}">${y}</div>`).join('')}</div>`;
  rows.forEach((r, i) => {
    const isNew = i >= NEW, p = isNew ? seg(lt, .1 + (i - NEW) * .4, .35) : 1, g = isNew ? eo(seg(lt, .25 + (i - NEW) * .4, .5)) : 1;
    let bar = '';
    if (r.text) bar = `<div style="position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:${FACE ? 44 : 34}px;font-weight:900;letter-spacing:-1.5px;color:${r.textColor || RED};white-space:nowrap;opacity:${c01((g - .3) * 3)}">${br(r.text)}</div>`;   /* 10/1 밤: 막대 대신 글(계약 기간을 모르는 단장 등) */
    else if (r.empty) bar = `<div style="position:absolute;left:${x(r.a)}px;width:${x(r.b) - x(r.a)}px;top:${(RH - BH) / 2}px;height:${BH}px;border-radius:${BH / 2}px;border:4px dashed #AAB2BF;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#AAB2BF">?</div>`;
    else {
      const end = r.x || r.now || r.b, cut = !!r.x;
      bar = `<div style="position:absolute;left:${x(r.a)}px;width:${x(r.b) - x(r.a)}px;top:${(RH - BH) / 2}px;height:${BH}px;border-radius:${BH / 2}px;background:#E3E7EE;border:3px dashed #B8C0CC"></div>
        <div style="position:absolute;left:${x(r.a)}px;width:${((x(end) - x(r.a)) * g).toFixed(1)}px;top:${(RH - BH) / 2}px;height:${BH}px;border-radius:${BH / 2}px;background:${cut ? '#3B4A63' : ACC}"></div>
        ${cut ? `<div style="position:absolute;left:${x(end)}px;top:${(RH - BH) / 2 - 10}px;width:8px;height:${BH + 20}px;margin-left:-4px;border-radius:4px;background:${RED};opacity:${c01((g - .9) * 10)}"></div>` : ''}
        ${r.tag ? `<div style="position:absolute;left:${x(r.b) + 16}px;top:50%;transform:translateY(-50%);font-size:${FACE ? 40 : 30}px;font-weight:900;color:${r.tagColor || (cut ? RED : ACC)};white-space:nowrap;opacity:${c01((g - .8) * 5)}">${esc(r.tag)}</div>` : ''}`;
    }
