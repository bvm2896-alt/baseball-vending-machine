<!doctype html>
<!-- 야구자판기 롱폼 썸네일 '한 줄 얼굴형(row)' 1280x720 (2026-10-11 신설, 롱폼⑪ MLB 직장폐쇄 → KBO 외국인 셈법)
     구도: 어두운 남색 밤 구장(조명 보케) + 왼쪽에 거대한 강철 자물쇠(MLB 글자, 쇠사슬) 뒤로 빛 + 왼쪽 아래 두꺼운 글씨 두 줄(흰 / 노랑)
           + 오른쪽 선수 누끼 2명(왼쪽을 보는 사진, 아래 서서히 어둠에 녹음). 보정은 가볍게(밝기·대비만).
     콘티 thumb: {"layout":"row","img":"누끼/그룹_…png"(row_comp.py 로 머리 크기 맞춰 합친 한 장),"people":[{"img":"누끼/…png","h":높이,"x":왼쪽,"y":위,"z":순서,"fade":px,"bright":1.0}],
                 "lines":[{"t":"…","c":"w|y|r","s":글씨px,"w":폭px,"mt":0}],"kicker":"…","lockText":"MLB"} -->
<html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:'PB';src:url('__FONT_DIR__/Pretendard-Black.otf')}
@font-face{font-family:'GM';src:url('__FONT_DIR__/GmarketSansBold.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#s{position:relative;width:1280px;height:720px;overflow:hidden;
 background:radial-gradient(ellipse 900px 600px at 30% 28%,#1B2F6E 0%,#0F1C4A 35%,#070E2A 65%,#02040F 100%)}
#fx{position:absolute;inset:0}
#deco{position:absolute;inset:0;pointer-events:none}
#ppl{position:absolute;inset:0}
#ppl img{position:absolute;filter:drop-shadow(0 0 2px rgba(190,215,255,.5)) drop-shadow(0 18px 30px rgba(0,0,0,.7))}
#mist{position:absolute;left:0;right:0;bottom:0;height:360px;background:linear-gradient(180deg,rgba(2,4,15,0) 0%,rgba(2,4,15,.55) 40%,rgba(1,2,10,.9) 75%,#010209 100%)}
#kick{position:absolute;left:56px;top:34px;font-family:'GM';font-size:34px;color:#FFE27A;letter-spacing:2px;text-shadow:0 2px 6px rgba(0,0,0,.8),0 0 16px rgba(255,200,60,.45)}
#txt{position:absolute;left:0;right:0;bottom:30px;display:flex;flex-direction:column;align-items:center}
.ln{position:relative;white-space:nowrap;line-height:1.02;font-family:'PB';letter-spacing:-4px}
.ln span{display:block}
.ln .ex{position:absolute;left:0;top:0;color:#000;transform:translate(0,6px);filter:blur(2px);opacity:.9}
.ln .fc{text-shadow:0 0 14px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.8)}
.ln .fc{position:relative}
.w .fc{color:#FFFFFF;text-shadow:0 0 18px rgba(120,170,255,.5)}
.y .fc{color:#FFD83C;text-shadow:0 0 22px rgba(255,200,40,.6)}
.r .fc{color:#FF4D5A;text-shadow:0 0 22px rgba(255,80,90,.6)}
.box .fc{background:#E3101E;color:#fff;padding:4px 22px 10px;border-radius:14px;text-shadow:none;box-shadow:0 10px 24px rgba(0,0,0,.6)}
.box .ex{display:none}
</style></head><body><div id="s"><canvas id="fx" width="1280" height="720"></canvas><div id="deco"></div>
<div id="ppl"></div><div id="mist"></div><div id="kick"></div><div id="txt"></div></div>
<script>
window.__thumbAsync=true;
const TH=(window.EP&&EP.thumb)||{}, P=(window.EP&&EP.photos)||{};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const src=n=>{if(!n)return '';if(P[n])return P[n];const k=Object.keys(P).find(x=>x.endsWith(n)||n.endsWith(x));return k?P[k]:''};
/* 배경: 조명탑 빛기둥 2개 + 관중석 보케 + 쇠사슬 */
let sd=11;const R=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
const c=document.getElementById('fx').getContext('2d');
for(let i=0;i<70;i++){const x=R()*1280,y=R()*380,r=5+R()*18;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(200,220,255,'+(.08+R()*.2)+')');g.addColorStop(1,'rgba(200,220,255,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
const D=document.getElementById('deco');
const chain=(x0,y0,n,ang,sc)=>{let o='';for(let i=0;i<n;i++){const x=x0+i*sc*1.5,y=y0;o+=`<g transform="translate(${x},${y}) rotate(${ang})"><rect x="${-sc*.95}" y="${-sc*.5}" width="${sc*1.9}" height="${sc}" rx="${sc*.5}" fill="none" stroke="${i%2?'#AEB7C6':'#6E7A90'}" stroke-width="${sc*.28}"/></g>`}return `<g transform="rotate(${ang} ${x0} ${y0})">${o}</g>`};
D.innerHTML=`<svg width="1280" height="720" viewBox="0 0 1280 720"><defs>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#9FC4FF" stop-opacity=".16"/><stop offset="1" stop-color="#5A8CFF" stop-opacity="0"/></linearGradient>
 <filter id="b18"><feGaussianBlur stdDeviation="18"/></filter><filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD98A" stop-opacity=".55"/><stop offset=".5" stop-color="#FF8A3C" stop-opacity=".18"/><stop offset="1" stop-color="#FF8A3C" stop-opacity="0"/></radialGradient></defs>
 <g style="mix-blend-mode:screen"><polygon points="-60,-40 120,-40 620,720 260,720" fill="url(#beam)" filter="url(#b18)" opacity=".7"/><polygon points="1160,-40 1340,-40 1080,720 700,720" fill="url(#beam)" filter="url(#b18)" opacity=".6"/></g>
 <ellipse cx="640" cy="150" rx="520" ry="240" fill="url(#glow)" opacity=".7"/>
</svg>`;
/* 선수 */
const PP=document.getElementById('ppl');if(TH.img&&!(TH.people||[]).length){const im=new Image();im.src=src(TH.img);im.style.cssText='left:0;top:0;width:1280px;height:720px;filter:contrast(1.04) saturate(1.04) drop-shadow(0 0 2px rgba(190,215,255,.45))';PP.appendChild(im)}(TH.people||[]).slice().sort((a,b)=>(a.z||0)-(b.z||0)).forEach(p=>{const im=new Image();im.src=src(p.img);im.style.cssText=`left:${p.x||0}px;top:${p.y||0}px;height:${p.h||600}px;filter:brightness(${p.bright||1}) contrast(1.04) saturate(1.04) drop-shadow(0 0 2px rgba(190,215,255,.5)) drop-shadow(0 18px 30px rgba(0,0,0,.7));${p.fade?`-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - ${p.fade}px),transparent 100%)`:''}`;PP.appendChild(im)});
if(TH.kicker)document.getElementById('kick').textContent=TH.kicker; else document.getElementById('kick').remove();
const LINES=TH.lines||[], T=document.getElementById('txt');
LINES.forEach(Ln=>{const d=document.createElement('div');d.className='ln '+(Ln.c||'w')+(Ln.box?' box':'');d.style.fontSize=(Ln.s||120)+'px';d.style.marginTop=(Ln.mt||0)+'px';
 d.innerHTML='<span class="ex">'+esc(Ln.t)+'</span><span class="fc">'+esc(Ln.t)+'</span>';T.appendChild(d)});
(async()=>{try{await document.fonts.ready}catch(e){}
 document.querySelectorAll('.ln').forEach((d,i)=>{const W=LINES[i].w;if(!W)return;let s=LINES[i].s||120;for(let k=0;k<30;k++){const w=d.querySelector('.fc').getBoundingClientRect().width;if(Math.abs(w-W)<3)break;s=s*W/w;d.style.fontSize=s+'px'}});
 await new Promise(r=>setTimeout(r,300));window.__thumbDone=true})();
</script></body></html>
